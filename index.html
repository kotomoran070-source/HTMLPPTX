<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Иконка вкладки ставится скриптом (логотип презентации); до этого — пустая, чтобы браузер не просил /favicon.ico -->
<link rel="icon" href="data:,">
<title>Презентация</title>
<!--slideria-boot-->
<style>
/*
 * Каркас страницы (src/engine/boot.ts): с первого кадра, пока строится настоящая страница, — её очертания
 * в цветах темы и с размерами панелей, которые запомнила студия. Страница готова — каркас растворяется.
 * Цвета — те же, что в src/styles/tokens.css
 */
#boot { position: fixed; inset: 0; z-index: 2147483000; pointer-events: none; color-scheme: light; --b-bg: #F8FAFC; --b-surf: #FDFEFF; --b-alt: #F3F4F6; --b-bd: #E5E7EB; --b-ph: #EAEDF2; --b-tx2: #374151; background: var(--b-alt); transition: opacity .22s ease-out; }
#boot.dark { color-scheme: dark; --b-bg: #0F172A; --b-surf: #162033; --b-alt: #0B1220; --b-bd: #263449; --b-ph: #1F2B40; --b-tx2: #CBD5E1; }
#boot.out { opacity: 0; }
#boot i { display: block; background: var(--b-ph); border-radius: 6px; }
#boot.b-studio { display: grid; grid-template-rows: 48px var(--rh, 113px) minmax(0, 1fr) 30px; }
.b-top, .b-rib, .b-foot { background: var(--b-surf); border-bottom: 1px solid var(--b-bd); }
.b-top { display: flex; align-items: center; gap: 14px; padding: 0 12px; }
.b-top .b-logo { width: 32px; height: 32px; border-radius: 9px; }
.b-tabs { display: flex; gap: 26px; margin-left: 30px; }
.b-tabs i { width: 58px; height: 11px; }
.b-r { margin-left: auto; display: flex; gap: 10px; }
.b-r i { width: 30px; height: 30px; border-radius: 8px; }
.b-r i.b-btn { width: 84px; }
.b-rib { display: flex; gap: 18px; padding: 14px 12px; }
.b-rib i { width: 120px; height: 72px; border-radius: 8px; opacity: .55; }
.b-body { display: grid; grid-template-columns: var(--lw, 212px) minmax(0, 1fr) var(--rw, 292px); min-height: 0; }
.b-left { background: var(--b-surf); border-right: 1px solid var(--b-bd); padding: 12px 10px 0 26px; overflow: hidden; }
.b-left i { aspect-ratio: 16 / 9; margin-bottom: 16px; border-radius: 6px; }
.b-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.b-canvas { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
#boot .b-slide { width: min(calc(100cqw - 80px), calc((100cqh - 80px) * 16 / 9)); aspect-ratio: 16 / 9; background: var(--b-bg); border: 1px solid var(--b-bd); border-radius: 4px; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
.b-notes { height: var(--nh, 128px); background: var(--b-surf); border-top: 1px solid var(--b-bd); }
.b-right { background: var(--b-surf); border-left: 1px solid var(--b-bd); padding: 22px 16px; }
.b-right i { height: 12px; margin-bottom: 16px; }
.b-foot { border-bottom: 0; border-top: 1px solid var(--b-bd); }
#boot.b-picker { background: radial-gradient(1200px 440px at 50% -140px, rgba(99, 102, 241, .10), transparent 70%), var(--b-bg); }
#boot.b-picker.dark { background: radial-gradient(1200px 440px at 50% -140px, rgba(99, 102, 241, .22), transparent 70%), var(--b-bg); }
.b-pk { max-width: 2200px; margin: 0 auto; padding: 14px clamp(20px, 3.2vw, 64px); box-sizing: border-box; }
.b-pkbar { display: flex; align-items: center; gap: 16px; height: 40px; }
.b-pk .b-mark { width: 32px; height: 32px; border-radius: 10px; flex: none; }
#boot .b-pk .b-search { flex: 1; max-width: 520px; height: 38px; margin-inline: auto; border-radius: 8px; background: var(--b-surf); border: 1px solid var(--b-bd); }
.b-pk .b-btn { width: 104px; height: 38px; border-radius: 8px; flex: none; }
.b-pk .b-btn2 { width: 120px; height: 38px; border-radius: 8px; flex: none; opacity: .8; }
#boot .b-cont { height: clamp(260px, 24vw, 460px); margin-top: 38px; border-radius: 12px; background: var(--b-surf); border: 1px solid var(--b-bd); }
.b-pkhead { display: flex; align-items: center; justify-content: space-between; margin: 40px 0 30px; }
.b-pk .b-h1 { width: 200px; height: 26px; border-radius: 8px; }
.b-pk .b-tools { width: 360px; height: 36px; border-radius: 8px; }
.b-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 34px 26px; }
#boot .b-grid i { aspect-ratio: 16 / 9; border-radius: 12px; background: var(--b-surf); border: 1px solid var(--b-bd); }
@media (max-width: 720px) { .b-pk .b-btn, .b-pk .b-btn2 { width: 44px; } .b-pk .b-tools { display: none; } }
@media (max-width: 520px) { #boot .b-pk .b-search { visibility: hidden; } }
#boot.b-show { background: var(--b-alt); }
/* Программа: заголовок окна — шапка страницы выбора; в студии — тонкая полоса над шапкой (engine/titlebar.ts) */
.app-frame #boot.b-studio { grid-template-rows: 40px 48px var(--rh, 113px) minmax(0, 1fr) 30px; }
.b-tbar { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 0 0 calc(10px + var(--tb-left, 0px)); background: var(--b-surf); }
#boot .b-tbar i { width: 28px; height: 28px; border-radius: 8px; }
#boot .b-tbar i.b-q { width: 20px; height: 20px; border-radius: 5px; opacity: .7; }
#boot .b-tbar i.b-t { position: absolute; left: 50%; translate: -50% 0; width: 220px; height: 12px; }
/* Страница выбора в программе: шапка во всю ширину окна — знак, кнопки слева, поиск по середине (engine/picker.css) */
.b-pktb { height: 48px; display: grid; gap: 16px; align-items: center; padding: 0 14px 0 calc(var(--tb-left, 0px) + 14px); grid-template-columns: minmax(max-content, 1fr) minmax(0, 480px) minmax(max(0px, calc(var(--tb-right, 0px) - 14px)), 1fr); }
.b-pktb span { display: flex; align-items: center; gap: 6px; }
#boot .b-pktb i { height: 32px; border-radius: 8px; }
#boot .b-pktb .b-mark { width: 28px; height: 28px; }
#boot .b-pktb .b-name { width: 78px; height: 12px; margin: 0 28px 0 4px; }
.b-pktb .b-btn { width: 96px; }
.b-pktb .b-btn2 { width: 106px; opacity: .8; }
.b-pktb .b-ib { width: 32px; }
#boot .b-pktb .b-search { background: var(--b-surf); border: 1px solid var(--b-bd); }
.app-frame #boot .b-pk { padding-top: 0; }
.b-wc { position: absolute; top: 0; right: 0; display: flex; height: var(--tb-h, 32px); color: var(--b-tx2); }
.b-wc span { width: 46px; display: grid; place-items: center; }
.b-wc svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
.app-frame #boot .b-cont { margin-top: 25px; }
</style>
<!--/slideria-boot-->
</head>
<body>
<!--slideria-boot-->
<script>
// Каркас страницы — до первого кадра (подробно — src/engine/boot.ts). Собранный файл презентации (у него
// <meta name="slideria-deck">) и страницы без сервера каркас не рисуют
(function () {
  var html = document.documentElement;
  var q = new URLSearchParams(location.search);
  if (document.querySelector('meta[name="slideria-deck"]') || location.protocol === 'file:') return;
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  // Выбранная тема — сразу, а не после загрузки кода: иначе первый кадр был бы в теме системы
  var t = get('htmlpptx-theme');
  if (t === 'light' || t === 'dark') html.setAttribute('data-theme', t);
  var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  var mode = q.has('studio') ? 'studio' : (!q.get('deck') || q.has('all')) ? 'picker' : 'show';
  // Программа без системного заголовка: высота полосы и место под кнопки окна — сразу, чтобы ничего не прыгнуло;
  // кнопки окна (Windows, Linux) каркас рисует те же, что потом страница (engine/titlebar.ts)
  var app = window.slideriaApp, frame = app && app.frame, wc = '';
  if (frame) {
    var tbh = mode === 'studio' ? 40 : mode === 'picker' ? 48 : 32;
    html.classList.add('app-frame');
    if (app.platform) html.setAttribute('data-platform', app.platform);
    html.style.setProperty('--tb-h', tbh + 'px');
    if (app.platform === 'darwin') {
      if (app.titleBar) app.titleBar({ height: tbh });
      var wco = navigator.windowControlsOverlay;
      if (wco && wco.visible) {
        var r = wco.getTitlebarAreaRect();
        html.style.setProperty('--tb-left', Math.round(r.x) + 'px');
        html.style.setProperty('--tb-right', Math.max(0, Math.round(innerWidth - r.x - r.width)) + 'px');
      }
    } else {
      var ws = (app.windowState && app.windowState()) || {};
      html.style.setProperty('--tb-right', ws.full ? '0px' : '138px');
      var g = function (d) { return '<span><svg viewBox="0 0 10 10">' + d + '</svg></span>'; };
      if (!ws.full) wc = '<div class="b-wc">' + g('<path d="M0 5.5h10"/>')
        + g(ws.max ? '<rect x=".5" y="2.5" width="7" height="7" rx="1.5"/><path d="M2.5 2.5V2A1.5 1.5 0 0 1 4 .5h4A1.5 1.5 0 0 1 9.5 2v4A1.5 1.5 0 0 1 8 7.5h-.5"/>' : '<rect x=".5" y=".5" width="9" height="9" rx="1.5"/>')
        + g('<path d="M.5.5l9 9m0-9l-9 9"/>') + '</div>';
    }
  }
  var el = document.createElement('div');
  el.id = 'boot';
  el.className = 'b-' + mode + (dark ? ' dark' : '');
  el.setAttribute('aria-hidden', 'true');
  var n = function (k, c) { var s = ''; for (var i = 0; i < c; i++) s += '<i></i>'; return '<div class="' + k + '">' + s + '</div>'; };
  if (mode === 'studio') {
    var lay = {};
    try { lay = JSON.parse(get('htmlpptx-studio-layout') || '{}') || {}; } catch (e) { /* раскладки ещё нет */ }
    var px = function (v, d, lo, hi) { v = Number(v); return Math.round(Math.max(lo, Math.min(hi, v > 0 ? v : d))) + 'px'; };
    el.style.setProperty('--lw', lay.left === false ? '0px' : px(lay.lw, 212, 120, 380));
    el.style.setProperty('--rw', lay.right === false ? '0px' : px(lay.rw, 292, 220, 520));
    el.style.setProperty('--nh', get('htmlpptx-studio-notes') === '0' ? '0px' : px(lay.nh, 128, 64, 420));
    if (lay.ribbon === false) el.style.setProperty('--rh', '0px');
    el.innerHTML = (frame ? '<div class="b-tbar"><i></i><i class="b-q" style="margin-left:14px"></i><i class="b-q"></i><i class="b-t"></i></div><div class="b-top"><span class="b-tabs" style="margin-left:6px">' : '<div class="b-top"><i class="b-logo"></i><i style="width:150px;height:12px"></i><span class="b-tabs">') + '<i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="b-r"><i></i><i></i><i class="b-btn"></i></span></div>'
      + (lay.ribbon === false ? '<div></div>' : n('b-rib', 8))
      + '<div class="b-body">' + (lay.left === false ? '<div></div>' : n('b-left', 9))
      + '<div class="b-main"><div class="b-canvas"><i class="b-slide"></i></div><div class="b-notes"></div></div>'
      + (lay.right === false ? '<div></div>' : '<div class="b-right"><i style="width:40%"></i><i style="width:70%;height:18px"></i><i></i><i style="width:85%"></i><i></i><i style="width:60%"></i></div>') + '</div>'
      + '<div class="b-foot"></div>';
  } else if (mode === 'picker') {
    el.innerHTML = (frame
      ? '<div class="b-pktb"><span><i class="b-mark"></i><i class="b-name"></i><i class="b-btn"></i><i class="b-btn2"></i><i class="b-ib"></i></span><i class="b-search"></i></div><div class="b-pk">'
      : '<div class="b-pk"><div class="b-pkbar"><i class="b-mark"></i><i class="b-search"></i><i class="b-btn"></i><i class="b-btn2"></i></div>')
      + '<i class="b-cont"></i><div class="b-pkhead"><i class="b-h1"></i><i class="b-tools"></i></div>' + n('b-grid', 12) + '</div>';
  }
  el.insertAdjacentHTML('beforeend', wc);
  html.appendChild(el);
  // Страница так и не сказала «готова» (ошибка до неё) — каркас всё равно уходит
  setTimeout(function () { if (el.isConnected) { el.classList.add('out'); setTimeout(function () { el.remove(); }, 300); } }, 8000);
})();
</script>
<!--/slideria-boot-->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
