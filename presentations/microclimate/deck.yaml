# Презентация как данные. Справочник компонентов: docs/COMPONENTS.md
# Правки видны сразу в yarn dev; файл для отправки: yarn build microclimate

title: Результаты применения комплекса контроля микроклимата
lang: ru
brand:
  name: Palorax
  logo: ./assets/logo.svg
css: |-
  :root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media(prefers-color-scheme:dark){}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  *{box-sizing:border-box}
  body{margin:0;height:100%;overflow:hidden;background:var(--alt);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #stage{position:absolute;left:50%;top:calc(50% - 28px);width:1280px;height:720px;transform-origin:center;overflow:hidden;border-radius:14px;border:1px solid var(--bd);box-shadow:0 8px 24px rgba(15,23,42,.10);background:radial-gradient(var(--bd) 1px,transparent 1px) 0 0/26px 26px,var(--bg)}
  .slide{display:none;position:absolute;inset:0;padding:48px 64px}
  .slide.on{display:block;animation:enter .55s cubic-bezier(.2,.7,.2,1) both}
  h1{font-size:46px;line-height:1.1;margin:22px 0 16px;font-weight:800;letter-spacing:-.02em}
  h2{font-size:32px;line-height:1.2;margin:0 0 24px;font-weight:700;letter-spacing:-.01em}
  h3{font-size:17px;margin:0 0 10px;font-weight:600}
  p{margin:0 0 10px;max-width:62ch;color:var(--tx2)}
  .lead{font-size:20px;color:var(--tx2)}
  .mu{color:var(--mu);font-size:14px}
  .card{background:var(--surf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.06);padding:20px}
  .g{display:grid;gap:22px}.g2{grid-template-columns:1.2fr 1fr}.g3{grid-template-columns:1.7fr 1fr}.gs{grid-template-columns:1fr 1fr}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;padding:8px 0;border-top:1px solid var(--bd);align-items:baseline;font-size:15px}
  .kv:first-of-type{border-top:0}.kv b{font-weight:600}
  .items div{padding:16px 0;border-top:1px solid var(--bd)}.items div:first-child{border-top:0;padding-top:0}
  .items b{display:block;font-size:19px;margin-bottom:2px}
  .logo{display:grid;place-items:center;width:88px;height:88px;background:#FDFEFF;border:2px solid var(--acb);border-radius:20px;box-shadow:0 2px 8px rgba(37,99,235,.14)}
  .logo svg{width:70%;height:70%}
  #lgs{position:absolute;top:22px;right:28px;width:40px;height:40px;border-radius:11px;border-width:1.5px;z-index:2}
  .bar1{height:8px;border-radius:9999px;background:var(--alt);overflow:hidden;margin-top:6px}
  .fill{height:100%;width:var(--w);background:var(--ac);border-radius:9999px}
  .slide.on .fill{animation:fw 1.4s .5s cubic-bezier(.2,.7,.2,1) both}
  .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
  .chain{display:flex;align-items:stretch;margin-bottom:16px}
  .node{flex:1;border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:16px}
  .node.hw{background:var(--acs);border-color:var(--acb)}
  .node b{display:block;margin-bottom:4px}.node span{font-size:14px;color:var(--tx2)}
  .wire{flex:0 0 30px;align-self:center;height:2px;background:var(--bd2);position:relative;overflow:hidden}
  .wire:after{content:"";position:absolute;top:-1px;left:0;width:10px;height:4px;border-radius:4px;background:var(--ac);animation:mv 1.6s linear infinite;animation-delay:var(--d,0s)}
  .dev{display:grid;place-items:center;align-content:center;gap:6px;background:var(--alt);border:1px solid var(--bd);border-radius:12px;padding:10px;overflow:hidden}
  .dev svg,.dev img{max-height:100%;width:100%;object-fit:cover}
  .chip{display:inline-block;border:1px solid var(--bd2);border-radius:9999px;padding:1px 11px;margin:0 6px 5px 0;font-size:13px;background:var(--surf)}
  .chip.a{background:var(--acs);border-color:var(--acb);color:var(--ach);font-weight:600}
  .pyr{display:flex;flex-direction:column;align-items:center;gap:10px}
  .lv{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  .lv.hw{background:var(--acs);border-color:var(--acb)}
  .lv>b{display:block;font-size:15px;margin-bottom:6px}
  .rw{display:flex;align-items:baseline;gap:8px}.rw em{flex:0 0 74px;font-style:normal;font-size:12px;color:var(--mu)}
  .pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
  .st{text-align:center;position:relative;padding-top:6px}
  .st i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 8px;border-radius:9999px;font-style:normal;font-weight:700;background:var(--alt);color:var(--mu);border:1px solid var(--bd2);position:relative;z-index:1;animation:act 6s infinite;animation-delay:calc(var(--k)*1s)}
  .st:before{content:"";position:absolute;top:23px;left:-50%;width:100%;height:2px;background:var(--bd2)}.st:first-child:before{display:none}
  .st b{display:block;font-size:15px}.st span{font-size:13px;color:var(--mu)}
  .pve{border:1.5px solid var(--acb);border-radius:12px;padding:14px;background:var(--acs)}
  .pve>b{display:block;margin-bottom:10px;color:var(--ach)}
  .ct{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ct div{background:var(--surf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px}.ct small{display:block;color:var(--mu);font-size:12px}
  .tg{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd);font-size:15px}.tg:first-of-type{border-top:0}
  .trk{width:110px;height:6px;border-radius:9999px;background:var(--alt);position:relative;margin:0 12px;flex:0 0 auto}
  .trk:after{content:"";position:absolute;top:-5px;left:var(--p);width:16px;height:16px;border-radius:9999px;background:var(--ac);animation:kn 2.4s ease-in-out .6s both}
  .strip{display:grid;grid-template-columns:repeat(60,1fr);gap:2px}.strip i{height:32px;border-radius:3px;background:var(--ac)}
  .bars{display:flex;align-items:flex-end;gap:12px;height:100px;margin-top:24px}
  .bars div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;transform-origin:bottom;position:relative}
  .bars small{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--tx2)}
  .slide.on .bars div{animation:gr .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.5s + var(--k)*.12s)}
  .slide.on .dr{stroke-dasharray:1;animation:dr 1.8s .3s ease-out both}.slide.on .fd{animation:fd 1s 1.1s both}
  .tx{fill:var(--mu);font-size:10px}
  .slide.on .r{animation:up .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*90ms + 120ms)}
  .ring{fill:none;stroke:var(--ac);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite;animation-delay:var(--d)}
  .ln{stroke:var(--bd2);stroke-width:1.5;stroke-dasharray:4 5}.ndv{fill:var(--surf);stroke:var(--acb);stroke-width:1.5}.pk,.sta{fill:var(--ac)}
  .items div{border-radius:10px;padding:14px;transition:background .2s}.items div:first-child{padding-top:14px}.items div.hl{background:var(--acs)}
  .hv{transition:box-shadow .2s,border-color .2s,background .2s}.node.hl,.lv.hl{box-shadow:0 0 0 3px var(--acb);border-color:var(--ac)}
  .chain .node{padding:12px 14px}
  .hb .nd{outline:none}.hb .nd rect{fill:var(--surf);stroke:var(--bd2);stroke-width:1.5;transition:fill .2s,stroke .2s}
  .hb .nd text{fill:var(--tx);font-size:14px;font-weight:600;transition:fill .2s}.hb .nd .sb{font-size:11px;font-weight:400;fill:var(--mu)}
  .hb .nd.hl rect{fill:var(--ac);stroke:var(--ac)}.hb .nd.hl text{fill:#fff}.hb .nd.hl .sb{fill:#DBEAFE}
  .hb .ln{stroke:var(--acb);animation:dash 1.4s linear infinite}.hb .ln.hl{stroke:var(--ac)}
  @keyframes dash{to{stroke-dashoffset:-18}}
  .col{flex:1.1;display:flex;flex-direction:column;justify-content:center}.col.o{gap:10px}
  .wire.v{flex:none;width:2px;height:18px;align-self:center}.wire.v:after{top:0;left:-1px;width:4px;height:10px;animation-name:mvv}
  @keyframes mvv{from{top:-12px}to{top:100%}}
  .lv{padding:10px 14px}.lv>b{font-size:14px;margin-bottom:4px}.chip{margin-bottom:4px}.node span{font-size:13px}
  .wire{flex:0 0 40px}.col.o .node{padding:8px 14px}.rw em{flex:0 0 66px}
  .sysg{display:grid;grid-template-columns:1fr 40px 1.55fr 40px .85fr;grid-template-rows:1fr auto;row-gap:14px}
  .sysg>.hw{grid-column:1;grid-row:1/3}.sysg>.colB{grid-column:3;grid-row:1}.sysg>.ui{grid-column:5;grid-row:1}.sysg>.pc{grid-column:3/6;grid-row:2}
  .sysg>.wire{grid-row:1;align-self:center;flex:none}.sysg>.w1{grid-column:2}.sysg>.w2{grid-column:4}
  .bk{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.06);transition:box-shadow .2s,border-color .2s}
  .bk.hl{box-shadow:0 0 0 3px var(--acb);border-color:var(--ac)}
  .bk.hw{background:var(--acs);border-color:var(--acb)}
  .bk h3{font-size:20px;margin:0}.bk .d{margin:0;font-size:14px;color:var(--mu)}
  .sub{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
  .bk:not(.hw) .sub{background:var(--bg)}
  .sub b{font-size:16px}.sub span{font-size:13px;color:var(--tx2)}
  .grp{display:flex;align-items:baseline;gap:8px}.grp em{flex:0 0 84px;font-style:normal;font-size:12px;color:var(--mu)}
  .bk .chip{font-size:14px;padding:2px 12px}
  .colB{display:flex;flex-direction:column}.colB .sv{flex:1}
  .bk.pc{flex-direction:row;align-items:center;gap:16px;padding:14px 18px;background:var(--alt);border-color:var(--bd2)}
  .bk.pc .chip{margin:0 6px 0 0}
  .sub.ic{flex-direction:row;align-items:center;gap:14px}.sub.ic>div{display:flex;flex-direction:column}
  .sub.ic i{flex:0 0 44px;height:44px;border-radius:12px;background:var(--acs);display:grid;place-items:center}
  .sub.ic svg{width:24px;height:24px;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sub.sw{flex:none;gap:6px;justify-content:flex-start}.sub.sw em{font-style:normal;font-size:12px;color:var(--mu)}.sub.sw .chip{margin-bottom:0}
  .sub b{font-size:17px}.bk h3{font-size:21px}.bk .d{font-size:15px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bk{padding:14px 16px;gap:8px}.bk .chip{font-size:13px}.sub b{font-size:16px}.bk h3{font-size:20px}.bk.pc h3{white-space:nowrap}.bk.pc{gap:20px}
  .sub.ic{justify-content:flex-start}.bk .chip{padding:2px 10px}
  .sub.sw.rowc{flex-direction:row;align-items:center;gap:10px;padding:10px 14px}.rowc em{flex:0 0 64px}.rowc>div{flex:1}.rowc .chip{margin:2px 6px 2px 0}
  .ui .sub.ic{flex-direction:column;justify-content:center;text-align:center;gap:12px}.ui .sub.ic>div{align-items:center;gap:2px}
  .ui .sub.ic i{flex:none;width:56px;height:56px}.ui .sub.ic svg{width:28px;height:28px}.ui .sub.ic b{font-size:18px}.ui .sub.ic span{font-size:14px}
  .two .sub{padding:10px}.two .chip{padding:2px 9px;margin-right:4px}
  .slide.on.fin{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .fin .rg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .fin .rg circle{fill:none;stroke:var(--ac);stroke-width:1.3;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ring2 6s ease-out infinite;animation-delay:var(--d)}
  .fin>*:not(.rg){position:relative}
  .fin .logo{width:132px;height:132px;border-radius:30px;margin-bottom:26px;animation:glow 3s ease-in-out infinite}
  .fin h1{font-size:68px;margin:0 0 14px}.fin p{max-width:none}
  .fin .tags{margin-top:22px}
  @keyframes ring2{0%{transform:scale(1);opacity:.55}100%{transform:scale(9.5);opacity:0}}
  @keyframes glow{50%{box-shadow:0 0 0 12px rgba(37,99,235,.10),0 2px 8px rgba(37,99,235,.14)}}
  .fin>.bar,.fin>.beam{position:absolute}
  .fin .logo{width:104px;height:104px;border-radius:26px;margin-bottom:22px}
  .fin h1{font-size:76px;line-height:1.1;margin:0;display:flex;gap:.3em;justify-content:center}
  .fin .w{display:inline-block}
  .fin .ln2{height:2px;width:240px;background:var(--ac);border-radius:2px;margin:20px auto 18px}
  .fin .lead{font-size:22px;letter-spacing:.06em;margin:0;color:var(--tx2)}
  .fin .bar{left:0;right:0;height:64px;background:#0F172A;color:#94A3B8;font-size:14px;letter-spacing:.12em;display:grid;place-items:center;z-index:2}
  .fin .bt{top:0}.fin .bb{bottom:0;height:76px}
  .fin .bb a{color:#E6EBF3;font-size:22px;letter-spacing:.05em;text-decoration:none}
  .fin .beam{top:0;bottom:0;left:0;width:200px;background:linear-gradient(90deg,transparent,rgba(37,99,235,.12),transparent);transform:translateX(-300px) skewX(-18deg);pointer-events:none;z-index:1}
  .slide.on.fin .w{animation:wd 1.2s cubic-bezier(.2,.7,.2,1) var(--w) both}
  .slide.on.fin .ln2{animation:ex 1.2s cubic-bezier(.2,.7,.2,1) 1.7s both}
  .slide.on.fin .lead{animation:tr 1.4s ease-out 2.1s both}
  .slide.on.fin .bt{animation:bt 1s cubic-bezier(.2,.7,.2,1) both}.slide.on.fin .bb{animation:bb 1s cubic-bezier(.2,.7,.2,1) both}
  .slide.on.fin .bar span,.slide.on.fin .bb a{animation:fi 1.2s ease-out 2.6s both}
  .slide.on.fin .beam{animation:beam 2.6s ease-in-out 1.5s both}
  @keyframes wd{from{opacity:0;filter:blur(16px);letter-spacing:.22em;transform:translateY(16px)}}
  @keyframes ex{from{width:0;opacity:0}}@keyframes tr{from{opacity:0;letter-spacing:.3em}}@keyframes fi{from{opacity:0}}
  @keyframes bt{from{transform:translateY(-100%)}}@keyframes bb{from{transform:translateY(100%)}}
  @keyframes beam{from{transform:translateX(-300px) skewX(-18deg)}to{transform:translateX(1500px) skewX(-18deg)}}
  .fx{flex:none!important;padding:10px 14px}.fx i{flex-basis:40px!important;height:40px!important}.fx>div{gap:0}.fx .cp{margin-top:4px}.fx .chip{margin:0 4px 0 0}
  .ui .sub.ic{gap:8px}.ui .sub.ic i{width:44px;height:44px}.ui .sub.ic svg{width:24px;height:24px}.ui .sub.ic b{font-size:17px}.ui .sub.ic span{font-size:13px}
  .fin>.cap,.fin>.mail{position:absolute;left:0;right:0;text-align:center}
  .fin>.cap{top:44px;color:var(--mu);font-size:14px;letter-spacing:.12em}
  .fin>.mail{bottom:52px}.fin .mail a{color:var(--ach);font-size:22px;letter-spacing:.05em;text-decoration:none}
  .slide.on.fin .cap,.slide.on.fin .mail a{animation:fi 1.2s ease-out 2.6s both}
  .bk.sv .sub.sw.rowc{flex:1}
  .slide.on.fin{padding-bottom:230px}
  .fin>.plate{position:absolute;left:0;right:0;bottom:40px;margin:0 auto;width:920px;display:flex;align-items:center;gap:26px;padding:18px 24px;background:var(--surf);border:1px solid var(--bd);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.08);text-align:left}
  .qr{flex:0 0 150px;height:150px;background:#FDFEFF;border:1px solid var(--bd);border-radius:14px;padding:3px}
  .qr svg{width:100%;height:100%;display:block}
  .pl{flex:1;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--bd);padding-left:26px}
  .pl a{color:inherit;text-decoration:none}
  .it{display:flex;align-items:center;gap:12px}
  .it i{flex:0 0 40px;height:40px;border-radius:11px;background:var(--acs);display:grid;place-items:center}
  .it svg{width:22px;height:22px;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .it small{display:block;font-size:12px;color:var(--mu);line-height:1.3}
  .it b{display:block;font-size:15px;line-height:1.3;font-weight:600}
  .pl>.it b{font-size:21px;letter-spacing:.02em;color:var(--ach)}
  .lk{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .slide.on.fin .plate{animation:up .9s cubic-bezier(.2,.7,.2,1) 2.7s both}
  .slide.on.fin{padding-bottom:190px}
  .fin>.plate{width:540px;gap:22px;padding:14px 20px;border-radius:16px;bottom:36px}
  .qr{flex:0 0 116px;height:116px;border-radius:12px}
  .pl{gap:12px;padding-left:22px}
  .it.mailr i{flex-basis:36px;height:36px}
  .pl>.mailr b{font-size:15px;letter-spacing:0;color:var(--tx)}
  .bts{display:flex;gap:8px}
  .bt{display:flex;align-items:center;height:40px;min-width:40px;border-radius:12px;background:var(--acs);overflow:hidden;cursor:pointer;outline:none;transition:box-shadow .2s}
  .bt i{flex:0 0 40px;height:40px;display:grid;place-items:center}
  .bt svg{width:22px;height:22px;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bt span{max-width:0;opacity:0;white-space:nowrap;font-size:14px;font-weight:600;color:var(--ach);transition:max-width .35s cubic-bezier(.2,.7,.2,1),opacity .25s,margin .35s}
  .bt:hover,.bt:focus-visible{box-shadow:inset 0 0 0 1px var(--acb)}
  .bt:hover span,.bt:focus-visible span{max-width:140px;opacity:1;margin-right:14px}
  #thm,#ov{width:40px;height:40px;border-radius:9999px;background:var(--surf);border:1px solid var(--bd);box-shadow:0 1px 2px rgba(15,23,42,.08);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ac);transition:border-color .2s,box-shadow .2s,background .2s}
  #thm:hover,#ov:hover{border-color:var(--acb);box-shadow:0 2px 8px rgba(15,23,42,.10)}
  #thm:focus-visible,#ov:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
  #thm{position:relative}
  #thm svg{position:absolute;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s cubic-bezier(.2,.7,.2,1),transform .45s cubic-bezier(.2,.7,.2,1)}
  #ov svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #thm .sun{opacity:1;transform:rotate(0) scale(1)}
  #thm .moon{opacity:0;transform:rotate(70deg) scale(.4)}
  html[data-theme="dark"] #thm .sun{opacity:0;transform:rotate(-70deg) scale(.4)}
  html[data-theme="dark"] #thm .moon{opacity:1;transform:rotate(0) scale(1)}
  .pl>.primary{gap:14px}
  .pl>.primary i{flex:0 0 46px;height:46px;background:var(--ac)}
  .pl>.primary svg{width:24px;height:24px;stroke:#fff}
  .pl>.primary small{display:block;font-size:12px;color:var(--mu);margin-bottom:1px}
  .pl>.primary b{font-size:21px;letter-spacing:.01em;color:var(--tx)}
  .bt.neutral{background:var(--alt)}
  .bt.neutral svg{stroke:var(--tx2)}
  .bt.neutral span{color:var(--tx)}
  .bt.neutral:hover{background:var(--bd);box-shadow:none}

  .slide.space{background:#05070F;overflow:hidden}
  .slide.space.on{animation:spEnter 1.1s ease-out both}
  @keyframes spEnter{from{opacity:0;transform:scale(1.035)}}
  .sp-sky{position:absolute;inset:0;background:
   radial-gradient(60% 50% at 78% 12%,rgba(56,132,240,.17),transparent 60%),
   radial-gradient(50% 45% at 12% 85%,rgba(139,92,246,.14),transparent 60%),
   linear-gradient(180deg,#060A16 0%,#050710 55%,#040611 100%)}
  .sp-sky:before,.sp-sky:after{content:"";position:absolute;width:60%;height:60%;border-radius:50%;filter:blur(40px);opacity:.5}
  .sp-sky:before{background:radial-gradient(circle,rgba(56,132,240,.30),transparent 70%);top:-18%;right:-12%;animation:spDrift1 26s ease-in-out infinite}
  .sp-sky:after{background:radial-gradient(circle,rgba(139,92,246,.22),transparent 70%);bottom:-20%;left:-10%;animation:spDrift2 32s ease-in-out infinite}
  @keyframes spDrift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,25px) scale(1.08)}}
  @keyframes spDrift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,-20px) scale(1.1)}}
  .sp-stars{position:absolute;inset:0}
