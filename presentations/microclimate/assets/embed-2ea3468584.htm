<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; worker-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><meta name="referrer" content="no-referrer"><style>html,body{margin:0;padding:0;overflow:hidden}</style></head><body><style>html,body{margin:0;height:100%;overflow:hidden}
#s{position:absolute;left:0;top:0;width:520px;height:506px;transform-origin:0 0;border-radius:12px;overflow:hidden;background:var(--surf, #FDFEFF);box-shadow:0 18px 40px rgba(15,23,42,.18),0 0 0 1px #E5E7EB;display:flex;flex-direction:column;font:12px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx, #111827)}
.bar{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--alt, #F3F4F6);border-bottom:1px solid var(--bd, #E5E7EB);font-weight:600;font-size:12px}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--bd2, #D1D5DB)}.bar b{flex:1;text-align:center;font-weight:600;color:var(--tx2, #374151);margin-right:40px}
.bd{flex:1;display:flex;min-height:0}
.sd{width:122px;flex:none;background:var(--bg, #F8FAFC);border-right:1px solid var(--bd, #E5E7EB);padding:10px 8px;display:flex;flex-direction:column;gap:3px}
.tb{padding:7px 9px;border-radius:7px;color:var(--tx2, #374151);font-size:11.5px;transition:background .3s,color .3s}.tb.on{background:var(--ac, #2563EB);color:#fff}
.mn{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cd{border:1px solid var(--bd, #E5E7EB);border-radius:9px;padding:8px 10px;background:var(--surf, #fff)}
.h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu, #6B7280);margin-bottom:6px;display:flex;justify-content:space-between}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:11.5px}.kv span{color:var(--mu, #6B7280)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16A34A;margin-right:5px;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3}}
.lg{height:124px;overflow:hidden;font:11px/1.55 Consolas,"DejaVu Sans Mono",monospace;display:flex;flex-direction:column;justify-content:flex-end}
.lg div{white-space:nowrap;animation:in .4s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.u{color:var(--ac, #2563EB)}.d{color:#C2410C}.y{color:var(--mu, #6B7280)}
svg.sp{display:block;width:100%;height:34px}
.fr{display:flex;gap:6px;align-items:center}.in{border:1px solid var(--bd2, #D1D5DB);border-radius:6px;padding:5px 8px;font:11.5px Consolas,"DejaVu Sans Mono",monospace;background:var(--bg, #F8FAFC)}
.btn{margin-left:auto;background:var(--ac, #2563EB);color:#fff;border-radius:6px;padding:6px 12px;font-weight:600;transition:transform .15s,box-shadow .3s}.btn.go{transform:scale(.94);box-shadow:0 0 0 4px #BFDBFE}
.cap{position:absolute;right:10px;bottom:8px;font-size:10px;color:color-mix(in srgb, var(--bg, #9CA3AF) 36%, var(--mu, #9CA3AF))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
<div id="s"><div class="bar"><i></i><i></i><i></i><b>Прикладное ПО</b></div>
<div class="bd"><div class="sd" id="tabs"><div class="tb">Устройство</div><div class="tb">LoRaWAN</div><div class="tb">Передача данных</div><div class="tb">Входы</div><div class="tb">Монитор</div><div class="tb">Downlink</div></div>
<div class="mn">
<div class="cd"><div class="h"><b style="font-weight:600">Устройство</b><span><i class="dot"></i>в сети</span></div><div class="kv"><span>Загрузчик</span><b>Bootloader</b><span>Приложение</span><b>App_LoRaWAN</b><span>Подпись</span><b style="color:#16A34A">HMAC ✓</b><span>Последний uplink</span><b id="ago">2 с назад</b></div></div>
<div class="cd"><div class="h"><b style="font-weight:600">Телеметрия</b><span>пример</span></div><svg class="sp" viewBox="0 0 300 46" preserveAspectRatio="none"><path id="pth" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" style="stroke: var(--ac, #2563EB)"></path></svg></div>
<div class="cd"><div class="h"><b style="font-weight:600">Монитор</b><span>реальное время</span></div><div class="lg" id="lg"></div></div>
<div class="cd"><div class="h"><b style="font-weight:600">Генератор команд Downlink</b></div><div class="fr"><span style="color:var(--mu, #6B7280)">FPort</span><span class="in">10</span><span style="color:var(--mu, #6B7280)">Payload</span><span class="in" id="pl" style="min-width:78px"></span><span class="btn" id="bt">Отправить</span></div></div>
</div></div></div>
<script>
var s=document.getElementById('s');function f(){s.style.transform='scale('+innerWidth/520+')'}addEventListener('resize',f);f();
var tabs=[].slice.call(document.querySelectorAll('.tb')),ti=0;function tab(){tabs.forEach(function(e,i){e.classList.toggle('on',i===ti)});ti=(ti+1)%tabs.length}tab();setInterval(tab,1800);
var P=[],k;for(k=0;k<40;k++)P.push(23+Math.sin(k/3)*9+Math.sin(k/1.3)*3);var ph=0;
function spark(){ph+=.35;var d='';for(k=0;k<40;k++){var y=23+Math.sin((k+ph)/3)*9+Math.sin((k+ph)/1.3)*3;d+=(k?'L':'M')+(k*300/39).toFixed(1)+' '+y.toFixed(1)}document.getElementById('pth').setAttribute('d',d)}spark();setInterval(spark,120);
var lg=document.getElementById('lg'),n=0,ago=document.getElementById('ago'),sec=2;
var M=[['u','↑ Uplink    FPort 2   12 B   RSSI -87  SNR 7.5'],['y','i Системное сообщение: статус OK'],['u','↑ Uplink    FPort 2   12 B   RSSI -85  SNR 8.0'],['u','↑ Uplink    FPort 2   12 B   RSSI -88  SNR 7.1']];
function log(c,t){var d=document.createElement('div');d.className=c;d.textContent=t;lg.appendChild(d);while(lg.children.length>6)lg.removeChild(lg.firstChild)}
M.forEach(function(m){log(m[0],m[1])});
setInterval(function(){sec++;ago.textContent=sec+' с назад'},1000);
setInterval(function(){var m=M[n++%M.length];log(m[0],m[1]);if(m[0]=='u')sec=0},2600);
var pl=document.getElementById('pl'),bt=document.getElementById('bt'),H=['01 3C 00 1E','02 01','03 00 FF'],hi=0;
function dl(){var h=H[hi++%H.length],i=0;pl.textContent='';var iv=setInterval(function(){pl.textContent=h.slice(0,++i);if(i>=h.length){clearInterval(iv);setTimeout(function(){bt.classList.add('go');log('d','↓ Downlink  FPort 10  '+h+'  → в очереди');setTimeout(function(){bt.classList.remove('go')},300)},500)}},110)}
dl();setInterval(dl,6000);
</script></body></html>
