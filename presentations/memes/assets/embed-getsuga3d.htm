<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Getsuga Tenshou 3D</title>
<!--
  Getsuga Tenshou в 3D: Ичиго (GLB со скелетом) копит реяцу, замахивается, заряжает клинок и бьёт.
  Сначала мир — манга в ч/б (контуры тушью, растр); при заряде энергия клинка проступает кармином,
  с ударом мир взрывается цветом от клинка:
  волна-полумесяц, разлом земли, разрез кадра. Модель приходит файлом презентации (embed.files: hero.glb);
  поза и взмах собираются кодом (IK рук и ног, клинок, пальцы) — анимаций в файле нет.
  Запуск при открытии слайда, щелчок — ещё раз (со звуком). three.js — © three.js authors, MIT.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050306; cursor: pointer; user-select: none; }
  #stage, #ui { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #ui { pointer-events: none; }
  .call { position: absolute; white-space: nowrap; font-style: italic; font-weight: 900; color: #fff;
    font-family: "Arial Black", "Segoe UI Black", Impact, "Helvetica Neue", system-ui, sans-serif; }
  #c1 { left: 5.5%; top: 12%; font-size: min(6.8vw, 84px); letter-spacing: .05em; -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 5px 5px 0 #000; transition: text-shadow .5s; }
  body.charge #c1 { text-shadow: 5px 5px 0 #000, 0 0 22px rgba(255, 20, 50, .85); transition: text-shadow .9s; }
  body.col #c1 { -webkit-text-stroke-width: 2px; text-shadow: 0 0 14px rgba(255, 30, 60, .9), 0 0 44px rgba(255, 0, 40, .55); }
  #c1 span { display: inline-block; opacity: 0; transform: translateY(35%) skewX(-12deg) scale(1.5); filter: blur(8px); transition: opacity .16s, transform .3s cubic-bezier(.2, 1.6, .4, 1), filter .22s; }
  #c1 span.on { opacity: 1; transform: skewX(-12deg); filter: none; }
  #c2 { left: 50%; top: 52%; font-size: min(14.5vw, 186px); letter-spacing: .01em; opacity: 0; transform: translate(-50%, -50%); -webkit-text-stroke: 7px #000; paint-order: stroke fill;
    text-shadow: 7px 7px 0 #b0001c, 13px 13px 0 #000, 0 0 70px rgba(255, 20, 50, .85); }
  #kj { position: absolute; left: 33%; top: 44%; transform: translateX(-50%); opacity: 0; white-space: nowrap;
    font: 900 min(4.4vw, 54px)/1 "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS Mincho", serif; letter-spacing: .32em;
    color: #ff2a4a; text-shadow: 0 0 18px rgba(255, 20, 50, .8), 0 0 50px rgba(255, 0, 40, .45); }
  .bar { position: absolute; left: 0; right: 0; height: 10.5%; background: #000; transform: scaleY(0); }
  #bt { top: 0; transform-origin: top; } #bb { bottom: 0; transform-origin: bottom; }
  #hint { position: absolute; right: 16px; bottom: 12px; font: 600 13px system-ui, sans-serif; color: #fff; opacity: 0; transition: opacity .6s; }
  #load { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: #888; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <div class="call" id="c1"></div>
  <div class="call" id="c2">TENSHOU!!</div>
  <div id="kj">月牙天衝</div>
  <div class="bar" id="bt"></div><div class="bar" id="bb"></div>
  <div id="hint">щелчок — ещё раз</div>
  <div id="load"></div>
</div>
<script type="x-shader" id="vsAura">
attribute vec4 aSeed; uniform float uT, uA, uScale, uBurst, uSmoke; uniform vec3 uCenter; varying float vA; varying float vS;
void main(){
  float P = 0.9 + aSeed.w * 0.7, age = fract(uT / 1000.0 / P + aSeed.x);
  float ang = aSeed.y * 6.2831 + age * 1.5 * (aSeed.z - 0.5), r = 0.2 + 0.42 * aSeed.z + age * 0.22;
  vec3 p = uCenter + vec3(cos(ang) * r, age * (1.7 + 1.7 * aSeed.w) + 0.05, sin(ang) * r * 0.8);
  p.x += sin(age * 9.0 + aSeed.x * 20.0) * 0.07 * age;
  vec2 dir = vec2(cos(ang), sin(ang));
  p.xz += dir * uBurst * (0.8 + aSeed.w * 1.6); p.y += uBurst * aSeed.z * 0.8;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float size = (uSmoke > 0.5 ? 0.17 : 0.24) * (0.5 + aSeed.z) * sin(3.1416 * age) * (0.6 + 0.6 * min(uA, 1.4));
  gl_PointSize = clamp(size * uScale / -mv.z, 0.0, 70.0);
  gl_Position = projectionMatrix * mv;
  vA = min(uA, 1.4) * sin(3.1416 * age) * (uSmoke > 0.5 ? 0.7 : 0.45) * smoothstep(0.8, 2.2, -mv.z); vS = aSeed.w;
}
</script>
<script type="x-shader" id="vsMotes">
attribute vec4 aSeed; uniform float uT, uA, uScale; uniform vec3 uHand; varying float vA; varying float vS;
void main(){
  float P = 0.7 + aSeed.w * 0.5, age = fract(uT / 1000.0 / P + aSeed.x);
  vec3 dir = normalize(vec3(aSeed.y - 0.5, aSeed.z - 0.3, aSeed.w - 0.5));
  float R = (1.0 - age) * (1.2 + 1.8 * aSeed.z), sw = age * 3.0 * (aSeed.x - 0.5);
  vec3 p = uHand + vec3(dir.x * cos(sw) - dir.z * sin(sw), dir.y, dir.x * sin(sw) + dir.z * cos(sw)) * R;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = min(0.05 * uScale / -mv.z * (0.5 + aSeed.y), 40.0); gl_Position = projectionMatrix * mv;
  vA = uA * smoothstep(0.0, 0.2, age) * (1.0 - age) * smoothstep(0.6, 1.8, -mv.z); vS = aSeed.w;
}
</script>
<script type="x-shader" id="vsEmbers">
attribute vec4 aSeed; uniform float uT, uA, uScale, uZ0, uLen, uX, uW0, uW1; varying float vA; varying float vS;
float reveal(float z){ float k = clamp((z - uZ0) / uLen, 0.0, 1.0); return uW0 + pow(k, 1.0 / 1.3) * (uW1 - uW0); }
void main(){
  float z = uZ0 + aSeed.x * uLen * 0.95, since = (uT - reveal(z)) / 1000.0;
  float P = 1.6 + aSeed.w * 1.4, age = fract(max(since, 0.0) / P + aSeed.y);
  vec3 p = vec3(uX + (aSeed.z - 0.5) * 0.5 + sin(age * 5.0 + aSeed.x * 30.0) * 0.05, age * (0.6 + aSeed.w * 1.2), z + (aSeed.y - 0.5) * 0.3);
  float heat = since < 0.0 ? 0.0 : 0.25 + 0.75 * exp(-since / 1.8);
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = min(0.035 * uScale / -mv.z * (0.6 + aSeed.z), 24.0); gl_Position = projectionMatrix * mv;
  vA = uA * heat * sin(3.1416 * age) * smoothstep(0.8, 2.5, -mv.z); vS = 0.95;
}
</script>
<script type="x-shader" id="vsSparks">
attribute vec4 aSeed; uniform float uT, uScale; varying float vA; varying float vS;
void main(){
  float P = 0.35 + aSeed.w * 0.3, age = fract(uT / 1000.0 / P + aSeed.x);
  float th = (aSeed.y * 2.0 - 1.0) * 1.1; vec2 e = vec2(cos(th), sin(th)) * 0.8;
  vec2 p = e + normalize(e) * age * (0.15 + 0.4 * aSeed.z) - vec2(age * (0.6 + 0.8 * aSeed.w), 0.0);
  vec4 mv = modelViewMatrix * vec4(p, (aSeed.z - 0.5) * 0.3, 1.0);
  gl_PointSize = min(0.03 * uScale / -mv.z * (0.6 + aSeed.z), 30.0); gl_Position = projectionMatrix * mv;
  vA = (1.0 - age) * smoothstep(0.8, 2.5, -mv.z); vS = aSeed.w;
}
</script>
<script type="x-shader" id="vsBlade">
attribute vec4 aSeed; uniform float uT, uA, uScale; uniform vec3 uHilt, uTip; varying float vA; varying float vS;
void main(){
  float P = 0.45 + aSeed.w * 0.5, age = fract(uT / 1000.0 / P + aSeed.x);
  vec3 axis = uTip - uHilt, ad = normalize(axis);
  vec3 o1 = normalize(cross(ad, vec3(0.0, 1.0, 0.0001))), o2 = cross(ad, o1);
  float ang = aSeed.z * 6.2831 + age * 6.0 * (aSeed.w - 0.5) + uT * 0.004;
  float r = 0.03 + 0.2 * age * (0.4 + aSeed.z);
  vec3 p = uHilt + axis * (0.12 + 0.88 * aSeed.y) + (o1 * cos(ang) + o2 * sin(ang)) * r + ad * age * 0.12;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = min(0.045 * uScale / -mv.z * (0.5 + aSeed.z), 40.0); gl_Position = projectionMatrix * mv;
  vA = uA * sin(3.1416 * age) * smoothstep(0.4, 1.4, -mv.z); vS = aSeed.w * 0.86;
}
</script>
<script type="x-shader" id="fsCrack">
varying vec2 vUv; uniform float uCrack, uHeat;
float h(float x){ return fract(sin(x * 127.1) * 43758.5453); }
void main(){
  vec2 p = vUv * 2.0 - 1.0; float r = length(p), a = atan(p.y, p.x);
  float bins = 26.0, u = (a + 3.1416) / 6.2832 * bins, b = floor(u);
  float wob = (h(b + floor(r * 9.0)) - 0.5) * 0.4;
  float dist = abs(fract(u) - 0.5 + wob * 0.35) * r * 6.2832 / bins;
  float len = (0.3 + 0.7 * h(b * 3.1)) * uCrack;
  float on = step(0.4, h(b * 7.7)) * step(0.1, r) * step(r, len);
  float line = smoothstep(0.012 + 0.01 * (1.0 - r), 0.0, dist) * on;
  float glow = line * (1.0 - 0.6 * r / max(len, 0.01)) * uHeat;
  gl_FragColor = vec4(vec3(3.2, 0.18, 0.3) * glow, clamp(line * 0.85 + glow * 0.3, 0.0, 1.0));
}
</script>
<script type="x-shader" id="fsGlow">
varying float vA; varying float vS;
void main(){
  vec2 d = gl_PointCoord - 0.5; float r = length(d); if (r > 0.5) discard;
  float a = smoothstep(0.5, 0.0, r) * vA;
  vec3 c = vS > 0.9 ? vec3(3.0, 0.9, 0.35) : mix(vec3(2.6, 0.16, 0.32), vec3(3.2, 2.0, 2.0), smoothstep(0.82, 0.9, vS));
  gl_FragColor = vec4(c, a);
}
</script>
<script type="x-shader" id="fsSmoke">
varying float vA; varying float vS;
void main(){
  vec2 d = gl_PointCoord - 0.5; float r = length(d); if (r > 0.5) discard;
  gl_FragColor = vec4(vec3(0.012, 0.0, 0.01), smoothstep(0.5, 0.12, r) * vA);
}
</script>
<script type="x-shader" id="fsWave">
varying vec2 vUv; uniform float uT, uBorn;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec2 p = vUv;
  float R = 0.8, A = 1.2, d = R * 0.85;
  vec2 c2 = vec2(-d, 0.0); float r2 = length(vec2(R * cos(A) + d, R * sin(A)));
  float so = length(p) - R, si = length(p - c2) - r2, sd = max(so, -si);
  float inside = step(sd, 0.0);
  float tipFade = smoothstep(-0.95, -0.25, p.x);
  float glow = (exp(-max(sd, 0.0) * 18.0) * 0.55 + exp(-max(sd, 0.0) * 45.0) * 0.6) * tipFade;
  float core = smoothstep(-0.012, -0.04, sd);
  float ang = atan(p.y, p.x), rr = length(p - c2 * 0.3);
  // Потоки энергии вдоль серпа
  float lane = floor(rr * 26.0);
  float flow = pow(0.5 + 0.5 * sin(ang * 6.0 - uT * 0.018 * (1.0 + h(vec2(lane, 2.0))) + h(vec2(lane, 1.0)) * 6.28), 6.0);
  vec3 rim = mix(vec3(0.9, 0.02, 0.07), vec3(2.6, 0.18, 0.3), smoothstep(-0.03, 0.0, sd));
  vec3 coreC = vec3(0.02, 0.0, 0.01) + vec3(1.6, 0.04, 0.12) * flow * 0.35;
  vec3 inC = mix(rim, coreC, core);
  float front = smoothstep(-0.02, 0.0, so) * step(so, 0.006) * smoothstep(-0.2, 0.3, p.x);
  inC += vec3(9.0, 7.5, 7.5) * front;
  vec3 col = mix(vec3(2.2, 0.08, 0.22), inC, inside);
  float a = mix(clamp(glow, 0.0, 1.0) * 0.9, 1.0, inside) * uBorn;
  gl_FragColor = vec4(col, a);
}
</script>
<script type="x-shader" id="fsTrench">
varying vec3 vW; uniform float uT, uZ0, uLen, uX, uW0, uW1;
float h(float x){ return fract(sin(x * 127.1) * 43758.5453); }
float n1(float x){ float i = floor(x), f = fract(x); return mix(h(i), h(i + 1.0), f * f * (3.0 - 2.0 * f)); }
float reveal(float z){ float k = clamp((z - uZ0) / uLen, 0.0, 1.0); return uW0 + pow(k, 1.0 / 1.3) * (uW1 - uW0); }
void main(){
  float z = vW.z; if (z < uZ0) discard;
  float since = (uT - reveal(z)) / 1000.0; if (since < 0.0) discard;
  float jag = (n1(z * 3.0) - 0.5) * 0.18 + (n1(z * 11.0) - 0.5) * 0.06;
  float dx = abs(vW.x - (uX + jag)), w = 0.06 + 0.05 * n1(z * 2.0 + 5.0);
  float groove = smoothstep(w * 1.7, w * 0.6, dx);
  float heat = 0.18 + 0.82 * exp(-since / 1.6), wh = exp(-since / 0.18);
  float core = smoothstep(w * 0.5, 0.0, dx), glow = exp(-dx * dx / (w * w * 7.0));
  float cr = 0.0;
  for (int i = 0; i < 2; i++) {
    float zz = z * float(4 + i * 3), cid = floor(zz), cf = fract(zz);
    float side = h(cid + float(i) * 7.0) > 0.5 ? 1.0 : -1.0, len = 0.2 + 0.5 * h(cid * 1.7);
    float cx = (vW.x - uX - jag) * side, ly = cf - 0.5 - cx * 0.6 * (h(cid * 3.1) - 0.5);
    cr = max(cr, step(0.0, cx) * step(cx, len) * smoothstep(0.035, 0.0, abs(ly) / (1.0 + cx * 2.0)) * step(0.55, h(cid * 5.3)) * (1.0 - cx / len));
  }
  vec3 hot = mix(vec3(2.2, 0.12, 0.2), vec3(5.0, 3.6, 3.0), wh);
  vec3 col = hot * (core + glow * 0.6 + cr * 0.8) * heat;
  float a = clamp(groove * 0.9 + glow * heat + cr * heat, 0.0, 1.0);
  gl_FragColor = vec4(col, a);
}
</script>
<script type="x-shader" id="fsBright">
varying vec2 vUv; uniform sampler2D tSrc; uniform float uTh;
void main(){ vec3 c = texture2D(tSrc, vUv).rgb; float l = max(max(c.r, c.g), c.b); gl_FragColor = vec4(uTh > 0.5 ? c * smoothstep(1.2, 3.0, l) : c, 1.0); }
</script>
<script type="x-shader" id="fsBlur">
varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uDir;
void main(){
  vec3 c = texture2D(tSrc, vUv).rgb * 0.227;
  c += (texture2D(tSrc, vUv + uDir * 1.385).rgb + texture2D(tSrc, vUv - uDir * 1.385).rgb) * 0.316;
  c += (texture2D(tSrc, vUv + uDir * 3.23).rgb + texture2D(tSrc, vUv - uDir * 3.23).rgb) * 0.07;
  gl_FragColor = vec4(c, 1.0);
}
</script>
<script type="x-shader" id="fsFinal">
varying vec2 vUv;
uniform sampler2D tCol, tDep, tB1, tB2; uniform vec2 uRes;
uniform float uTime, uNear, uFar, uBW, uWipeR, uRing, uInvert, uFlash, uLines, uLinesInk, uZoom, uCA, uSat, uExpo, uCut, uCutOff, uBloom, uPx, uMExpo, uSpot;
uniform vec2 uWipeC, uLinesC, uZoomC, uCutP, uCutN;
float h2(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float linD(vec2 uv){ float z = texture2D(tDep, uv).r * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 tone(vec3 c){ return pow(aces(c * uExpo), vec3(1.0 / 2.2)); }
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
void main(){
  vec2 asp = vec2(uRes.x / uRes.y, 1.0), uv = vUv;
  if (uCut > 0.0) { float s = dot((uv - uCutP) * asp, uCutN); uv -= uCutN / asp * uCutOff * (s > 0.0 ? 1.0 : -0.45); }
  vec2 dz = uZoomC - uv; vec3 col = vec3(0.0);
  for (int i = 0; i < 8; i++) { float k = float(i) / 7.0; vec2 o = dz * uZoom * k;
    col.r += texture2D(tCol, uv + o + dz * uCA).r; col.g += texture2D(tCol, uv + o).g; col.b += texture2D(tCol, uv + o - dz * uCA).b; }
  col = col / 8.0 + (texture2D(tB1, uv).rgb * 0.9 + texture2D(tB2, uv).rgb * 1.4) * uBloom;
  vec3 c = tone(col);
  float L = lum(c);
  c = mix(vec3(L), c, uSat);
  // Манга: контуры по глубине и яркости, растровые точки, бумага вместо неба
  vec2 px = uPx * 1.2 / uRes;
  float d0 = linD(uv);
  float de = (abs(linD(uv - vec2(px.x, 0.0)) - d0) + abs(linD(uv + vec2(px.x, 0.0)) - d0) + abs(linD(uv + vec2(0.0, px.y)) - d0) + abs(linD(uv - vec2(0.0, px.y)) - d0)) / max(d0, 0.5);
  float le = abs(lum(tone(texture2D(tCol, uv - vec2(px.x, 0.0)).rgb)) - lum(tone(texture2D(tCol, uv + vec2(px.x, 0.0)).rgb)))
           + abs(lum(tone(texture2D(tCol, uv + vec2(0.0, px.y)).rgb)) - lum(tone(texture2D(tCol, uv - vec2(0.0, px.y)).rgb)));
  float edge = clamp(smoothstep(0.06, 0.16, de) + smoothstep(0.14, 0.32, le), 0.0, 1.0);
  float sky = step(60.0, d0);
  float Lm = smoothstep(0.03, 0.6, lum(pow(aces(col * uExpo * uMExpo), vec3(1.0 / 2.2))));
  vec2 cell = mat2(0.707, -0.707, 0.707, 0.707) * (gl_FragCoord.xy / (5.0 * uPx));
  float ht = step(length(fract(cell) - 0.5), sqrt(1.0 - Lm) * 0.62);
  float ink = Lm < 0.16 ? 1.0 : (Lm > 0.74 ? 0.0 : ht);
  ink = max(mix(ink, 0.0, sky), edge * (1.0 - sky * 0.6));
  // Заряд: бумага теплеет, красное (реяцу, клинок) проступает цветом — пятно цвета, как в манге
  vec3 paperC = mix(vec3(0.95, 0.94, 0.9), vec3(0.94, 0.86, 0.85), uSpot * 0.45);
  vec3 manga = mix(paperC, vec3(0.03), ink);
  // Цветом проступает только энергия — она ярче освещённых поверхностей (до тонмаппинга)
  float redM = smoothstep(0.7, 1.8, col.r - max(col.g, col.b));
  vec3 spotC = mix(vec3(0.78, 0.03, 0.09), vec3(1.0, 0.8, 0.78), smoothstep(2.6, 6.0, col.r));
  manga = mix(manga, spotC, redM * uSpot);
  float dist = length((vUv - uWipeC) * asp);
  float m = uBW * smoothstep(uWipeR - 0.015, uWipeR + 0.015, dist);
  vec3 o = mix(c, manga, m);
  o += vec3(1.0, 0.2, 0.3) * exp(-pow((dist - uWipeR) / 0.02, 2.0)) * uRing * 1.4 + vec3(1.0) * exp(-pow((dist - uWipeR) / 0.004, 2.0)) * uRing;
  if (uLines > 0.0) {
    vec2 q = (vUv - uLinesC) * asp; float a = atan(q.y, q.x), r = length(q);
    float bin = floor((a + 3.1416) / 6.2832 * 180.0), n = h2(vec2(bin, 3.0)), r0 = 0.12 + 0.35 * h2(vec2(bin, 9.0));
    float line = step(0.58, n) * smoothstep(r0, r0 + 0.25, r) * (0.5 + 0.5 * n);
    o = mix(o, uLinesInk > 0.5 ? vec3(0.02) : vec3(1.0), clamp(line * uLines, 0.0, 1.0));
  }
  if (uCut > 0.0) { float s = abs(dot((vUv - uCutP) * asp, uCutN)); o += vec3(1.0, 0.25, 0.35) * exp(-s * s / 0.0004) * uCut * 1.5 + vec3(1.0) * exp(-s * s / 0.000012) * uCut; }
  if (uInvert > 0.5) o = vec3(1.0) - vec3(smoothstep(0.3, 0.6, lum(o)));
  o = mix(o, vec3(1.0), uFlash);
  vec2 vq = (vUv - 0.5) * vec2(1.0, 0.9); o *= 1.0 - dot(vq, vq) * 0.9 * (1.0 - m * 0.75);
  o *= mix(vec3(1.0), vec3(1.0, 0.72, 0.75), clamp(uSpot * dot(vq, vq) * 2.4, 0.0, 1.0) * m);
  o += (h2(gl_FragCoord.xy + fract(uTime * 0.001) * 100.0) - 0.5) * 0.05;
  gl_FragColor = vec4(o, 1.0);

  const V = (x, y, z) => new T.Vector3(x, y, z);
  const tmpQ = new T.Quaternion();
  function wpos(o) { return o.getWorldPosition(new T.Vector3()); }
  function wq(o) { return o.getWorldQuaternion(new T.Quaternion()); }
  // Поворот кости вокруг мировой оси (через её родителя)
  function rotW(bone, q) {
    const pq = wq(bone.parent);
    const l = pq.clone().invert().multiply(q).multiply(pq);
    bone.quaternion.premultiply(l);
    bone.updateMatrixWorld(true);
  }
  function axisAngle(ax, deg) { return new T.Quaternion().setFromAxisAngle(ax.clone().normalize(), deg * Math.PI / 180); }
  function signedAngle(a, b, axis) {
    const pa = a.clone().projectOnPlane(axis).normalize(), pb = b.clone().projectOnPlane(axis).normalize();
    return Math.atan2(axis.dot(pa.clone().cross(pb)), pa.dot(pb));
  }

  function Rig(root) {
    const B = {};
    root.traverse((o) => { if (o.isBone) B[o.name.replace(/_\d+$/, '')] = o; });
    this.B = B; this.root = root;
    root.updateMatrixWorld(true);
    this.bind = new Map();
    root.traverse((o) => { if (o.isBone) this.bind.set(o, { q: o.quaternion.clone(), p: o.position.clone() }); });
    // Клинок: остриё — самая дальняя от кисти вершина огромного меча; плоскость лезвия — X
    let tip = null, best = -1;
    const W = wpos(B.WRIST_R), v = new T.Vector3();
    root.traverse((o) => {
      if (!o.isSkinnedMesh || !/swoad/.test(o.material.name)) return;
      const pos = o.geometry.attributes.position, si = o.geometry.attributes.skinIndex;
      for (let i = 0; i < pos.count; i++) {
        const bn = o.skeleton.bones[si.getX(i)].name;
        if (!/EQUIPMENT_0[02]/.test(bn)) continue;
        v.fromBufferAttribute(pos, i); o.applyBoneTransform(i, v); v.applyMatrix4(o.matrixWorld);
        const d = v.distanceTo(W);
        if (d > best && v.z > W.z) { best = d; tip = v.clone(); }
      }
    });
    this.tipBind = tip;
    const wInv = wq(B.WRIST_R).invert();
    this.tipLocal = B.WRIST_R.worldToLocal(tip.clone());
    this.bladeLocal = tip.clone().sub(W).normalize().applyQuaternion(wInv);
    this.flatLocal = V(1, 0, 0).applyQuaternion(wInv);
    // Шарнир локтя и колена в исходной позе: сгиб вперёд (+Z)
    const hinge = (a, b, fwd) => { const d = wpos(B[b]).sub(wpos(B[a])).normalize(); return d.clone().cross(fwd).normalize().applyQuaternion(wq(B[a]).invert()); };
    this.hingeR = hinge('SHOULDER_R', 'ELBOW_R', V(0, 0, 1));
    this.hingeL = hinge('SHOULDER_L', 'ELBOW_L', V(0, 0, 1));
    this.kneeR = hinge('THIGH_R', 'CLANK_R', V(0, 0, -1));
    this.kneeL = hinge('THIGH_L', 'CLANK_L', V(0, 0, -1));
    this.footR = wpos(B.TOE1_R); this.footL = wpos(B.TOE1_L);
  }
  Rig.prototype.reset = function () {
    this.bind.forEach((s, b) => { b.quaternion.copy(s.q); b.position.copy(s.p); });
    this.root.updateMatrixWorld(true);
  };
  // Двухзвенный IK: a — корень, b — средний сустав, c — конец; hingeLocal — ось сгиба в осях кости a
  Rig.prototype.ik = function (a, b, c, target, pole, hingeLocal) {
    const B = this.B, A = B[a], M = B[b], C = B[c];
    const S = wpos(A), E = wpos(M), X = wpos(C);
    const la = S.distanceTo(E), lb = E.distanceTo(X);
    const dir = target.clone().sub(S);
    const d = Math.min(Math.max(dir.length(), 1e-4), la + lb - 1e-4);
    dir.normalize();
    const cosA = (la * la + d * d - lb * lb) / (2 * la * d), sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
    const perp = pole.clone().sub(S).projectOnPlane(dir).normalize();
    const Ed = S.clone().add(dir.clone().multiplyScalar(la * cosA)).add(perp.clone().multiplyScalar(la * sinA));
    // 1) плечо: направление на локоть
    rotW(A, tmpQ.setFromUnitVectors(E.clone().sub(S).normalize(), Ed.clone().sub(S).normalize()));
    // 2) скрутка вокруг плеча: ось сгиба — по нормали плоскости сгиба
    const axis = Ed.clone().sub(S).normalize();
    const want = axis.clone().cross(target.clone().sub(Ed)).normalize();
    const cur = hingeLocal.clone().applyQuaternion(wq(A));
    if (want.lengthSq() > 1e-6) rotW(A, axisAngle(axis, signedAngle(cur, want, axis) * 180 / Math.PI));
    // 3) средний сустав: направление на цель
    const E2 = wpos(M), X2 = wpos(C);
    rotW(M, tmpQ.setFromUnitVectors(X2.clone().sub(E2).normalize(), target.clone().sub(E2).normalize()));
  };
  // Клинок по направлению blade и плоскостью лезвия flat
  Rig.prototype.blade = function (blade, flat) {
    const Wr = this.B.WRIST_R;
    const cur = this.bladeLocal.clone().applyQuaternion(wq(Wr));
    rotW(Wr, tmpQ.setFromUnitVectors(cur, blade.clone().normalize()));
    if (flat) {
      const ax = blade.clone().normalize(), cf = this.flatLocal.clone().applyQuaternion(wq(Wr));
      rotW(Wr, axisAngle(ax, signedAngle(cf, flat, ax) * 180 / Math.PI));
    }
  };
  Rig.prototype.tip = function () { return this.B.WRIST_R.localToWorld(this.tipLocal.clone()); };
  // Пальцы: сгиб каждой фаланги вокруг оси (в мировых осях исходной позы)
  Rig.prototype.curl = function (side, deg, thumbDeg) {
    const B = this.B, ax = V(0, 0, side === 'R' ? 1 : -1);
    for (const f of ['FORE', 'MIDDLE', 'MEDICINAL', 'LITTLE']) for (let i = 1; i <= 3; i++) rotW(B['F_' + f + i + '_' + side], axisAngle(ax, deg * (i === 1 ? 0.8 : 1)));
    if (thumbDeg) for (let i = 1; i <= 3; i++) rotW(B['F_THUMB' + i + '_' + side], axisAngle(V(1, 0, 0), thumbDeg * (i === 1 ? 0.5 : 1)));
  };
  // Корпус: поворот вокруг Y, наклон вперёд (X) и вбок (Z), градусы — распределены по позвонкам
  Rig.prototype.torso = function (yaw, pitch, roll) {
    const B = this.B, parts = [['WAIST', 0.25], ['SPINE1', 0.25], ['SPINE2', 0.25], ['SPINE3', 0.25]];
    for (const [n, k] of parts) {
      if (yaw) rotW(B[n], axisAngle(V(0, 1, 0), yaw * k));
      if (pitch) rotW(B[n], axisAngle(V(1, 0, 0), pitch * k));
      if (roll) rotW(B[n], axisAngle(V(0, 0, 1), roll * k));
    }
  };
  Rig.prototype.head = function (yaw, pitch) {
    const B = this.B;
    rotW(B.NECK, axisAngle(V(0, 1, 0), yaw * 0.4)); rotW(B.HEAD, axisAngle(V(0, 1, 0), yaw * 0.6));
    rotW(B.NECK, axisAngle(V(1, 0, 0), pitch * 0.4)); rotW(B.HEAD, axisAngle(V(1, 0, 0), pitch * 0.6));
  };
  // Таз: сдвиг вниз/вбок; ступни остаются на месте (IK ног)
  Rig.prototype.hips = function (dx, dy, dz, footR, footL) {
    const B = this.B;
    B.WAIST.position.add(B.WAIST.parent.worldToLocal(wpos(B.WAIST).add(V(dx, dy, dz))).sub(B.WAIST.position));
    B.WAIST.updateMatrixWorld(true);
    this.ik('THIGH_R', 'CLANK_R', 'TOE1_R', footR || this.footR, wpos(B.CLANK_R).add(V(0, 0, 1)), this.kneeR);
    this.ik('THIGH_L', 'CLANK_L', 'TOE1_L', footL || this.footL, wpos(B.CLANK_L).add(V(0, 0, 1)), this.kneeL);
  };
  window.Rig = Rig;
})();
</script>
<script>
/*
 * Getsuga Tenshou 3D — сцена для живой вставки Slideria.
 * Ичиго (GLB со скелетом) встаёт в стойку, копит реяцу, замахивается и бьёт;
 * мир — манга в ч/б, а с ударом взрывается цветом от клинка. Всё — функция времени t:
 * slideriaSeek(ms) показывает любой момент (так снимается заставка).
 */
(function () {
  'use strict';
  const T = THREE;
  const V = (x, y, z) => new T.Vector3(x, y, z);

  /* ---- Настройки ---- */
  const SOUND = true;           // звук удара по щелчку
  const AUTOPLAY_DELAY = 700;   // мс от загрузки до начала

  /* ---- Хронометраж, мс ---- */
  const TL = {
    close0: 900, close1: 1450,    // крупный план лица
    wind0: 1450, wind1: 1800,     // замах
    charge0: 1800,                // заряд над головой: клинок наливается энергией, цвет просачивается в мангу
    slash0: 2750, slash1: 2900,   // удар
    rel: 2900,                    // вспышка
    wipe0: 3010, wipe1: 3560,     // цвет разливается от клинка
    wave0: 2920, wave1: 4360,     // полёт волны
    cut: 4210,                    // разрез кадра
    set: 5260,                    // тишина после
  };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const sat = (k) => clamp(k, 0, 1);
  const eIn = (k) => k * k * k;
  const eOut = (k) => 1 - Math.pow(1 - k, 3);
  const eInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  const eBack = (k) => { const c = 2.4; k -= 1; return 1 + (c + 1) * k * k * k + c * k * k; };
  const span = (t, a, b) => sat((t - a) / (b - a));
  function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  /* ---- Рендер ---- */
  const host = document.getElementById('stage');
  const renderer = new T.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFShadowMap;
  host.appendChild(renderer.domElement);
  let DPR = 1, VW = 1, VH = 1, QS = 1;   // QS — доля разрешения: на слабой видеокарте снижается сама
  const scene = new T.Scene();
  scene.fog = new T.FogExp2(0x0b0912, 0.03);
  const camera = new T.PerspectiveCamera(34, 16 / 9, 0.05, 200);

  /* ---- Небо: градиент, звёзды, луна-полумесяц ---- */
  const sky = new T.Mesh(new T.SphereGeometry(120, 32, 16), new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: { uRed: { value: 0 } },
    vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec3 vD; uniform float uRed;
      float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }
      void main(){
        float y = vD.y;
        vec3 c = mix(vec3(0.05,0.04,0.08), vec3(0.008,0.01,0.03), smoothstep(-0.05, 0.6, y));
        c += vec3(0.5,0.05,0.09) * uRed * exp(-max(y,0.0)*7.0) * 0.35;
        vec3 q = floor(vD * 260.0); float s = h(q);
        c += vec3(1.0) * step(0.9975, s) * smoothstep(0.0, 0.25, y) * (0.5 + 0.5*h(q+1.0));
        vec3 md = normalize(vec3(-0.55, 0.42, -0.72)); float a = acos(clamp(dot(vD, md), -1.0, 1.0));
        vec3 md2 = normalize(md + vec3(0.03, 0.02, 0.0)); float a2 = acos(clamp(dot(vD, md2), -1.0, 1.0));
        float moon = smoothstep(0.052, 0.048, a) * smoothstep(0.044, 0.05, a2);
        c += vec3(1.6,1.5,1.35) * moon + vec3(0.25,0.22,0.24) * exp(-a*14.0) * 0.6;
        gl_FragColor = vec4(c, 1.0);
      }`,
  }));
  scene.add(sky);

  /* ---- Земля ---- */
  function noiseTex(size, seed) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d'), img = x.createImageData(size, size);
    for (let i = 0; i < size * size; i++) {
      const px = i % size, py = (i / size) | 0;
      let v = 0, amp = 1, f = 4;
      for (let o = 0; o < 4; o++) { v += amp * (Math.sin(px / size * f * 6.283 + seed * (o + 1)) * Math.cos(py / size * f * 6.283 + seed * 2.1 * (o + 1)) * 0.5 + rnd(i * (o + 3) + seed) * 0.5); amp *= 0.5; f *= 2; }
      const g = clamp(70 + v * 50, 0, 255);
      img.data[i * 4] = g; img.data[i * 4 + 1] = g * 0.92; img.data[i * 4 + 2] = g * 0.95; img.data[i * 4 + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.colorSpace = T.SRGBColorSpace;
    return t;
  }
  const groundTex = noiseTex(256, 3); groundTex.repeat.set(30, 30);
  const ground = new T.Mesh(new T.PlaneGeometry(160, 160), new T.MeshStandardMaterial({ color: 0x4a4248, map: groundTex, roughness: 0.96, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);

  /* ---- Свет ---- */
  const hemi = new T.HemisphereLight(0x55608a, 0x100810, 0.55); scene.add(hemi);
  const moon = new T.DirectionalLight(0xc9d4ff, 1.6);
  moon.position.set(-5, 9, -7); moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048); moon.shadow.bias = -0.0004; moon.shadow.normalBias = 0.02;
  Object.assign(moon.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
  scene.add(moon);
  const key = new T.DirectionalLight(0xffe0d0, 0.55); key.position.set(-3, 3, 6); scene.add(key);
  const auraL = new T.PointLight(0xff2448, 0, 9, 2); auraL.position.set(0, 0.7, 0.3); scene.add(auraL);
  const flashL = new T.PointLight(0xffe8e8, 0, 14, 2); scene.add(flashL);
  const waveL = new T.PointLight(0xff2a4a, 0, 10, 2); scene.add(waveL);

  /* ---- Частицы реяцу (GPU): всё — функция времени ---- */
  function pointsMat(frag, blending, extra) {
    return new T.ShaderMaterial({
      transparent: true, depthWrite: false, blending, fog: false,
      uniforms: Object.assign({ uT: { value: 0 }, uA: { value: 0 }, uScale: { value: 1 } }, extra || {}),
      vertexShader: document.getElementById(frag.vs).textContent,
      fragmentShader: document.getElementById(frag.fs).textContent,
    });
  }
  function seeds(n, k) {
    const g = new T.BufferGeometry(), a = new Float32Array(n * 4);
    for (let i = 0; i < n * 4; i++) a[i] = rnd(i * 1.37 + k);
    g.setAttribute('position', new T.BufferAttribute(new Float32Array(n * 3), 3));
    g.setAttribute('aSeed', new T.BufferAttribute(a, 4));
    g.boundingSphere = new T.Sphere(V(0, 0, 0), 1e4);
    return g;
  }
  const auraUni = { uBurst: { value: 0 }, uCenter: { value: V(0, 0, 0.1) } };
  const auraGlow = new T.Points(seeds(1400, 1), pointsMat({ vs: 'vsAura', fs: 'fsGlow' }, T.AdditiveBlending, auraUni));
  const auraSmoke = new T.Points(seeds(1100, 2), pointsMat({ vs: 'vsAura', fs: 'fsSmoke' }, T.NormalBlending, auraUni));
  auraSmoke.material.uniforms.uSmoke = { value: 1 };
  auraGlow.material.uniforms.uSmoke = { value: 0 };
  scene.add(auraSmoke, auraGlow);
  const motes = new T.Points(seeds(500, 3), pointsMat({ vs: 'vsMotes', fs: 'fsGlow' }, T.AdditiveBlending, { uHand: { value: V(0, 1, 0) } }));
  motes.material.uniforms.uSmoke = { value: 0 };
  scene.add(motes);
  const trenchUni = { uZ0: { value: 1.4 }, uLen: { value: 30 }, uX: { value: 0.6 }, uW0: { value: TL.wave0 }, uW1: { value: TL.wave1 } };
  const embers = new T.Points(seeds(900, 4), pointsMat({ vs: 'vsEmbers', fs: 'fsGlow' }, T.AdditiveBlending, trenchUni));
  embers.material.uniforms.uSmoke = { value: 0 };
  scene.add(embers);

  /* ---- Разлом земли: остывающая раскалённая трещина вдоль пути волны ---- */
  const trench = new T.Mesh(new T.PlaneGeometry(2.4, 44, 1, 1), new T.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false, polygonOffset: true, polygonOffsetFactor: -2,
    uniforms: Object.assign({ uT: { value: 0 } }, trenchUni),
    vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: document.getElementById('fsTrench').textContent,
  }));
  trench.rotation.x = -Math.PI / 2; trench.position.set(0.6, 0.004, 1.4 + 22);
  scene.add(trench);

  /* ---- Камни: поднимаются при накоплении, разлетаются от удара и из разлома ---- */
  const NR = 70;
  const rocks = new T.InstancedMesh(new T.IcosahedronGeometry(1, 0), new T.MeshStandardMaterial({ color: 0x3a3034, roughness: 0.9, flatShading: true }), NR);
  rocks.castShadow = true; rocks.frustumCulled = false;
  scene.add(rocks);
  const rockM = new T.Matrix4(), rockQ = new T.Quaternion(), rockE = new T.Euler();

  /* ---- Волна Гецуги: полумесяц-шейдер, повёрнутый к камере вокруг оси полёта ---- */
  const waveMat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, side: T.DoubleSide, fog: false,
    uniforms: { uT: { value: 0 }, uBorn: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv*2.0-1.0; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: document.getElementById('fsWave').textContent,
  });
  const wave = new T.Mesh(new T.PlaneGeometry(2, 2), waveMat);
  wave.visible = false; scene.add(wave);
  const sparks = new T.Points(seeds(420, 5), pointsMat({ vs: 'vsSparks', fs: 'fsGlow' }, T.AdditiveBlending));
  sparks.material.uniforms.uSmoke = { value: 0 };
  wave.add(sparks);

  /* ---- След меча: лента из положений клинка за последние доли секунды ---- */
  const TRAIL = 18;
  const trailGeo = new T.BufferGeometry();
  trailGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(TRAIL * 2 * 3), 3));
  trailGeo.setAttribute('aK', new T.BufferAttribute(new Float32Array(TRAIL * 2 * 2), 2));
  const tIdx = [];
  for (let i = 0; i < TRAIL - 1; i++) { const a = i * 2; tIdx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  trailGeo.setIndex(tIdx);
  for (let i = 0; i < TRAIL; i++) { trailGeo.attributes.aK.setXY(i * 2, i / (TRAIL - 1), 0); trailGeo.attributes.aK.setXY(i * 2 + 1, i / (TRAIL - 1), 1); }
  const trail = new T.Mesh(trailGeo, new T.ShaderMaterial({
    transparent: true, depthWrite: false, side: T.DoubleSide, blending: T.AdditiveBlending, fog: false,
    uniforms: { uA: { value: 0 } },
    vertexShader: 'attribute vec2 aK; varying vec2 vK; void main(){ vK = aK; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec2 vK; uniform float uA;
      void main(){ float age = vK.x, along = vK.y;
        float a = pow(1.0-age, 1.6) * smoothstep(0.0, 0.35, along) * uA;
        vec3 c = mix(vec3(3.2,0.25,0.45), vec3(6.0,5.2,5.2), pow(along,4.0)*(1.0-age));
        gl_FragColor = vec4(c*a, a); }`,
  }));
  trail.frustumCulled = false; trail.visible = false; scene.add(trail);
  // В манге росчерк — тушью: чёрная лента с белой кромкой
  const trailInk = new T.Mesh(trailGeo, new T.ShaderMaterial({
    transparent: true, depthWrite: false, side: T.DoubleSide, fog: false,
    uniforms: { uA: { value: 0 } },
    vertexShader: 'attribute vec2 aK; varying vec2 vK; void main(){ vK = aK; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec2 vK; uniform float uA;
      void main(){ float age = vK.x, along = vK.y;
        float a = pow(1.0-age, 1.2) * smoothstep(0.0, 0.3, along) * uA;
        float edge = smoothstep(0.9, 0.97, along) * (1.0 - age);
        gl_FragColor = vec4(vec3(edge * 1.5), a); }`,
  }));
  trailInk.frustumCulled = false; trailInk.visible = false; scene.add(trailInk);

  /* ---- Заряд клинка: искры вокруг лезвия, разряды, трещины у ног ---- */
  const bladeUni = { uHilt: { value: V() }, uTip: { value: V() } };
  const bladeFx = new T.Points(seeds(520, 6), pointsMat({ vs: 'vsBlade', fs: 'fsGlow' }, T.AdditiveBlending, bladeUni));
  bladeFx.material.uniforms.uSmoke = { value: 0 };
  scene.add(bladeFx);
  const BOLTS = 7, BSEG = 7;
  const boltGeo = new T.BufferGeometry();
  boltGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(BOLTS * BSEG * 2 * 3), 3));
  const bolts = new T.LineSegments(boltGeo, new T.LineBasicMaterial({ color: new T.Color(4.5, 0.7, 0.9), transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false }));
  bolts.frustumCulled = false; scene.add(bolts);
  const crack = new T.Mesh(new T.PlaneGeometry(4.4, 4.4), new T.ShaderMaterial({

        let prev = p0;
        for (let k = 1; k <= BSEG; k++) {
          const q = p0.clone().addScaledVector(dir, k / BSEG).add(V(rnd(seed * 31 + b * 7 + k) - 0.5, rnd(seed * 17 + b * 5 + k) - 0.5, rnd(seed * 23 + b * 3 + k) - 0.5).multiplyScalar(k < BSEG ? 0.09 : 0));
          bp.setXYZ(n++, prev.x, prev.y, prev.z); bp.setXYZ(n++, q.x, q.y, q.z); prev = q;
        }
      }
      bp.needsUpdate = true;
    }
    crack.material.uniforms.uCrack.value = eOut(span(t, TL.charge0 + 150, TL.slash0));
    crack.material.uniforms.uHeat.value = t < TL.rel ? ch : Math.max(0.15, Math.exp(-(t - TL.rel) / 1500));

    // Свет и контровой
    // В манге красный свет не нужен (он прожигал бы ткань до «энергии»); в цвете — во всю силу
    auraL.intensity = (t < TL.rel + 1200 ? 2 + 40 * aura : 1.2) * lerp(0.08, 1, colorOn);
    moon.intensity = t < TL.wipe0 ? 1.6 : 2.2;
    rimUni.uRim.value = t < TL.rel ? 0.3 + 1.1 * eIn(sat(t / TL.charge0)) + 1.2 * ch : 0.14 + 1.0 * Math.exp(-(t - TL.rel) / 450);
    key.intensity = lerp(0.55, 1.3, colorOn); hemi.intensity = lerp(0.55, 0.9, colorOn);
    for (const m of eyeMats) m.emissiveIntensity = t > TL.close0 + 200 && t < TL.close1 + 200 ? 30 * span(t, TL.close0 + 200, TL.close1 - 100) : t >= TL.charge0 ? 8 + 10 * ch : 0;
    flashL.position.copy(tipNow); flashL.intensity = t >= TL.rel ? 260 * Math.exp(-(t - TL.rel) / 180) : t >= TL.charge0 ? 6 * ch * ch : 0;
    sky.material.uniforms.uRed.value = aura;

    // Камни
    for (let i = 0; i < NR; i++) {
      const s = rnd(i + 0.5), s2 = rnd(i + 7.3), s3 = rnd(i + 13.1);
      let x, y, z, size;
      if (i < 26) {
        const a = s * 6.283, r = 0.5 + s2 * 1.0;
        const bx = Math.cos(a) * r, bz = Math.sin(a) * r + 0.2;
        size = 0.02 + s3 * 0.045;
        const lift = eIn(sat(t / TL.rel)) * (0.25 + s2 * 1.1) + Math.sin(t * 0.004 + i) * (0.03 + 0.05 * ch) * cp;
        if (t < TL.rel) { x = bx; y = size + lift; z = bz; }
        else {
          const dt = (t - TL.rel) / 1000, d = Math.hypot(bx, bz) || 1, v = 4 + s3 * 6;
          x = bx + bx / d * v * dt; z = bz + bz / d * v * dt; y = Math.max(size, size + lift + (3 + s2 * 4) * dt - 4.9 * dt * dt);
        }
      } else {
        // Обломки из разлома: вылетают, когда над ними проходит волна
        const zz = 1.6 + s * 24, tr = TL.wave0 + Math.pow((zz - 1.4) / 30, 1 / 1.7) * (TL.wave1 - TL.wave0);
        size = 0.03 + s3 * 0.07;
        const dt = (t - tr) / 1000;
        if (dt < 0) { x = 0; y = -5; z = 0; }
        else { x = 0.6 + (s2 - 0.5) * 0.8 + (s2 - 0.5) * 3 * dt; z = zz + 1.5 * dt; y = Math.max(-0.2, size + (3 + s3 * 5) * dt - 4.9 * dt * dt); }
      }
      rockE.set(t * 0.002 * (s - 0.5) + i, t * 0.003 * (s2 - 0.5), i * 0.7); rockQ.setFromEuler(rockE);
      rockM.compose(V(x, y, z), rockQ, V(size, size * (0.6 + s3 * 0.6), size));
      rocks.setMatrixAt(i, rockM);
    }
    rocks.instanceMatrix.needsUpdate = true;

    // След меча: положения клинка в недавние моменты
    if (t >= TL.slash0 - 20 && t < TL.rel + 320) {
      const pos = trailGeo.attributes.position;
      const hilt = V(), tip = V();
      for (let i = 0; i < TRAIL; i++) {
        const ts = Math.min(t, TL.slash1 + 40) - i * 9;
        applyPose(poseAt(ts), ts);
        tip.copy(rig.tip()); rig.B.WRIST_R.getWorldPosition(hilt);
        hilt.lerp(tip, 0.25);
        pos.setXYZ(i * 2, hilt.x, hilt.y, hilt.z); pos.setXYZ(i * 2 + 1, tip.x, tip.y, tip.z);
      }
      pos.needsUpdate = true;
      applyPose(poseAt(t), t);
      const ta = t < TL.rel ? sat((t - TL.slash0) / 40) : Math.exp(-(t - TL.rel) / 160);
      const ink = t < TL.wipe0;
      trail.visible = !ink; trailInk.visible = ink;
      trail.material.uniforms.uA.value = ta; trailInk.material.uniforms.uA.value = ta * 0.95;
    } else { trail.visible = false; trailInk.visible = false; }

    // Волна
    if (t >= TL.wave0 && t < TL.wave1 + 50) {
      const w = waveState(t);
      wave.visible = true;
      // Точка пути — тело серпа; центр его окружности позади на ~0,68 размера
      const fwd = V(0, 0, 1), c = V(w.x, w.y, w.z - 0.68 * w.s * 1.6);
      const toCam = camera.position.clone().sub(c).projectOnPlane(fwd).normalize();
      const up = toCam.clone().cross(fwd).normalize();
      const m = new T.Matrix4().makeBasis(fwd, up.negate(), toCam);
      wave.matrixAutoUpdate = false;
      wave.matrix.copy(m).scale(V(w.s * 1.6, w.s * 1.6, 1)).setPosition(c);
      waveMat.uniforms.uT.value = t; waveMat.uniforms.uBorn.value = sat((t - TL.wave0) / 150);
      waveL.position.set(w.x, w.y, w.z); waveL.intensity = 70 * sat((t - TL.wave0) / 80);
    } else { wave.visible = false; waveL.intensity = 0; }
    trench.material.uniforms.uT.value = t;

    // Постобработка
    post.uTime.value = now;
    const tipS = toScreen(waveO);
    post.uBW.value = t < TL.wipe0 ? 1 : t < TL.wipe1 ? 1 : 0;
    post.uWipeC.value.copy(tipS);
    post.uWipeR.value = t < TL.wipe0 ? 0 : eOut(span(t, TL.wipe0, TL.wipe1)) * 2.2;
    post.uRing.value = t >= TL.wipe0 && t < TL.wipe1 ? 1 - span(t, TL.wipe0, TL.wipe1) : 0;
    post.uSpot.value = t < TL.wipe1 ? spot : 0;
    post.uInvert.value = t >= TL.rel + 70 && t < TL.rel + 140 ? 1 : 0;
    let fl = 0;
    if (t >= TL.rel - 30 && t < TL.rel + 70) fl = t < TL.rel ? sat((t - TL.rel + 30) / 30) : 1 - eOut((t - TL.rel) / 70) * 0.7;
    if (t >= TL.cut && t < TL.cut + 260) fl = Math.max(fl, 0.45 * Math.exp(-(t - TL.cut) / 80));
    post.uFlash.value = fl;
    let ln = 0, lc = toScreen(V(0, 1.1, 0.2));
    if (t > 450 && t < TL.close0) ln = 0.35 * span(t, 450, TL.close0);
    else if (t >= TL.close0 && t < TL.close1) { ln = 0.65 * sat((t - TL.close0) / 250); lc = toScreen(head); }
    else if (t >= TL.charge0 + 200 && t < TL.slash0) { ln = 0.5 * eInOut(span(t, TL.charge0 + 200, TL.slash0)); lc = toScreen(bladeUni.uHilt.value.clone().lerp(tipNow, 0.5)); }
    else if (t >= TL.rel && t < TL.rel + 450) { ln = 0.8 * (1 - span(t, TL.rel, TL.rel + 450)); lc = tipS; }
    post.uLines.value = ln; post.uLinesC.value.copy(lc); post.uLinesInk.value = t < TL.wipe0 ? 1 : 0;
    post.uZoom.value = t >= TL.rel ? 0.16 * Math.exp(-(t - TL.rel) / 220) : t > TL.slash0 ? 0.05 * span(t, TL.slash0, TL.rel) : 0;
    post.uZoomC.value.copy(tipS);
    post.uCA.value = t >= TL.rel ? 0.012 * Math.exp(-(t - TL.rel) / 300) + (t >= TL.cut ? 0.008 * Math.exp(-(t - TL.cut) / 200) : 0) : 0;
    post.uExpo.value = t >= TL.rel ? 1 + 0.6 * Math.exp(-(t - TL.rel) / 300) : 1;
    // Разрез: линия по пути волны на экране
    if (t >= TL.cut && t < TL.cut + 1100) {
      const a = toScreen(V(0.6, 1.15, waveO.z)), b = toScreen(V(0.6, 1.15, waveO.z + 12));
      const dir = b.clone().sub(a); dir.x *= VW / VH; dir.normalize();
      post.uCut.value = Math.pow(1 - span(t, TL.cut, TL.cut + 1100), 2);
      post.uCutP.value.copy(a); post.uCutN.value.set(-dir.y, dir.x);
      post.uCutOff.value = 0.014 * Math.exp(-(t - TL.cut) / 220) * sat((t - TL.cut) / 40);
    } else post.uCut.value = 0;
    renderAll();
  }

  /* ---- Надписи и кадр ---- */
  const c1 = document.getElementById('c1'), c2 = document.getElementById('c2'), kj = document.getElementById('kj');
  const barT = document.getElementById('bt'), barB = document.getElementById('bb'), hint = document.getElementById('hint'), ui = document.getElementById('ui');
  c1.innerHTML = 'GETSUGA…'.split('').map((ch) => '<span>' + ch + '</span>').join('');
  const spans = c1.querySelectorAll('span');
  function dom(t) {
    const col = ran && t >= TL.wipe0;
    document.body.classList.toggle('col', col);
    document.body.classList.toggle('charge', ran && t >= TL.charge0 + 200 && !col);
    for (let i = 0; i < spans.length; i++) spans[i].classList.toggle('on', ran && t >= 250 + i * 90);
    if (!ran || t < TL.rel) c2.style.opacity = '0';
    else {
      const k = sat((t - TL.rel) / 380), s = lerp(3.4, 1, eBack(k)), wob = Math.exp(-(t - TL.rel) / 500) * Math.sin(t * 0.06) * 3;
      const m = eOut(sat((t - TL.rel - 320) / 380));
      c2.style.opacity = String(sat((t - TL.rel) / 60));
      c2.style.left = lerp(50, 33, m).toFixed(2) + '%';
      c2.style.top = lerp(52, 31, m).toFixed(2) + '%';
      c2.style.transform = 'translate(-50%,-50%) rotate(' + (-7 + wob).toFixed(2) + 'deg) skewX(-10deg) scale(' + (s * lerp(1, 0.5, m)).toFixed(3) + ')';
    }
    kj.style.opacity = ran ? String(sat((t - TL.set) / 900) * 0.7) : '0';
    hint.style.opacity = ran && t > TL.set + 1200 ? '0.55' : '0';
    const bk = !ran || t < 0 ? 0 : t < TL.set ? eOut(sat(t / 450)) : 1 - eOut(sat((t - TL.set) / 700));
    barT.style.transform = barB.style.transform = 'scaleY(' + bk.toFixed(3) + ')';
    const shake = t >= TL.rel ? 12 * Math.exp(-(t - TL.rel) / 260) : 0;
    ui.style.transform = shake > 0.3 ? 'translate(' + (shake * Math.sin(t * 0.09)).toFixed(1) + 'px,' + (shake * Math.cos(t * 0.077)).toFixed(1) + 'px)' : '';
  }

  /* ---- Звук: всё через общий зал (реверберация); синтез, без файлов ---- */
  let AC = null, NOISE = null, VERB = null;
  function noise(ac, dst, at, dur, type, f0, f1, q, peak, attack) {
    const s = ac.createBufferSource(); s.buffer = NOISE; s.loop = true; s.loopStart = Math.random();
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, at); f.frequency.exponentialRampToValueAtTime(f1, at + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(f); f.connect(g); g.connect(dst); s.start(at); s.stop(at + dur + 0.05);
    return g;
  }
  function tone(ac, dst, at, dur, type, f0, f1, peak, attack) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dst); o.start(at); o.stop(at + dur + 0.05);
    return o;
  }
  function sfx() {
    if (!SOUND) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      const ac = AC, t0 = ac.currentTime + 0.03, sr = ac.sampleRate;
      const at = (ms) => t0 + ms / 1000;
      if (!NOISE) { NOISE = ac.createBuffer(1, sr * 2, sr); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      if (!VERB) {
        const len = Math.floor(sr * 2.4), ir = ac.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
        VERB = ir;
      }
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(ac.destination);
      const out = ac.createGain(); out.gain.value = 0.5; out.connect(comp);
      const verb = ac.createConvolver(); verb.buffer = VERB;
      const wet = ac.createGain(); wet.gain.value = 0.32; verb.connect(wet); wet.connect(comp);
      const bus = ac.createGain(); bus.connect(out); bus.connect(verb);
      const R = TL.rel;
      // Гул реяцу: низ нарастает до самого удара
      noise(ac, bus, at(0), R / 1000, 'lowpass', 80, 320, 0.7, 0.45, R / 1000 * 0.95);
      tone(ac, bus, at(0), R / 1000 + 0.04, 'sine', 34, 72, 0.32, R / 1000 * 0.9);
      // Замах — мягкий взмах ткани и стали
      noise(ac, bus, at(TL.wind0), 0.45, 'bandpass', 260, 1100, 1.4, 0.22, 0.22);
      // Заряд: звенящий гул энергии поднимается к удару
      const whine = tone(ac, bus, at(TL.charge0), (TL.slash0 - TL.charge0) / 1000 + 0.05, 'sawtooth', 90, 380, 0.07, 0.6);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, at(TL.charge0)); lp.frequency.exponentialRampToValueAtTime(2600, at(TL.slash0));
      whine.disconnect(); const wg = ac.createGain(); wg.gain.value = 1; whine.connect(lp); lp.connect(wg);
      const env = ac.createGain(); env.gain.setValueAtTime(0.0001, at(TL.charge0)); env.gain.exponentialRampToValueAtTime(0.09, at(TL.charge0 + 500)); env.gain.exponentialRampToValueAtTime(0.16, at(TL.slash0 - 20)); env.gain.exponentialRampToValueAtTime(0.0001, at(TL.slash0 + 60));
      wg.connect(env); env.connect(bus);
      // Треск разрядов
      for (let i = 0; i < 14; i++) {
        const ms = TL.charge0 + 300 + rnd(i * 3.7) * (TL.slash0 - TL.charge0 - 350);
        noise(ac, bus, at(ms), 0.05 + rnd(i) * 0.05, 'highpass', 2500, 5000, 0.8, 0.05 + 0.06 * rnd(i * 1.3), 0.002);
      }
      // Удар мечом: резкий свист
      noise(ac, bus, at(TL.slash0 - 10), 0.32, 'bandpass', 500, 4800, 1.2, 0.55, 0.06);
      // Гецуга: глубокий удар, хлопок и раскат
      tone(ac, bus, at(R), 1.6, 'sine', 92, 26, 1.0, 0.006);
      noise(ac, bus, at(R), 1.1, 'lowpass', 1800, 100, 0.6, 0.8, 0.004);
      noise(ac, bus, at(R), 0.04, 'highpass', 1500, 3000, 0.7, 0.35, 0.001);
      // Волна проносится мимо
      noise(ac, bus, at(TL.wave0 + 80), 1.1, 'bandpass', 900, 260, 1.6, 0.3, 0.35);
      // Разрез кадра: короткий «шшк» и звон стали, долгий и мягкий
      noise(ac, bus, at(TL.cut - 20), 0.16, 'bandpass', 9000, 2600, 2.2, 0.32, 0.01);
      [[1318, 0.05], [1980, 0.035], [2795, 0.022], [3517, 0.012]].forEach(([f, g], i) => tone(ac, bus, at(TL.cut + i * 4), 1.5 - i * 0.2, 'sine', f, f * 0.996, g, 0.004));
      tone(ac, bus, at(TL.cut), 0.45, 'sine', 64, 42, 0.28, 0.006);
    } catch (e) { /* без звука */ }
  }

  /* ---- Ход ---- */
  let start = Infinity, ran = false, frozen = null;
  function play(withSound) { start = performance.now(); ran = true; frozen = null; if (withSound) sfx(); }
  window.slideriaSeek = (ms) => { ran = true; frozen = ms; };
  addEventListener('pointerdown', (e) => play(e.isTrusted));
  let pulse = 0, lastNow = 0, ema = 16, qCheck = 0;
  function frame(now) {
    // Плавность важнее резкости: если кадры тяжелы, рендер чуть снижает разрешение (и возвращает, когда легко)
    if (lastNow && frozen === null && hero) {
      ema = ema * 0.92 + Math.min(100, now - lastNow) * 0.08;
      if (now - qCheck > 1200) {
        qCheck = now;
        const q = ema > 26 ? Math.max(0.6, QS - 0.15) : ema < 13 && QS < 1 ? Math.min(1, QS + 0.1) : QS;
        if (q !== QS) { QS = q; resize(); }
      }
    }
    lastNow = now;
    // Пульс для сторожа презентации: кадры идут, пусть и медленно (тяжёлая 3D-сцена на слабой видеокарте)
    if (now - pulse > 250) { pulse = now; try { parent.postMessage({ slideriaAlive: 1 }, '*'); } catch (e) { /* не во вставке */ } }
    const t = frozen !== null ? frozen : ran ? now - start : -1;
    if (!ran && now >= start) { ran = true; start = now; }
    if (hero) frameAt(Math.max(t, 0), now);
    dom(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---- Модель ---- */
  // Пока грузится модель и компилируются шейдеры, просим сторожа презентации не перезапускать рамку
  const hold = (ms) => { try { parent.postMessage({ slideriaHold: ms }, '*'); } catch (e) { /* не во вставке */ } };
  hold(15000);
  const loader = new T.GLTFLoader(); loader.setMeshoptDecoder(T.MeshoptDecoder);
  const getModel = window.slideriaFiles
    ? Promise.race([window.slideriaFiles.then((f) => f['hero.glb']), new Promise((_, no) => setTimeout(() => no(new Error('нет файла')), 8000))])
    : fetch('ichigo.glb').then((r) => r.arrayBuffer());
  getModel.then((buf) => new Promise((res, rej) => loader.parse(buf, '', res, rej)))
    .then((g) => {
      prepModel(g);
      // Все шейдеры заранее (волна и след меча появляются посреди удара — без рывка на компиляции)
      frameAt(0, 0);
      for (const o of [wave, trail, trailInk]) o.visible = true;
      bolts.material.opacity = 1;
      hold(15000);
      return (renderer.compileAsync ? renderer.compileAsync(scene, camera) : Promise.resolve(renderer.compile(scene, camera))).then(() => {
        for (const o of [wave, trail, trailInk]) o.visible = false;
        renderAll();
        hold(4000);
        if (!ran) start = performance.now() + AUTOPLAY_DELAY;
        window.__ready = true;
      });
    })
    .catch((e) => { document.getElementById('load').textContent = 'Модель не загрузилась: ' + e.message; });
})();
</script>
</body>
</html>
