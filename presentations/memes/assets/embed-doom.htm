<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DOOM</title>
<!--
  DOOM на слайде: Chocolate Doom, собранный в WebAssembly (cloudflare/doom-wasm, GPL-2.0:
  https://github.com/cloudflare/doom-wasm), и shareware-эпизод DOOM1.WAD (id Software;
  распространяется бесплатно и без изменений). Файлы doom.wasm и doom1.wad приходят от

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; object-fit: contain; image-rendering: pixelated; outline: none; }
  .hint { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; color: #fff;
    font: 600 20px/1.3 system-ui, sans-serif; padding: 0 24px; background: rgba(0, 0, 0, .55); cursor: pointer; transition: opacity .2s; }
  .hint b { font-size: 46px; letter-spacing: .04em; color: #ff3b30; text-shadow: 0 3px 0 #7a0000; }
  .hint small { font-size: 16px; font-weight: 500; opacity: .8; }
  .hint kbd { display: inline-block; min-width: 1.6em; padding: 1px 6px; border: 1px solid rgba(255,255,255,.5); border-radius: 5px; font: inherit; }
  body.play .hint { opacity: 0; pointer-events: none; }
  .load { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: #aaa; font: 15px system-ui, sans-serif; }
</style>
</head>
<body>

<script>
(function () {
  // Клавиши (коды клавиатуры Doom): WASD, стрелки — поворот, пробел — огонь, E — открыть
  var cfg = [
    'key_up 17', 'key_down 31', 'key_strafeleft 30', 'key_straferight 32', 'key_left 75', 'key_right 77',
    'key_fire 57', 'key_use 18', 'key_speed 42', 'key_strafe 56', 'use_mouse 0', 'grabmouse 0',

  var hint = document.getElementById('hint');
  var canvas = document.getElementById('canvas');
  // Игра в фокусе — клавиши у неё; щелчок мимо рамки возвращает их презентации
  function sync() { document.body.classList.toggle('play', document.hasFocus()); }
  addEventListener('focus', sync);
  addEventListener('blur', sync);
  hint.addEventListener('pointerdown', function () { canvas.focus(); setTimeout(sync, 0); });
  addEventListener('keydown', function (e) { if (/^(Arrow|Space|Tab)/.test(e.code)) e.preventDefault(); });

  (window.slideriaFiles || Promise.reject(new Error('нет файлов'))).then(function (f) {

      }],
      onRuntimeInitialized: function () {
        document.getElementById('load').remove();

  });
