<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Getsuga Tenshou</title>
<!--
  Удар в стиле аниме. Сначала — чёрно-белая манга-панель: герой, чёрная реяцу тушью, крупный план, взмах.
  В момент удара мир взрывается цветом от клинка: волна-полумесяц, разлом земли, разрез кадра, тишина.
  Страница манги и вырезанный с неё герой приходят файлами презентации (embed.files: page.webp, hero.webp);
  всё остальное рисуется здесь (canvas 2D), звук синтезируется (Web Audio).
  Запуск при открытии слайда, щелчок — ещё раз (со звуком: без щелчка браузер звук не даёт).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #040306; cursor: pointer; user-select: none; }
  #cam, #ui { position: absolute; inset: 0; will-change: transform; }
  #cam { transform-origin: 45% 50%; }
  #cv, .fx { position: absolute; left: -44px; top: -44px; width: calc(100% + 88px); height: calc(100% + 88px); pointer-events: none; }
  #vig { background: radial-gradient(ellipse 75% 78% at 50% 52%, transparent 52%, rgba(0, 0, 0, .82) 100%); opacity: .3; }
  #grain { opacity: .07; }
  .call { position: absolute; pointer-events: none; white-space: nowrap; font-style: italic; font-weight: 900; color: #fff;
    font-family: "Arial Black", "Segoe UI Black", Impact, "Helvetica Neue", system-ui, sans-serif; }
  /* Ч/б: манга-надпись с жёсткой тенью; в цвете — красное свечение */
  #c1 { left: 49%; top: 12%; font-size: min(6.8vw, 84px); letter-spacing: .05em; -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 5px 5px 0 #000; transition: text-shadow .5s; }
  body.col #c1 { -webkit-text-stroke-width: 2px; text-shadow: 0 0 14px rgba(255, 30, 60, .9), 0 0 44px rgba(255, 0, 40, .55); }
  #c1 span { display: inline-block; opacity: 0; transform: translateY(35%) skewX(-12deg) scale(1.5); filter: blur(8px);
    transition: opacity .16s, transform .3s cubic-bezier(.2, 1.6, .4, 1), filter .22s; }
  #c1 span.on { opacity: 1; transform: skewX(-12deg); filter: none; }
  #c2 { left: 50%; top: 52%; font-size: min(14.5vw, 186px); letter-spacing: .01em; opacity: 0; transform: translate(-50%, -50%);
    -webkit-text-stroke: 7px #000; paint-order: stroke fill;
    text-shadow: 7px 7px 0 #b0001c, 13px 13px 0 #000, 0 0 70px rgba(255, 20, 50, .85); }
  #kj { position: absolute; left: 71%; top: 45%; transform: translateX(-50%); pointer-events: none; opacity: 0; white-space: nowrap;
    font: 900 min(4.4vw, 54px)/1 "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS Mincho", serif; letter-spacing: .32em;
    color: #ff2a4a; text-shadow: 0 0 18px rgba(255, 20, 50, .8), 0 0 50px rgba(255, 0, 40, .45); }
  .bar { position: absolute; left: 0; right: 0; height: 10.5%; background: #000; transform: scaleY(0); pointer-events: none; }
  #bt { top: 0; transform-origin: top; }
  #bb { bottom: 0; transform-origin: bottom; }
  #hint { position: absolute; right: 16px; bottom: 12px; font: 600 13px system-ui, sans-serif; color: #fff; opacity: 0; transition: opacity .6s; pointer-events: none; }
</style>
</head>
<body>
<div id="cam">
  <canvas id="cv"></canvas>
  <div class="fx" id="vig"></div>
  <div class="fx" id="grain"></div>
</div>
<div id="ui">
  <div class="call" id="c1"></div>
  <div class="call" id="c2">TENSHOU!!</div>
  <div id="kj">月牙天衝</div>
</div>
<div class="bar" id="bt"></div>
<div class="bar" id="bb"></div>
<div id="hint">щелчок — ещё раз</div>
<script>
(function () {
  'use strict';
  /* ---- Настройки ---- */
  var SOUND = true;            // звук удара по щелчку
  var AUTOPLAY_DELAY = 600;    // мс от открытия слайда до начала

  /* ---- Хронометраж, мс ---- */
  var T_ZOOM = 800;            // крупный план лица
  var T_SWING = 1230;          // склейка на общий план и взмах
  var T_REL = 1350;            // удар
  var T_WIPE0 = 1480, T_WIPE1 = 2020;  // цвет разливается от клинка
  var W0 = 1360, W1 = 2900;    // полёт волны
  var T_CUT = 2420;            // разрез кадра
  var T_SET = 3700;            // тишина после

  var cam = document.getElementById('cam'), ui = document.getElementById('ui');
  var cv = document.getElementById('cv'), MAIN = cv.getContext('2d'), ctx = MAIN;
  var buf = document.createElement('canvas'), bctx = buf.getContext('2d');
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var c1 = document.getElementById('c1'), c2 = document.getElementById('c2'), kj = document.getElementById('kj');
  var barT = document.getElementById('bt'), barB = document.getElementById('bb'), hint = document.getElementById('hint');
  var vig = document.getElementById('vig'), grainEl = document.getElementById('grain');
  var HAS_FILTER = typeof MAIN.filter === 'string';
  var PAD = 44, DPR = 1, VW = 0, VH = 0, W = 0, H = 0;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function eIn(k) { return k * k * k; }
  function eOut(k) { return 1 - Math.pow(1 - k, 3); }
  function eInOut(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
  function eBack(k) { var c = 2.4; k -= 1; return 1 + (c + 1) * k * k * k + c * k * k; }
  function rot(v, a) { var c = Math.cos(a), s = Math.sin(a); return { x: v.x * c - v.y * s, y: v.x * s + v.y * c }; }
  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  c1.innerHTML = 'GETSUGA…'.split('').map(function (ch) { return '<span>' + ch + '</span>'; }).join('');
  var spans = c1.querySelectorAll('span');

  /* ---- Герой и страница манги ---- */
  var PAGE = null, HERO = null, heroLit = null, heroGlow = null;
  function prepHero() {
    if (!HERO) return;
    var w = Math.round(VW * DPR), h = Math.round(VH * DPR);
    // Герой в цвете: белое — в красную подсветку снизу, тушь остаётся тушью
    heroLit = mk(w, h);
    var x = heroLit.getContext('2d');
    x.drawImage(HERO, 0, 0, w, h);
    x.globalCompositeOperation = 'multiply';
    var g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgb(255,226,226)'); g.addColorStop(0.55, 'rgb(255,170,180)'); g.addColorStop(1, 'rgb(255,92,116)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.globalCompositeOperation = 'destination-in'; x.drawImage(HERO, 0, 0, w, h);
    // Красный ореол по силуэту
    var sil = mk(w, h), sx = sil.getContext('2d');
    sx.drawImage(HERO, 0, 0, w, h); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = '#ff2a4c'; sx.fillRect(0, 0, w, h);
    heroGlow = mk(w, h);
    var gx = heroGlow.getContext('2d');
    if (typeof gx.filter === 'string') {
      gx.filter = 'blur(' + Math.round(9 * DPR) + 'px)'; gx.drawImage(sil, 0, 0);
      gx.filter = 'blur(' + Math.round(30 * DPR) + 'px)'; gx.drawImage(sil, 0, 0); gx.drawImage(sil, 0, 0);
      gx.filter = 'none';
    } else {
      gx.globalAlpha = 0.25;
      for (var i = 0; i < 12; i++) { var a = i / 12 * Math.PI * 2, r = 6 * DPR; gx.drawImage(sil, Math.cos(a) * r, Math.sin(a) * r); }
      gx.globalAlpha = 1;
    }
  }
  function bitmap(b) { return b ? createImageBitmap(new Blob([b], { type: 'image/webp' })) : Promise.reject(new Error('нет файла')); }

  /* ---- Сцена ---- */
  var F, P, WO, E, HB, ANG, U, N, GY, trench = [], cracks = [], stars = [], clouds = [], lines = [], ridge = [];
  function layout() {
    F = { x: VW * 0.224, y: VH * 0.27 };     // лицо
    P = { x: VW * 0.294, y: VH * 0.565 };    // рука с мечом
    HB = { x: VW * 0.2, y: VH * 0.6 };       // середина героя
    WO = { x: VW * 0.56, y: VH * 0.47 };     // где рождается волна
    E = { x: VW * 1.7, y: VH * 0.12 };
    ANG = Math.atan2(E.y - WO.y, E.x - WO.x);
    U = { x: Math.cos(ANG), y: Math.sin(ANG) };
    N = { x: U.y, y: -U.x };
    GY = VH * 0.74;
    trench = [];
    var x0 = VW * 0.36, y0 = VH * 0.93, x1 = VW + PAD, y1 = VH * 0.84;
    for (var x = x0; x <= x1; x += 11) {
      var k = (x - x0) / (x1 - x0);
      trench.push({ x: x, y: lerp(y0, y1, k) + rnd(-3.5, 3.5), w: lerp(1.25, 0.6, k), rev: -1 });
    }
    cracks = [];
    for (var i = 0; i < 16; i++) {
      var at = Math.floor(rnd(2, trench.length - 2)), p = trench[at], pts = [{ x: p.x, y: p.y }];
      var a = (Math.random() < 0.5 ? -1 : 1) * Math.PI / 2 + rnd(-0.9, 0.9), len = rnd(16, 50) * p.w;
      for (var s = 0; s < 3; s++) {
        a += rnd(-0.6, 0.6);
        var q = pts[pts.length - 1];
        pts.push({ x: q.x + Math.cos(a) * len / 3, y: q.y + Math.sin(a) * len / 3 * 0.45 });
      }
      cracks.push({ at: at, pts: pts });
    }
    stars = [];
    for (var j = 0; j < 150; j++) stars.push({ x: rnd(-PAD, VW + PAD), y: rnd(-PAD, VH * 0.62), r: rnd(0.6, 1.7), a: rnd(0.25, 0.85), ph: rnd(0, 6) });
    clouds = [];
    for (var c = 0; c < 8; c++) clouds.push({ x: rnd(0, VW), y: rnd(VH * 0.06, VH * 0.5), rx: rnd(VW * 0.12, VW * 0.3), ry: rnd(VH * 0.014, VH * 0.04), v: rnd(5, 16), a: rnd(0.05, 0.13) });
    lines = [];
    for (var l = 0; l < 120; l++) lines.push({ a: (l / 120) * Math.PI * 2 + rnd(-0.02, 0.02), w: rnd(0.003, 0.011), r: rnd(0, 0.35) });
    ridge = [];
    for (var rx = -PAD; rx <= VW + PAD + 30; rx += rnd(18, 46)) ridge.push({ x: rx, y: GY - rnd(4, 30) - (Math.random() < 0.12 ? rnd(20, 50) : 0) });
    var grain = mk(160, 160), gx = grain.getContext('2d'), img = gx.createImageData(160, 160);
    for (var g = 0; g < img.data.length; g += 4) { var v = Math.random() * 255; img.data[g] = img.data[g + 1] = img.data[g + 2] = v; img.data[g + 3] = 255; }
    gx.putImageData(img, 0, 0);
    grainEl.style.backgroundImage = 'url(' + grain.toDataURL() + ')';
  }
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    VW = innerWidth; VH = innerHeight; W = VW + PAD * 2; H = VH + PAD * 2;
    cv.width = buf.width = bg.width = Math.round(W * DPR);
    cv.height = buf.height = bg.height = Math.round(H * DPR);
    layout();
    paintBg();
    prepHero();
    if (!WG) prepWaveGlow();
  }
  addEventListener('resize', resize);

  /* Мягкие пятна для пламени */
  function sprite(rgb, core) {
    var c = mk(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(' + rgb + ',1)'); g.addColorStop(core, 'rgba(' + rgb + ',0.85)'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return c;
  }
  var SPR_RED = sprite('255,29,68', 0.25), SPR_GRAY = sprite('70,70,70', 0.25), SPR_BLACK = sprite('5,0,6', 0.5);
  // Мягкое красное свечение: вместо радиальных градиентов в каждом кадре
  var GLOW = (function () {
    var c = mk(128, 128), x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,30,60,1)'); g.addColorStop(0.4, 'rgba(255,30,60,0.45)'); g.addColorStop(1, 'rgba(255,30,60,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return c;
  })();
  function glow(x, y, r, a) { if (a <= 0.003) return; ctx.globalAlpha = a; ctx.drawImage(GLOW, x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

  /* Полумесяц: выпуклой стороной вперёд (+x), острия на углах ±A */
  function crescent(R, A, d, c) {
    c = c || ctx;
    var tx = R * Math.cos(A), ty = R * Math.sin(A), r2 = Math.hypot(tx + d, ty), a2 = Math.atan2(ty, tx + d);
    c.beginPath();
    c.arc(0, 0, R, -A, A, false);
    c.arc(-d, 0, r2, a2, -a2, true);
    c.closePath();
  }
  function crescentBack(R, A, d) { return -d + Math.hypot(R * Math.cos(A) + d, R * Math.sin(A)); }
  /* Свечение серпа — один раз в кэш (форма у волны подобна при любом размере) */
  var WG = null;
  function prepWaveGlow() {
    var R0 = 220, pad = R0 * 0.35, w = Math.ceil(R0 * 1.55 + pad * 2), h = Math.ceil(R0 * 2.3 + pad * 2);
    var c = mk(w, h), x = c.getContext('2d'), ox = pad + R0 * 0.25, oy = h / 2;
    x.translate(ox, oy); x.scale(1.1, 1.1);
    if (typeof x.filter === 'string') {
      x.filter = 'blur(' + Math.round(R0 * 0.09) + 'px)';
      crescent(R0, 1.2, R0 * 0.62, x); x.fillStyle = 'rgba(255,31,74,1)'; x.fill(); x.fill();
      x.filter = 'none';
    } else {
      for (var b = 1; b <= 4; b++) { x.save(); x.scale(1 + b * 0.05, 1 + b * 0.05); crescent(R0, 1.2, R0 * 0.62, x); x.restore(); x.fillStyle = 'rgba(255,30,60,0.2)'; x.fill(); }
    }
    WG = { c: c, R0: R0, ox: ox, oy: oy, w: w, h: h };
  }

  /* Неподвижный ночной фон цветной части — один раз в кэш */
  var cloudSpr = null;
  function paintBg() {
    var c = bgx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0); c.translate(PAD, PAD);
    var g = c.createLinearGradient(0, -PAD, 0, GY);
    g.addColorStop(0, '#050409'); g.addColorStop(0.6, '#0c0710'); g.addColorStop(1, '#17080b');
    c.fillStyle = g; c.fillRect(-PAD, -PAD, W, GY + PAD + 1);
    var mx = VW * 0.075, my = VH * 0.13, mr = VH * 0.055;
    var mg = c.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 4.5);
    mg.addColorStop(0, 'rgba(255,232,222,0.16)'); mg.addColorStop(1, 'rgba(255,232,222,0)');
    c.fillStyle = mg; c.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
    c.save(); c.translate(mx, my); c.rotate(-0.6); crescent(mr, 2.5, mr * 0.6, c); c.fillStyle = '#f2ece2'; c.fill(); c.restore();
    c.beginPath(); c.moveTo(-PAD, GY + 1);
    for (var r of ridge) c.lineTo(r.x, r.y);
    c.lineTo(VW + PAD, GY + 1); c.closePath(); c.fillStyle = '#070509'; c.fill();
    var gg = c.createLinearGradient(0, GY, 0, VH + PAD);
    gg.addColorStop(0, '#0e0a0d'); gg.addColorStop(1, '#030203');
    c.fillStyle = gg; c.fillRect(-PAD, GY, W, VH + PAD - GY);
    c.strokeStyle = 'rgba(255,255,255,0.035)'; c.lineWidth = 1; c.beginPath();
    for (var i = -12; i <= 12; i++) { c.moveTo(VW * 0.5 + i * 10, GY); c.lineTo(VW * 0.5 + i * VW * 0.2, VH + PAD); }
    c.stroke();
    cloudSpr = mk(256, 256);
    var cx = cloudSpr.getContext('2d'), cg = cx.createRadialGradient(128, 128, 0, 128, 128, 128);
    cg.addColorStop(0, 'rgba(78,56,80,1)'); cg.addColorStop(1, 'rgba(78,56,80,0)');
    cx.fillStyle = cg; cx.fillRect(0, 0, 256, 256);
  }

  /* ---- Частицы ---- */
  var flames, motes, sparks, flakes, debris, embers, smoke;
  function reset() {
    flames = []; motes = []; sparks = []; flakes = []; debris = []; embers = []; smoke = [];
    trench.forEach(function (p) { p.rev = -1; });
    for (var i = 0; i < spans.length; i++) spans[i].classList.remove('on');
    // Камни у ног героя: поднимаются, пока копится сила
    for (var k = 0; k < 14; k++) {
      var x = HB.x + gauss() * VW * 0.2, y = lerp(VH * 0.8, VH * 0.98, Math.random());
      debris.push(rock(x, y, { float: true, y0: y, h: rnd(40, 170), ph: rnd(0, 6), s: rnd(6, 17) }));
    }
  }
  function rock(x, y, o) {
    var pts = [], n = 5 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) pts.push(rnd(0.6, 1.15));
    var r = { x: x, y: y, vx: rnd(-80, 260), vy: -rnd(220, 560), r: rnd(0, 6), vr: rnd(-8, 8), s: rnd(4, 13), pts: pts, life: 0, max: rnd(1.6, 2.6) };
    if (o) for (var k in o) r[k] = o[k];
    return r;
  }
  function puff(x, y) {
    return { x: x + gauss() * 10, y: y, vx: rnd(-8, 26), vy: -rnd(14, 40), r: rnd(26, 60), gr: rnd(22, 50), life: 0, max: rnd(2.6, 4.6), a: rnd(0.12, 0.22) };
  }
  function emit(rate, dt, fn) {
    var n = rate * dt, c = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);
    for (var i = 0; i < c; i++) fn();
  }
  function heat(age) { return age < 0 ? 0 : 0.2 + 0.8 * Math.exp(-age / 1500); }

  /* Волна: рождается у клинка, набирает размер и разгоняется за край */
  function ws(t) {
    var p = clamp((t - W0) / (W1 - W0), 0, 1), q = Math.pow(p, 1.3), b = eOut(clamp(p / 0.12, 0, 1));
    var R = lerp(VH * 0.3, VH * 0.62, eOut(p)) * lerp(0.4, 1, b);
    // Путь задаёт видимый серп (он лежит впереди центра окружности на ~0,87R)
    var fx = lerp(WO.x, E.x, q), fy = lerp(WO.y, E.y, q);
    return { p: p, fx: fx, x: fx - U.x * R * 0.87, y: fy - U.y * R * 0.87, R: R, A: 1.2, d: R * 0.62, ang: ANG + Math.sin(t * 0.018) * 0.025 };
  }
  function toWorld(w, v) { var r = rot(v, w.ang); return { x: w.x + r.x, y: w.y + r.y }; }

  function update(t, dt) {
    var cp = clamp(t / T_REL, 0, 1);
    if (t >= 0 && t < T_REL + 200) {
      // Реяцу: чёрное пламя вокруг героя, к удару — сильнее
      emit(t < T_REL ? 80 + 320 * cp : 140, dt, function () {
        flames.push({ x: HB.x + gauss() * VW * (0.1 + 0.06 * cp), y: lerp(VH * 0.35, VH * 0.95, Math.random()), vx: gauss() * 30, vy: -rnd(420, 1150) * (0.45 + cp), life: 0, max: rnd(0.5, 1.25), s: rnd(11, 27) * (0.6 + cp * 0.9), ph: rnd(0, 6) });
      });
      if (t < T_REL) {
        emit(40 + 220 * cp, dt, function () {
          motes.push({ a: rnd(0, Math.PI * 2), r: rnd(VH * 0.35, VH * 1.0), v: rnd(220, 540), spin: rnd(-1.6, 1.6), hot: Math.random() < 0.3, life: 0, max: 3 });
        });
        emit(20 + 120 * cp, dt, function () {
          sparks.push({ x: HB.x + gauss() * VW * 0.06, y: lerp(VH * 0.5, VH * 0.95, Math.random()), vx: gauss() * 30, vy: -rnd(700, 1400), life: 0, max: rnd(0.3, 0.6), hot: Math.random() < 0.4 });
        });
      }
    }
    if (t >= W0 && t < W1 + 60) {
      var w = ws(t);
      emit(540, dt, function () {
        var th = rnd(-w.A * 0.92, w.A * 0.92), p = toWorld(w, { x: w.R * Math.cos(th), y: w.R * Math.sin(th) });
        var nr = rot({ x: Math.cos(th), y: Math.sin(th) }, w.ang), sp = rnd(120, 540), fw = rnd(250, 820);
        sparks.push({ x: p.x, y: p.y, vx: U.x * fw + nr.x * sp, vy: U.y * fw + nr.y * sp, life: 0, max: rnd(0.18, 0.5), hot: Math.random() < 0.35 });
      });
      emit(170, dt, function () {
        var sg = Math.random() < 0.5 ? -1 : 1;
        var p = toWorld(w, { x: w.R * Math.cos(w.A) - rnd(0, 30), y: sg * w.R * Math.sin(w.A) * rnd(0.8, 1) });

    ctx.strokeStyle = 'rgba(255,40,70,' + 0.5 * a + ')'; ctx.lineWidth = 22 * a + 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,250,250,' + a + ')'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  function draw(t, now) {
    ctx = MAIN;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.translate(PAD, PAD);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
    if (!ran) {
      // До начала — чистая манга-панель
      drawBW(-1);
      return;
    }
    if (t < T_WIPE0) { drawBW(t); }
    else {
      drawColor(t, now);
      if (t < T_WIPE1) {
        // Цвет разливается кругом от клинка; снаружи ещё манга
        var k = (t - T_WIPE0) / (T_WIPE1 - T_WIPE0), r = eOut(k) * Math.hypot(W, H) * 1.05;
        ctx.save(); ctx.beginPath(); ctx.rect(-PAD, -PAD, W, H); ctx.arc(WO.x, WO.y, r, 0, Math.PI * 2); ctx.clip('evenodd');
        ctx.fillStyle = '#f5f2ec'; ctx.fillRect(-PAD, -PAD, W, H);
        if (PAGE) ctx.drawImage(PAGE, 0, 0, VW, VH);
        ctx.restore();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath(); ctx.arc(WO.x, WO.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,40,70,' + 0.7 * (1 - k) + ')'; ctx.lineWidth = 40 * (1 - k) + 6; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,250,250,' + (1 - k) + ')'; ctx.lineWidth = 3; ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    cut(t);
    var fa = 0;
    if (t >= T_REL && t < T_REL + 70) fa = 1 - (t - T_REL) / 120;
    if (t >= T_CUT && t < T_CUT + 90) fa = Math.max(fa, 0.55 * (1 - (t - T_CUT) / 90));
    if (fa > 0) { ctx.fillStyle = 'rgba(255,255,255,' + fa + ')'; ctx.fillRect(-PAD, -PAD, W, H); }
  }

  /* ---- Надписи, камера, кадр ---- */
  function dom(t) {
    var cp = clamp(t / T_REL, 0, 1), col = ran && t >= T_WIPE0;
    document.body.classList.toggle('col', col);
    vig.style.opacity = col ? '0.9' : '0.3';
    grainEl.style.backgroundPosition = Math.round(Math.random() * 160) + 'px ' + Math.round(Math.random() * 160) + 'px';
    for (var i = 0; i < spans.length; i++) spans[i].classList.toggle('on', ran && t >= 220 + i * 85);
    if (!ran || t < T_REL) c2.style.opacity = '0';
    else {
      // Врезается в центр, потом уходит под «GETSUGA…»
      var k = clamp((t - T_REL) / 380, 0, 1), s = lerp(3.4, 1, eBack(k)), wob = Math.exp(-(t - T_REL) / 500) * Math.sin(t * 0.06) * 3;
      var m = eOut(clamp((t - T_REL - 300) / 380, 0, 1));
      c2.style.opacity = String(clamp((t - T_REL) / 60, 0, 1));
      c2.style.left = lerp(50, 70, m).toFixed(2) + '%';
      c2.style.top = lerp(52, 31, m).toFixed(2) + '%';
      c2.style.transform = 'translate(-50%,-50%) rotate(' + (-7 + wob).toFixed(2) + 'deg) skewX(-10deg) scale(' + (s * lerp(1, 0.5, m)).toFixed(3) + ')';
    }
    kj.style.opacity = ran ? String(clamp((t - T_SET) / 900, 0, 1) * 0.7) : '0';
    hint.style.opacity = ran && t > T_SET + 1200 ? '0.55' : '0';
    var bk = !ran || t < 0 ? 0 : t < T_SET ? eOut(clamp(t / 450, 0, 1)) : 1 - eOut(clamp((t - T_SET) / 700, 0, 1));
    barT.style.transform = barB.style.transform = 'scaleY(' + bk.toFixed(3) + ')';
    var amp = 0, z = 1;
    if (ran && t >= 0) {
      if (t < T_SWING) amp = 0.3 + 3.4 * eIn(cp) + (t >= T_ZOOM ? 2 : 0);
      else if (t < T_REL) amp = 6;
      else { amp = 26 * Math.exp(-(t - T_REL) / 230); z = 1 + 0.07 * Math.exp(-(t - T_REL) / 420); }
      if (t >= W0 && t < W1) amp += 2.5;
      if (t >= T_CUT) amp += 14 * Math.exp(-(t - T_CUT) / 170);
    }
    var tr = '';
    if (amp > 0.05 || z > 1.0005) {
      var dx = amp * (Math.sin(t * 0.093) * 0.55 + (Math.random() - 0.5) * 0.9), dy = amp * (Math.cos(t * 0.071) * 0.55 + (Math.random() - 0.5) * 0.9);
      tr = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px) rotate(' + ((Math.random() - 0.5) * amp * 0.04).toFixed(3) + 'deg)';
    }
    cam.style.transform = tr + (z > 1.0005 ? ' scale(' + z.toFixed(4) + ')' : '');
    ui.style.transform = tr;
    // Кадр-негатив сразу после вспышки
    var inv = ran && t >= T_REL + 70 && t < T_REL + 150 ? 'invert(1) grayscale(1) contrast(2.2)' : '';
    cam.style.filter = ui.style.filter = inv;
  }

  /* ---- Звук: гул накопления, взмах, удар, звон разреза ---- */
  var AC = null, NOISE = null;
  function noise(ac, dst, at, dur, type, f0, f1, q, peak, attack) {
    var s = ac.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, at); f.frequency.exponentialRampToValueAtTime(f1, at + dur);
    var g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(f); f.connect(g); g.connect(dst); s.start(at); s.stop(at + dur + 0.05);
  }
  function tone(ac, dst, at, dur, type, f0, f1, peak, attack) {
    var o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
    var g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dst); o.start(at); o.stop(at + dur + 0.05);
  }
  function sfx() {
    if (!SOUND) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      var ac = AC, t0 = ac.currentTime + 0.03, R = T_REL / 1000, S = T_SWING / 1000, C = T_CUT / 1000;
      if (!NOISE) {
        NOISE = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        var d = NOISE.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      var comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      var out = ac.createGain(); out.gain.value = 0.55; out.connect(comp);
      noise(ac, out, t0, R, 'lowpass', 90, 280, 0.7, 0.5, R * 0.95);               // гул
      tone(ac, out, t0, R + 0.04, 'sine', 36, 74, 0.35, R * 0.9);                 // низ
      noise(ac, out, t0 + S - 0.03, 0.45, 'bandpass', 600, 3600, 1.1, 0.55, 0.05); // взмах
      tone(ac, out, t0 + R, 1.3, 'sine', 95, 28, 1.0, 0.005);                     // удар
      noise(ac, out, t0 + R, 0.9, 'lowpass', 1400, 120, 0.6, 0.8, 0.004);
      tone(ac, out, t0 + C, 0.7, 'triangle', 2400, 2280, 0.08, 0.003);            // звон разреза
      tone(ac, out, t0 + C, 0.5, 'sine', 3700, 3600, 0.05, 0.003);
      noise(ac, out, t0 + C, 0.3, 'highpass', 4000, 6500, 0.7, 0.18, 0.002);
      tone(ac, out, t0 + C, 0.9, 'sine', 70, 35, 0.6, 0.004);
    } catch (e) { /* без звука */ }
  }

  /* ---- Ход ---- */
  resize();
  var start = Infinity, last = performance.now(), ran = false, frozen = null;
  reset();
  function play(withSound) {
    start = performance.now(); ran = true; frozen = null; reset();
    if (withSound) sfx();
  }
  // Стоп-кадр на моменте ms (для заставки): slideriaSeek(1900)
  window.slideriaSeek = function (ms) {
    ran = true; reset();
    for (var x = 0; x <= ms; x += 16) update(x, 0.016);
    frozen = ms;
  };
  addEventListener('pointerdown', function (e) { play(e.isTrusted); });
  // Герой и страница — файлы презентации; без них сцена идёт и так
  var files = window.slideriaFiles
    ? Promise.race([window.slideriaFiles, new Promise(function (_, no) { setTimeout(no, 5000); })])
    : Promise.reject(new Error('нет файлов'));
  files.then(function (f) { return Promise.all([bitmap(f['page.webp']), bitmap(f['hero.webp'])]); })
    .then(function (r) { PAGE = r[0]; HERO = r[1]; prepHero(); })
    .catch(function () { /* без героя */ })
    .then(function () { if (!ran) start = performance.now() + AUTOPLAY_DELAY; });
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (frozen !== null) { draw(frozen, now); dom(frozen); requestAnimationFrame(frame); return; }
    if (!ran && now >= start) { ran = true; start = now; reset(); }
    var t = ran ? now - start : -1;
    update(t, dt);
    draw(t, now);
    dom(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
