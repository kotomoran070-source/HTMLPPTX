# Мемная витрина Slideria: гифки, танцующие 3D-роботы и DOOM прямо на слайде.
# Всё собрано из обычных блоков — откройте в студии и правьте.
#
# Гифки 2-го слайда и попугай нарисованы для этой презентации (эмодзи Noto Color Emoji, OFL);
# остальные — мемы из интернета.
# Робот — RobotExpressive из примеров three.js (Tomás Laulhé, CC0).
# Слайд Getsuga Tenshou: 3D-модель Ичиго из игры по Bleach (© Tite Kubo / Shueisha), прислана для мемной
# презентации. three.js — MIT.
# DOOM — Chocolate Doom в WebAssembly (cloudflare/doom-wasm, GPL-2.0) и shareware-эпизод
# DOOM1.WAD (id Software, распространяется бесплатно и без изменений).

title: Slideria, но мемно
lang: ru
brand:
  name: Slideria
  logo: ./assets/logo.svg
theme:
  accent: "#F43F5E"
  accent2: "#F59E0B"
  accentFlow: true

slides:

  - id: hero
    template: canvas
    label: Slideria, но мемно
    bg: var(--bg)
    backdrop: aurora
    transition: zoom
    free:
      - type: text
        text: SLIDERIA · МЕМНАЯ ВИТРИНА
        styles: {text: {size: 15, weight: 700, spacing: 0.18, color: accent}}
        place: {x: 72, y: 170, w: 560}
        enter: fade
      - type: text
        text: "Slideria,\nно {g:duo|мемно}"
        styles: {text: {size: 76, weight: 800, leading: 1.02, spacing: -0.02, color: text}}
        place: {x: 68, y: 214, w: 620}
        enter: rise
        delay: 200
      - type: text
        text: Демонстрация возможностей, которую никто не просил. Гифки, танцующие роботы, аниме и DOOM — всё на слайдах.
        styles: {text: {size: 21, color: text2, leading: 1.45}}
        place: {x: 72, y: 404, w: 540}
        enter: rise
        delay: 420
      - type: shape
        kind: pill
        fill: gradient
        gradient: {from: accent, to: accent2, angle: 135}
        shadow: md
        text: Поехали  →
        styles: {text: {size: 19}}
        action: slide:gifs
        place: {x: 72, y: 540, w: 220, h: 62}
        enter: pop
        delay: 700
      - type: image
        src: ./assets/meme-party.gif
        radius: 28
        shadow: lg
        angle: 3
        place: {x: 690, y: 170, w: 500, h: 375}
        enter: scale
        delay: 300
    notes: |
      Попугай — обычная GIF-картинка со скруглением, тенью и поворотом. Кнопка «Поехали» — фигура со ссылкой на следующий слайд.

  - id: gifs
    template: canvas
    label: Гифки работают
    bg: var(--bg)
    transition: cover
    free:
      - type: text
        text: Гифки {g:duo|работают}. Мы проверили
        styles: {text: {size: 48, weight: 800, spacing: -0.02, color: text}}
        place: {x: 64, y: 40, w: 1100}
        enter: rise
      - type: image
        src: ./assets/meme-deal.gif
        radius: 18
        shadow: md
        angle: -3
        place: {x: 64, y: 140, w: 360, h: 270}
        enter: rise
        delay: 200
      - type: image
        src: ./assets/meme-fine.gif
        mat: 10
        shadow: md
        angle: 2
        place: {x: 460, y: 132, w: 360, h: 270}
        enter: rise
        delay: 340
      - type: image
        src: ./assets/meme-loading.gif
        radius: 18
        stroke: accent
        width: 3
        angle: -2
        place: {x: 856, y: 140, w: 360, h: 270}
        enter: rise
        delay: 480
      - type: text
        text: "Перетащите свою GIF на слайд — она встанет картинкой и будет играть при показе. Рамки, тени, поворот и фильтры — как у фотографий."
        styles: {text: {size: 19, color: text2, leading: 1.45}}
        place: {x: 64, y: 470, w: 640}
        enter: fade
        delay: 700
      - type: image
        src: ./assets/meme-cat.gif
        radius: 24
        shadow: lg
        angle: 3
        place: {x: 856, y: 440, w: 320, h: 240}
        enter: pop
        delay: 860
      - type: text
        text: "Кот не настоящий. Гифки тоже нарисованы — из эмодзи"
        styles: {text: {size: 14, color: muted}}
        place: {x: 64, y: 640, w: 640}
        enter: fade
        delay: 1000
    notes: Каждая гифка — блок image с обычным оформлением. В PowerPoint уходит первый кадр.

  - id: audience
    template: canvas
    label: Слушатели до и после
    bg: var(--bg)
    transition: push
    free:
      - type: text
        text: Слушатели {g:duo|до и после}
        styles: {text: {size: 48, weight: 800, spacing: -0.02, color: text}}
        place: {x: 64, y: 40, w: 1100}
        enter: rise
      - type: image
        src: ./assets/meme-rat.gif
        radius: 22
        shadow: lg
        angle: -2
        place: {x: 96, y: 150, w: 400, h: 400}
        enter: rise
        delay: 200
      - type: text
        text: "**Первый слайд.** «Ну-ну. Удиви меня»"
        styles: {text: {size: 22, color: text2, align: center}}
        place: {x: 76, y: 584, w: 440}
        enter: fade
        delay: 400
      - type: shape
        kind: arrow
        stroke: accent
        width: 6
        place: {x: 560, y: 340, w: 150, h: 20}
        enter: fade
        delay: 700
      - type: text
        text: "графики, 3D,\nаниме и DOOM"
        styles: {text: {size: 15, weight: 700, color: accent, align: center, leading: 1.3}}
        place: {x: 525, y: 284, w: 220}
        enter: fade
        delay: 800
      - type: image
        src: ./assets/meme-cerveza.gif
        radius: 22
        shadow: lg
        angle: 2
        place: {x: 800, y: 134, w: 280, h: 435}
        enter: pop
        delay: 1000
      - type: text
        text: "**Последний слайд.** «Беру»"
        styles: {text: {size: 22, color: text2, align: center}}
        place: {x: 740, y: 596, w: 400}
        enter: fade
        delay: 1200
    notes: Две гифки и стрелка-фигура. Порядок появления — вкладка «Анимация».
  - id: robots
    template: canvas
    label: Танцуют все
    bg: "radial-gradient(ellipse 80% 70% at 50% 70%, color-mix(in srgb, var(--acs) 80%, var(--bg)), var(--bg) 75%)"
    transition: zoom
    free:
      - type: text
        text: Танцуют {g:duo|все}
        styles: {text: {size: 48, weight: 800, spacing: -0.02, color: text}}
        place: {x: 64, y: 40, w: 900}
        enter: rise
      - type: text
        text: Настоящие 3D-модели с анимацией. Покрутите мышью при показе — двойной щелчок вернёт ракурс.
        styles: {text: {size: 18, color: text2}}
        place: {x: 66, y: 104, w: 1100}
        enter: fade
        delay: 120
      - type: model
        src: ./assets/robot.glb
        poster: ./assets/robot-wave.webp
        animation: Wave
        orbit: 25deg 80deg
        caption: Привет, зал
        place: {x: 40, y: 170, w: 380, h: 500}
        enter: rise
        delay: 250
      - type: model
        src: ./assets/robot.glb
        poster: ./assets/robot-dance.webp
        animation: Dance
        orbit: 0deg 78deg
        caption: Когда дедлайн перенесли
        place: {x: 450, y: 160, w: 380, h: 510}
        enter: rise
        delay: 400
      - type: model
        src: ./assets/robot.glb
        poster: ./assets/robot-thumbs.webp
        animation: ThumbsUp
        orbit: -25deg 80deg
        caption: Одобряю этот слайд
        place: {x: 860, y: 170, w: 380, h: 500}
        enter: rise
        delay: 550
    notes: |
      Блок model с полем animation: Wave, Dance, ThumbsUp. В файле робота есть ещё Jump, Yes, No, Punch, Running и другие —
      поменяйте имя в «Свойствах», и робот займётся другим делом.

  - id: release
    template: canvas
    label: Релиз в пятницу
    bg: "radial-gradient(ellipse 70% 80% at 72% 55%, color-mix(in srgb, #A3B12A 35%, var(--bg)), var(--bg) 72%)"
    transition: zoom
    free:
      - type: text
        text: ПЯТНИЦА · 18:47
        styles: {text: {size: 15, weight: 700, spacing: 0.18, color: accent}}
        place: {x: 72, y: 180, w: 480}
        enter: fade
      - type: text
        text: "Релиз\n{g:duo|выкатили}"
        styles: {text: {size: 72, weight: 800, leading: 1.02, spacing: -0.02, color: text}}
        place: {x: 68, y: 220, w: 520}
        enter: rise
        delay: 150
      - type: text
        text: "Тесты зелёные, PPTX собрался, шрифты на месте. Команда отмечает — как умеет."
        styles: {text: {size: 21, color: text2, leading: 1.45}}
        place: {x: 72, y: 400, w: 470}
        enter: fade
        delay: 350
      - type: chips
        items: [Деплой ✓, Без хотфиксов*, До понедельника]
        place: {x: 72, y: 520, w: 520}
        enter: fade
        delay: 500
      - type: image
        src: ./assets/meme-rats.gif
        radius: 24
        shadow: lg
        place: {x: 620, y: 120, w: 600, h: 488}
        enter: scale
        delay: 250
      - type: text
        text: Команда разработки, архивное фото
        styles: {text: {size: 14, color: muted, align: right}}
        place: {x: 620, y: 622, w: 600}
        enter: fade
        delay: 700
    notes: Гифка на холсте и чипы — звёздочка в конце чипа выделяет его.
  - id: anime
    template: canvas
    label: Аниме-режим
    bg: "#FFF8FB"
    transition: zoom
    free:
      - type: embed
        src: ./assets/embed-anime.htm
        poster: ./assets/embed-anime.webp
        interactive: true
        place: {x: 600, y: 110, w: 620, h: 540}
        enter: scale
        delay: 150
      - type: shape
        kind: rect
        fill: none
        stroke: "#111111"
        width: 5
        place: {x: 597, y: 107, w: 626, h: 546}
        enter: scale
        delay: 150
      - type: text
        text: "Аниме-{g:violet|режим}: ВКЛ"
        styles: {text: {size: 46, weight: 800, spacing: -0.02, color: "#111111"}}
        place: {x: 60, y: 36, w: 1100}
        enter: rise
      - type: image
        src: ./assets/meme-liar.gif
        stroke: "#111111"
        width: 5
        angle: -2
        place: {x: 64, y: 150, w: 480, h: 271}
        enter: rise
        delay: 300
      - type: text
        text: "«Да, я прочитал(а) все материалы заранее»"
        styles: {text: {size: 24, weight: 700, color: "#111111", leading: 1.3}}
        place: {x: 64, y: 448, w: 480}
        enter: fade
        delay: 500
      - type: text
        text: "Справа — живая манга-панель: линии концентрации и сакура. Щёлкните по ней при показе — реплика сменится с ударом."
        styles: {text: {size: 17, color: "#475569", leading: 1.45}}
        place: {x: 64, y: 540, w: 480}
        enter: fade
        delay: 650
    notes: |
      Манга-панель — живая вставка embed-anime.htm (canvas и CSS). Реплики — в начале её кода, их легко поменять.

  - id: getsuga3d
    template: canvas
    label: Getsuga Tenshou 3D
    bg: "#050306"
    transition: zoom
    free:
      - type: embed
        src: ./assets/embed-getsuga3d.htm
        poster: ./assets/embed-getsuga3d.webp
        interactive: true
        dark: true
        files:
          hero.glb: ./assets/ichigo.glb
        place: {x: 0, y: 0, w: 1280, h: 720}
      - type: text
        text: "…и когда переспросили «а можно ещё одну маленькую правку?»"
        styles: {text: {size: 22, weight: 700, color: "#F8FAFC", align: center}}
        place: {x: 140, y: 662, w: 1000}
        enter: fade
        delay: 6200
    notes: |
      Модель Ичиго со скелетом: поза, замах и удар собраны кодом (IK рук и ног, клинок, хват пальцами), анимаций в файле нет.
      Сначала манга в ч/б — контуры тушью и растр считает шейдер прямо по 3D-сцене; при заряде энергия клинка проступает
      кармином, на ударе цвет разливается от клинка.
      Щелчок по сцене — ещё раз, со звуком.

  - id: doom
    template: canvas
    label: DOOM на слайде
    bg: "radial-gradient(ellipse 70% 80% at 70% 55%, #3B0A0A, #0B0B0F 70%)"
    transition: zoom
    free:
      - type: text
        text: "А здесь\n{g:fire|DOOM}"
        styles: {text: {size: 64, weight: 800, leading: 1.02, spacing: -0.02, color: "#FFFFFF"}}
        place: {x: 56, y: 120, w: 420}
        enter: rise
      - type: text
        text: "Да, тот самый. Настоящий движок 1993 года в WebAssembly — прямо на слайде, без плагинов и интернета."
        styles: {text: {size: 20, color: "#E5E7EB", leading: 1.45}}
        place: {x: 58, y: 290, w: 400}
        enter: fade
        delay: 200
      - type: text
        text: "- Щёлкните по игре — клавиатура уходит в неё\n- **WASD** — ходить, **← →** — поворот\n- **Пробел** — огонь, **E** — открыть дверь\n- Щелчок мимо — снова листать слайды"
        styles: {text: {size: 17, color: "#CBD5E1", leading: 1.55}}
        place: {x: 58, y: 410, w: 400}
        enter: fade
        delay: 350
      - type: embed
        src: ./assets/embed-doom.htm
        poster: ./assets/embed-doom.webp
        interactive: true
        dark: true
        files:
          doom.wasm: ./assets/doom.wasm
          doom1.wad: ./assets/doom1.wad
        place: {x: 500, y: 120, w: 720, h: 540}
        enter: scale
        delay: 150
      - type: text
        text: "Движок: Chocolate Doom (cloudflare/doom-wasm, GPL-2.0) · уровни: shareware DOOM1.WAD © id Software"
        styles: {text: {size: 12, color: "#94A3B8"}}
        place: {x: 500, y: 672, w: 720}
        enter: fade
        delay: 600
    notes: |
      Живая вставка: документ embed-doom.htm, движок и уровни — файлы презентации (поле files), поэтому работает
      и в собранном HTML без интернета. Пока игра в фокусе, стрелки и пробел — у неё; щелчок мимо возвращает их слайдам.

  - id: thanks
    template: canvas
    label: Спасибо
    bg: var(--bg)
    backdrop: aurora
    transition: blur
    free:
      - type: image
        src: ./assets/meme-kittens.gif
        radius: 28
        shadow: lg
        place: {x: 485, y: 56, w: 310, h: 302}
        enter: scale
      - type: text
        text: Спасибо, что {g:duo|досмотрели}
        styles: {text: {size: 56, weight: 800, spacing: -0.02, color: text, align: center}}
        place: {x: 140, y: 392, w: 1000}
        enter: rise
        delay: 300
      - type: text
        text: Все свободны. Можно танцевать.
        styles: {text: {size: 22, color: text2, align: center}}
        place: {x: 240, y: 482, w: 800}
        enter: fade
        delay: 600
      - type: shape
        kind: pill
        fill: none
        stroke: gradient
        strokeGradient: {from: accent, to: accent2, angle: 90}
        width: 2
        text: Ещё раз с начала  ↺
        styles: {text: {size: 17, color: text}}
        action: slide:hero
        place: {x: 520, y: 556, w: 240, h: 56}
        enter: pop
        delay: 900
    notes: Кнопка — фигура со ссылкой на первый слайд.
