# Демо-презентация о самом движке. Её показывает лендинг (Landing/public/demo/tour.html).
# Справочник компонентов: docs/COMPONENTS.md. Собрать: yarn build tour

title: HTMLPPTX — презентации как данные
lang: ru
brand:
  name: HTMLPPTX
  logo: ./assets/logo.svg

slides:

  - id: cover
    template: cover
    label: Титульный слайд
    title: Презентации как данные
    lead: Слайды описываются в YAML, внешний вид задают компоненты, а на выходе получается один HTML-файл.
    meta: Эта презентация собрана движком HTMLPPTX
    visual:
      type: network
      nodes: 8
    notes: |
      HTMLPPTX превращает текст в презентацию. Всё, что вы видите, собрано из одного файла deck.yaml.
      Листайте стрелками, O открывает обзор, P — окно докладчика.

  - id: idea
    title: Как это устроено
    body:
      type: hub
      items:
        - title: Данные отдельно от вида
          text: В deck.yaml только тексты, цифры и заметки. Ни стилей, ни кода.
          node: deck.yaml
          sub: тексты и данные
        - title: Компоненты вместо вёрстки
          text: Схема сети, пайплайн, графики, карточки. Подключаются одной строкой type.
          node: Компоненты
          sub: 20+ блоков
        - title: Движок показа
          text: Темы, обзор слайдов, режим докладчика, клавиши и свайпы.
          node: Движок
          sub: показ и докладчик
        - title: Один файл на выходе
          text: Картинки и шрифты внутри. Открывается без интернета, отправляется по почте.
          node: Один HTML
          sub: офлайн, почта, PDF
    notes: |
      Четыре идеи: данные отдельно от вида, компоненты вместо вёрстки,
      готовый движок показа и один файл на выходе. Наведите на пункт — подсветится узел схемы.

  - id: flow
    title: От текста до показа
    body:
      - type: pipeline
        steps:
          - title: Пишете
            sub: deck.yaml
          - title: Смотрите
            sub: yarn dev
          - title: Собираете
            sub: yarn build
          - title: Отправляете
            sub: один .html
      - type: grid
        columns: 1fr 1fr
        items:
          - type: card
            title: Что внутри файла
            body:
              type: kv
              keyWidth: 120
              rows:
                Слайды: все сразу, без подгрузок
                Картинки: встроены прямо в HTML
                Темы: светлая и тёмная
                Печать: слайд на страницу, 16:9
          - type: panel
            title: Клавиши показа
            cells:
              - title: "→ / пробел"
                sub: следующий слайд
              - title: O
                sub: обзор всех слайдов
              - title: P
                sub: окно докладчика
              - title: F
                sub: во весь экран
              - title: T
                sub: светлая / тёмная тема
              - title: B
                sub: чёрный экран
    notes: |
      Правки в deck.yaml видны сразу в yarn dev. Ошибка в данных показывается на странице с номером строки.
      yarn build собирает один файл, который открывается с диска.

  - id: live
    title: Живая графика
    badge: демо-данные
    gap: 8
    body:
      - type: chips
        items:
          - "Слайдов: 7"
          - Размер файла ~110 КБ*
          - Работает офлайн
          - Анимации при открытии слайда
      - type: grid
        columns: 1.7fr 1fr
        items:
          - type: card
            title: Просмотры презентации по дням
            body:
              type: line-chart
              start: первая отправка
              end: сегодня
              scale: 1
              unit: ""
              min: 0
              max: 140
              values: [12, 18, 15, 24, 31, 28, 35, 42, 39, 47, 52, 49, 58, 63, 61, 70, 76, 72, 81, 88, 84, 92, 97, 94, 103, 108, 104, 113, 118, 126]
          - type: stack
            items:
              - type: card
                title: Доступность демо-стенда
                body:
                  - type: uptime
                    threshold: 99.5
                    values: [99.8, 99.9, 99.7, 99.95, 99.6, 99.9, 99.85, 98.9, 99.9, 99.92, 99.8, 99.7, 99.95, 99.9, 99.6, 99.85, 99.9, 99.75, 99.9, 99.95, 99.1, 99.9, 99.8, 99.9, 99.7, 99.95, 99.9, 99.85, 99.9, 99.92]
                  - type: note
                    text: Полоса, график и столбцы прорисовываются при открытии слайда.
              - type: card
                title: Время сборки, с
                body:
                  type: bars
                  max: 2
                  values: [1.8, 1.2, 0.9, 0.7]
                  labels: [v0.1, v0.2, v0.3, v0.4]
    notes: Цифры демонстрационные. Графики берут значения из массива values в deck.yaml.

  - id: control
    title: Карточки, прогресс, настройки
    body:
      type: grid
      columns: 1fr 1fr
      items:
        - type: card
          title: Готовность квартального отчёта
          body:
            - type: progress
              label: Слайды
              value: 12 из 12
              percent: 100
            - type: progress
              label: Цифры из отчёта
              value: 9 из 11
              percent: 82
            - type: note
              text: Прогресс-бары заполняются, когда слайд открывается.
        - type: card
          title: Параметры показа
          body:
            - type: sliders
              rows:
                - label: Скорость анимаций
                  value: обычная
                  position: 0.5
                - label: Шаг пайплайна
                  value: 1 с
                  position: 0.3
                - label: Узлов на схеме сети
                  value: "8"
                  position: 0.66
            - type: note
              text: Всё это — поля в deck.yaml, а не настройки в коде.
    notes: Карточки принимают любые блоки внутри body. Прогресс и ползунки — тоже данные.

  - id: thanks
    template: finale
    label: Соберите свою
    caption: HTMLPPTX · презентации как данные
    title: Соберите свою презентацию
    lead: yarn new имя — и первый слайд готов
    link:
      label: Исходный код
      url: https://github.com/kotomoran070-source/HTMLPPTX
      text: github.com/HTMLPPTX
    buttons:
      - icon: presenter
        label: Режим докладчика — P
      - icon: grid
        label: Обзор слайдов — O
      - icon: chart
        label: Живые графики
    notes: QR-код строится из ссылки автоматически.

  - id: cloud
    template: space
    label: Скоро в облаке
    badge: HTMLPPTX CLOUD
    title: Скоро в облаке
    lead: Правка в браузере, совместная работа, ссылка вместо файла
    link:
      label: Следить за проектом
      url: https://github.com/kotomoran070-source/HTMLPPTX
      text: github.com/HTMLPPTX
    buttons:
      - icon: sliders
        label: Редактор
      - icon: link
        label: Ссылка на показ
      - icon: chart
        label: Статистика просмотров
    notes: Второй этап — режим правки и облачная версия.
