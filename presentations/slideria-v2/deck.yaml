          }
          const BLUR = 0.16;
          // Сход частиц в знак: начало и длительность, с
          const FA0 = 0.08, FA1 = 0.47;

          loop((t) => {
            g.lineCap = 'round';
            if (!FORGE) {
              sky(t, 1);
              g.save();
              g.translate(CX, CY); g.rotate(ROLL); g.translate(-CX, -CY);
              g.drawImage(GLOW, 0, 0, 1280, 720);
              glow(CX, CY, 560, '124,58,237', 0.1);
              // Дальняя половина диска и её изображение над тенью
              for (const p of P) {
                const [x, y, a] = at(p, t);
                const dop = Math.max(0.35, 1 - 0.65 * Math.cos(a));
                if (Math.sin(a) < 0) {
