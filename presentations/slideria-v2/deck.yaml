# «Slideria v2» — эдит под SXYGX «Gloria» (первая минута, точка на 1:04.01).
# Время слайдов (at, steps) — секунды трека по его сетке: 180 уд/мин от 0,01 с, удар — 1/3 с, такт — 2,667 с.
# Трек не хранится в репозитории: положите файл в assets/gloria.m4a. Doom, 3D и картинки — из презентаций memes и slideria.
title: Slideria v2
lang: ru
theme:
  accent: "#7C3AED"
  accent2: "#EC4899"
  accentFlow: true
  mode: dark
  dark:
    bg: "#05060A"
    tx: "#F5F3FF"
    surf: "#11121A"
progress: false
effects:
  ufx-dot:
    name: Точка-штамп
    ms: 280
    ease: cubic-bezier(.2, .7, .2, 1)
  ufx-ring:
    name: Кольцо от точки
    ms: 800
    ease: cubic-bezier(.1, .6, .3, 1)
css: |
  /* Знак Slideria на первом слайде: плитка с росчерком и свечением */
  @keyframes v2-float { 50% { transform: translateY(-8px); } }
  .v2-mark { width: 132px; height: 132px; border-radius: 36px; background: var(--ac-g); display: grid; place-items: center; color: #fff;
    box-shadow: 0 0 0 10px color-mix(in srgb, var(--bg) 100%, transparent), 0 26px 70px -10px color-mix(in srgb, var(--ac) 80%, transparent); animation: v2-float 4s ease-in-out infinite; }
  .v2-mark svg { width: 84px; height: 84px; }
  /* Микрофон агента: полоски голоса */
  @keyframes v2-vu { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .v2-mic { display: flex; align-items: center; gap: 8px; height: 100%; }
  .v2-mic i { width: 12px; height: 56px; border-radius: 6px; background: var(--ac-g); transform-origin: center; animation: v2-vu .667s ease-in-out infinite; }
  .v2-mic i:nth-child(2) { animation-delay: -.11s; } .v2-mic i:nth-child(3) { animation-delay: -.22s; } .v2-mic i:nth-child(4) { animation-delay: -.33s; }
  .v2-mic i:nth-child(5) { animation-delay: -.44s; } .v2-mic i:nth-child(6) { animation-delay: -.55s; } .v2-mic i:nth-child(7) { animation-delay: -.6s; }
  /* Телефон-пульт */
  .v2-phone { position: relative; width: 100%; height: 100%; box-sizing: border-box; border-radius: 44px; padding: 26px 20px; background: #0B0C12;
    border: 2px solid color-mix(in srgb, var(--ac) 50%, transparent); box-shadow: 0 30px 80px -20px color-mix(in srgb, var(--ac) 60%, transparent);
    display: grid; grid-template-rows: auto 1fr auto; gap: 16px; font: 600 18px/1.2 var(--font); color: #E2E8F0; }
  .v2-phone b { color: #94A3B8; font-weight: 600; text-align: center; }
  .v2-ps { display: block; border-radius: 18px; background: var(--ac-g); }
  .v2-phone .v2-pn, .v2-phone .v2-pf { display: grid; place-items: center; height: 70px; border-radius: 20px; }
  .v2-pn { position: absolute; left: 20px; bottom: 26px; width: 34%; background: #1E2030; }
  .v2-pf { position: absolute; right: 20px; bottom: 26px; width: 54%; background: var(--ac); color: #fff; }
  /* Финал: точка штампом в удар и кольцо от неё */
  @keyframes ufx-dot { from { transform: scale(1.5); } }
  @keyframes ufx-ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(5); } }
