            glow(CX, CY, 340, '255,255,255', 0.85 * flash * flash);
            glow(CX, CY, 560, '168,85,247', 0.12 + 0.4 * flash);
            const u = clamp((t - FA0) / FA1);
            for (let i = 0; i < N; i++) {
              const p = P[i];
              const [x, y] = pos(i, t);
              const [x0, y0] = pos(i, t - 0.035);
              // Сошлись — гаснут совсем: сквозь знак не просвечивает сетка точек
              const a = (u < 1 ? 0.95 : 0.95 * Math.max(0, 1 - (t - FA0 - FA1) / 0.28)) + 0.4 * flash;
