  - id: all
    template: canvas
    label: Всё
    bg: "#05040A"
    transition: none
    at: 12.01
    logo: false
    free:
      - type: embed
        code: |
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#05050A}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>

          // Общая обвязка сцен: холст во всю вставку, координаты слайда 1280×720, часы — с появления слайда
          // (performance.now во вставке считает от её создания, а вставка создаётся, когда слайд показан)
          const cv = document.getElementById('c');
          const g = cv.getContext('2d');
          let DPR = Math.min(2, (window.devicePixelRatio || 1) * 1.5);
          function fit() {
            cv.width = Math.round(cv.clientWidth * DPR);
            cv.height = Math.round(cv.clientHeight * DPR);
          }
          addEventListener('resize', fit);
          fit();
          const SX = () => cv.width / 1280;
          const SY = () => cv.height / 720;
          // Псевдослучайные числа с зерном: одинаковые кадр за кадром
          function rng(seed) {
            let s = seed >>> 0 || 1;
            return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
          }
          const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
          const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
          const easeOut = (u) => 1 - Math.pow(1 - u, 3);
          // Кадры идут медленнее 35 в секунду (слабая видеокарта или её нет) — холст в обычном разрешении:
          // иначе смена слайда ждёт отрисовки и опаздывает от удара
          function loop(draw) {
            const gaps = [];
            let last = 0;
            const step = (now) => {
              if (last && DPR > 1) {
                gaps.push(now - last);
                if (gaps.length > 8) {
                  gaps.shift();
                  if ([...gaps].sort((a, b) => a - b)[4] > 28) { DPR = 1; fit(); }
                }
              }
              last = now;
              g.setTransform(SX(), 0, 0, SY(), 0, 0);
              draw(performance.now() / 1000);
              requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
          }

          // «ВСЁ»: камера несётся вперёд. Линии концентрации — тонкие клинья к центру, рисунок меняется 12 раз
          // в секунду (как в аниме «на двойках»), у края ярче, к центру гаснут; звёзды-штрихи летят из центра.
          // На удар (0 и 0,667 с) — встряска, линии подходят к слову и расходятся цветным расколом, вспыхивает сияние.
          // Сами кадры-импакты (белый, затем негатив) рисует слой поверх — он виден с первого кадра слайда
          const CX = 640, CY = 330;
          const HITS = [0, 0.6667];
          const FAR = 1500;
          const r0 = rng(77);
          const WARP = Array.from({ length: 220 }, () => ({ a: r0() * 6.2832, ph: r0(), sp: 0.7 + r0() * 0.9, w: 0.8 + r0() * 1.6, c: r0() < 0.22 ? 1 : r0() < 0.3 ? 2 : 0 }));
          const WCOL = ['255,255,255', '125,211,252', '244,114,182'];
          const LC = document.createElement('canvas');
          let LF = -1;

          function lines(o, f, close, dx, dy, col, alpha) {
            const r = rng(1000 + f * 7919);
            const path = new Path2D();
            for (let i = 0; i < 260; i++) {
              const a = r() * 6.2832;
              // Внутренний конец — неровный, как у рисованных линий; на удар линии подходят ближе
              const rin = (215 + r() * 330) * (1 - 0.32 * close);
              const half = 0.0018 + r() * r() * 0.02;
              path.moveTo(CX + dx + Math.cos(a) * rin * 1.32, CY + dy + Math.sin(a) * rin * 0.8);
              path.lineTo(CX + dx + Math.cos(a - half) * FAR, CY + dy + Math.sin(a - half) * FAR);
              path.lineTo(CX + dx + Math.cos(a + half) * FAR, CY + dy + Math.sin(a + half) * FAR);
              path.closePath();
            }
            // Одна заливка радиальным градиентом: у края линия яркая, к центру тает
            const gr = o.createRadialGradient(CX, CY, 170, CX, CY, 780);
            gr.addColorStop(0, `rgba(${col},0)`);
            gr.addColorStop(0.3, `rgba(${col},${alpha * 0.35})`);
            gr.addColorStop(1, `rgba(${col},${alpha})`);
            o.fillStyle = gr;
            o.fill(path);
          }
          function soft(x, y, r, c, a) {
            if (a <= 0) return;
            const gr = g.createRadialGradient(x, y, 0, x, y, r);
            gr.addColorStop(0, `rgba(${c},${a})`);
            gr.addColorStop(1, `rgba(${c},0)`);
            g.fillStyle = gr;
            g.fillRect(x - r, y - r, r * 2, r * 2);
          }

          loop((t) => {
            let since = 9;
            for (const h of HITS) if (t >= h) since = t - h;
            const kick = Math.exp(-since * 7);
            // Встряска камеры: резкий сдвиг на удар, гаснет за 0,2 с
            const sh = rng(Math.floor(t * 60) + 5);
            const jx = (sh() - 0.5) * 26 * kick, jy = (sh() - 0.5) * 18 * kick;
            g.translate(jx, jy);
            g.globalCompositeOperation = 'source-over';
            const bg = g.createRadialGradient(CX, CY, 0, CX, CY, 820);
            bg.addColorStop(0, '#3A1868');
            bg.addColorStop(0.35, '#170A2C');
            bg.addColorStop(1, '#040309');
            g.fillStyle = bg;
            g.fillRect(-40, -40, 1360, 800);
            g.globalCompositeOperation = 'lighter';
            // Сияние за словом — вспыхивает на удар
            soft(CX, CY, 620, '124,58,237', 0.22 + 0.35 * kick);
            soft(CX, CY, 300, '236,72,153', 0.16 + 0.45 * kick);
            // Звёзды-штрихи: из центра наружу с ускорением, на удар — длиннее и ярче
            const paths = WCOL.map(() => new Path2D());
            for (const p of WARP) {
              const z = (t * 0.85 * p.sp + p.ph) % 1;
              const d = 60 + Math.pow(z, 2.2) * 1000;
              const len = 6 + z * z * (90 + 260 * kick);
              const ca = Math.cos(p.a), sa = Math.sin(p.a);
              paths[p.c].moveTo(CX + ca * d * 1.3, CY + sa * d * 0.8);
              paths[p.c].lineTo(CX + ca * (d + len) * 1.3, CY + sa * (d + len) * 0.8);
            }
            g.lineCap = 'round';
            paths.forEach((path, i) => {
              g.strokeStyle = `rgba(${WCOL[i]},${0.55 + 0.4 * kick})`;
              g.lineWidth = 1.6;
              g.stroke(path);
            });
            // Линии концентрации: после удара — цветной раскол (голубой и розовый расходятся), потом одна белая.
            // Рисунок меняется 12 раз в секунду — между сменами кадр берётся готовым (рисовать клинья дорого)
            const f = Math.floor(t * 12);
            if (f !== LF || LC.width !== cv.width) {
              LF = f;
              LC.width = cv.width; LC.height = cv.height;
              const o = LC.getContext('2d');
              o.setTransform(SX(), 0, 0, SY(), 0, 0);
              o.globalCompositeOperation = 'lighter';
              const tf = f / 12;
              let sf = 9;
              for (const h of HITS) if (tf >= h) sf = tf - h;
              const close = Math.exp(-sf * 4);
              const split = 14 * Math.exp(-sf * 7);
              if (split > 0.5) {
                lines(o, f, close, -split, 0, '103,232,249', 0.55);
                lines(o, f, close, split, 0, '244,114,182', 0.55);
              }
              lines(o, f, close, 0, 0, '255,255,255', 0.5 + 0.35 * close);
            }
            g.setTransform(1, 0, 0, 1, jx * SX(), jy * SY());
            g.drawImage(LC, 0, 0);
            g.setTransform(SX(), 0, 0, SY(), jx * SX(), jy * SY());
            // Анаморфный блик через центр на удар
