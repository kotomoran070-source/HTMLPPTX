  - id: mark
    template: canvas
    label: Знак
    bg: "#030308"
    transition: none
    at: 1.343
    logo: false
    free:
      - type: embed
        code: |
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#05050A}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
          window.FORGE = true;
          // Общая обвязка сцен: холст во всю вставку, координаты слайда 1280×720, часы — с появления слайда
          // (performance.now во вставке считает от её создания, а вставка создаётся, когда слайд показан)
          const cv = document.getElementById('c');
          const g = cv.getContext('2d');
          let DPR = Math.min(2, (window.devicePixelRatio || 1) * 1.5);
          function fit() {
            cv.width = Math.round(cv.clientWidth * DPR);
            cv.height = Math.round(cv.clientHeight * DPR);
          }
          addEventListener('resize', fit);
          fit();
          const SX = () => cv.width / 1280;
          const SY = () => cv.height / 720;
          // Псевдослучайные числа с зерном: одинаковые кадр за кадром
          function rng(seed) {
            let s = seed >>> 0 || 1;
            return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
          }
          const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
          const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
          const easeOut = (u) => 1 - Math.pow(1 - u, 3);
          // Кадры идут медленнее 35 в секунду (слабая видеокарта или её нет) — холст в обычном разрешении:
          // иначе смена слайда ждёт отрисовки и опаздывает от удара
          function loop(draw) {
            const gaps = [];
            let last = 0;
            const step = (now) => {
              if (last && DPR > 1) {
                gaps.push(now - last);
                if (gaps.length > 8) {
                  gaps.shift();
                  if ([...gaps].sort((a, b) => a - b)[4] > 28) { DPR = 1; fit(); }
                }
              }
              last = now;
              g.setTransform(SX(), 0, 0, SY(), 0, 0);
              draw(performance.now() / 1000);
              requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
          }

          // Вступление: чёрная дыра из частиц в цветах Slideria. Диск вращается (ближе к центру — быстрее), дальняя
          // сторона диска изогнута светом над тенью, нижняя — под ней; левая сторона ярче — летит к зрителю.
          // На слайде знака (FORGE) — удар: вспышка, диск разлетается во все стороны и сходится в знак S
          const FORGE = typeof window.FORGE !== 'undefined' && window.FORGE;
          const CX = 640, CY = FORGE ? 300 : 352;
          const r0 = rng(20260501);
          const N = 2000;
          const RIN = 122, ROUT = 640, HOLE = 98, TILT = 0.085;
          // Камера чуть завалена — кадр живее, чем строго горизонтальный диск
          const ROLL = -0.09;
          // Цвет по радиусу: у тени — почти белый, дальше розовый, сиреневый, фиолетовый; редкие голубые искры
          const PAL = ['255,244,250', '251,207,232', '244,114,182', '192,132,252', '139,92,246', '109,40,217', '103,232,249'];
          const P = Array.from({ length: N }, () => {
            const r = RIN + (ROUT - RIN) * Math.pow(r0(), 1.7);
            const u = (r - RIN) / (ROUT - RIN);
            const c = r0() < 0.05 ? 6 : u < 0.05 ? 0 : u < 0.13 ? 1 : u < 0.28 ? 2 : u < 0.5 ? 3 : u < 0.75 ? 4 : 5;
            return { r, a: r0() * Math.PI * 2, c, w: 0.7 + r0() * (u < 0.3 ? 1.6 : 1.1), ph: r0() * 6.28, v: 250 + Math.pow(r0(), 0.6) * 1500, el: (r0() - 0.5) * 1.3 };
          });
          // Звёзды позади — свет у тени огибает её (сдвиг от центра, как у гравитационной линзы)
          const STARS = Array.from({ length: 280 }, () => ({ x: r0() * 1280, y: r0() * 720, s: 0.5 + r0() * 1.4, ph: r0() * 6.28, b: 0.25 + r0() * 0.6 }));

          const omega = (r) => 1.5 * Math.pow(RIN / r, 1.25);
          function at(p, t) {
            const a = p.a + t * omega(p.r);
            const r = p.r * (1 + 0.012 * Math.sin(t * 1.3 + p.ph));
            return [CX + Math.cos(a) * r, CY + Math.sin(a) * r * TILT, a];
          }
          // Изображение дальней стороны над тенью (верх) и нижней стороны под ней — по кругу, а не по эллипсу диска
          function lensed(p, t) {
            const a = (((p.a + t * omega(p.r)) % 6.2832) + 6.2832) % 6.2832;
            const rl = HOLE + 4 + (p.r - RIN) * 0.42;
            return [CX + Math.cos(a) * rl, CY + Math.sin(a) * rl * (a > Math.PI ? 1 : 0.8), a];
          }

          // Частицы рисуются пачками — одна линия на цвет, яркость и толщину: сотни вызовов вместо тысяч
          const B = new Map();
          function seg(c, a, w, x0, y0, x1, y1) {
            if (a <= 0.03) return;
            const q = Math.min(5, Math.max(1, Math.round(a * 5)));
            const k = c * 100 + q * 10 + (w > 1.35 ? 2 : 1);
            let path = B.get(k);
            if (!path) B.set(k, path = new Path2D());
            path.moveTo(x0, y0);
            path.lineTo(x1 + 0.01, y1);
          }
          function flush() {
            for (const [k, path] of B) {
              g.strokeStyle = `rgba(${PAL[Math.floor(k / 100)]},${(Math.floor(k / 10) % 10) / 5})`;
              g.lineWidth = k % 10 === 2 ? 1.9 : 1.1;
