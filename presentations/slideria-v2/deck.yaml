  - id: cinema
    template: canvas
    label: Показ — как кино.
    bg: "#06060B"
    transition: none
    at: 61.343
    steps:
      - 62.01
      - 62.677
      - 63.343
      - 64.01
    logo: false
    free:
      - type: embed
        code: |
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#05050A}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
          window.DOT = { x: 990, y: 459 };
          // Общая обвязка сцен: холст во всю вставку, координаты слайда 1280×720, часы — с появления слайда
          // (performance.now во вставке считает от её создания, а вставка создаётся, когда слайд показан)
          const cv = document.getElementById('c');
          const g = cv.getContext('2d');
          let DPR = Math.min(2, (window.devicePixelRatio || 1) * 1.5);
          function fit() {
            cv.width = Math.round(cv.clientWidth * DPR);
            cv.height = Math.round(cv.clientHeight * DPR);
          }
          addEventListener('resize', fit);
          fit();
          const SX = () => cv.width / 1280;
          const SY = () => cv.height / 720;
          // Псевдослучайные числа с зерном: одинаковые кадр за кадром
          function rng(seed) {
            let s = seed >>> 0 || 1;
            return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
          }
          const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
          const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
          const easeOut = (u) => 1 - Math.pow(1 - u, 3);
          // Кадры идут медленнее 35 в секунду (слабая видеокарта или её нет) — холст в обычном разрешении:
          // иначе смена слайда ждёт отрисовки и опаздывает от удара
          function loop(draw) {
            const gaps = [];
            let last = 0;
            const step = (now) => {
              if (last && DPR > 1) {
                gaps.push(now - last);
                if (gaps.length > 8) {
                  gaps.shift();
                  if ([...gaps].sort((a, b) => a - b)[4] > 28) { DPR = 1; fit(); }
                }
              }
              last = now;
              g.setTransform(SX(), 0, 0, SY(), 0, 0);
              draw(performance.now() / 1000);
              requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
          }

          // Финал: сверху бьёт луч проектора — лучи и пыль в воздухе, свет вздрагивает на каждое слово (0; 0,667; 1,333; 2,0 с).
          // Точка падает сверху и ставится ровно в 1:04.01 (2,667 с): сжимается о строку и пружинит, кадр вздрагивает
          // светом, сквозь точку — анаморфный блик и тонкие лучи-звезда, пыль рядом вспыхивает и отлетает.
          // Потом проектор гаснет с подрагиванием — остаются слова и светящаяся точка
          const D = window.DOT || { x: 990, y: 459 };
          const DR = 16;
          const WORDS = [0, 0.6667, 1.3333, 2.0];
          const HIT = 2.6667;
          const FALL = 0.26;
          const SRC = [640, -150];
          const FAN = 0.6;
          const r0 = rng(4242);
          // Рисунок лучей: сумма волн по углу — один и тот же для света и для пыли в нём
          const RAY = Array.from({ length: 5 }, () => [7 + r0() * 40, r0() * 6.28, 0.3 + r0() * 0.7]);
          function ray(th, t) {
            const e = clamp(1 - Math.abs(th) / FAN);
            let v = 0, n = 0;
            for (const [f, ph, w] of RAY) { v += w * (0.5 + 0.5 * Math.sin(th * f + ph + t * 0.25 * (f > 25 ? 1 : -1))); n += w; }
            return Math.min(1, e * 2.2) * (0.25 + 0.75 * Math.pow(v / n, 2.2));
          }
          // Лучи рисуются один раз в четверть размера: при растяжении на кадр они размываются сами, без фильтра
          // (размытие при запуске сцены задерживало бы саму смену слайда)
          function fan(t) {
            const c = document.createElement('canvas');
            c.width = 320; c.height = 180;
            const o = c.getContext('2d');
            o.scale(0.25, 0.25);
            const L = 1100, n = 150;
            for (let i = 0; i < n; i++) {
              const a0 = -FAN + (2 * FAN * i) / n, a1 = a0 + (2 * FAN) / n + 0.004;
              o.fillStyle = `rgba(214,204,254,${0.5 * ray(a0, t)})`;
              o.beginPath();
              o.moveTo(SRC[0], SRC[1]);
              o.lineTo(SRC[0] + Math.sin(a0) * L, SRC[1] + Math.cos(a0) * L);
              o.lineTo(SRC[0] + Math.sin(a1) * L, SRC[1] + Math.cos(a1) * L);
              o.closePath();
              o.fill();
            }
            // Свет слабеет к низу кадра — одной заливкой поверх всех лучей
            o.globalCompositeOperation = 'destination-in';
            const gr = o.createLinearGradient(0, SRC[1], 0, SRC[1] + L);
            gr.addColorStop(0, 'rgba(0,0,0,1)');
            gr.addColorStop(0.45, 'rgba(0,0,0,.45)');
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            o.fillStyle = gr;
            o.fillRect(0, 0, 1280, 720);
            return c;
          }
          // Два рисунка лучей, медленно перетекают друг в друга — свет «живёт»
          const FA = fan(0), FB = fan(9);
          const DUST = Array.from({ length: 300 }, () => ({ x: r0() * 1280, y: r0() * 720, s: 0.7 + r0() * 1.9, vx: (r0() - 0.5) * 10, vy: -3 - r0() * 9, ph: r0() * 6.28 }));
          const SPK = [0.785, 2.356, 3.927, 5.498];

          function soft(x, y, r, c, a) {
            if (a <= 0.003) return;
            const gr = g.createRadialGradient(x, y, 0, x, y, r);
            gr.addColorStop(0, `rgba(${c},${Math.min(1, a)})`);
            gr.addColorStop(1, `rgba(${c},0)`);
            g.fillStyle = gr;
            g.fillRect(x - r, y - r, r * 2, r * 2);
          }
          // Тонкий луч-игла из центра точки: от белого к прозрачному
          function spike(x, y, ang, len, w, a) {
            if (a <= 0.01) return;
            const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
            const nx = -Math.sin(ang) * w, ny = Math.cos(ang) * w;
            const gr = g.createLinearGradient(x, y, ex, ey);
            gr.addColorStop(0, `rgba(255,255,255,${a})`);
            gr.addColorStop(0.35, `rgba(233,213,255,${a * 0.45})`);
            gr.addColorStop(1, 'rgba(216,180,254,0)');
            g.fillStyle = gr;
            g.beginPath();
            g.moveTo(x + nx, y + ny);
            g.lineTo(ex, ey);
            g.lineTo(x - nx, y - ny);
            g.closePath();
            g.fill();
          }

          loop((t) => {
            const s = t - HIT;
            g.globalCompositeOperation = 'source-over';
            const bg = g.createRadialGradient(640, 360, 0, 640, 360, 820);
            bg.addColorStop(0, '#15102A');
            bg.addColorStop(1, '#05050A');
            g.fillStyle = bg;
            g.fillRect(0, 0, 1280, 720);
            g.globalCompositeOperation = 'lighter';
            // Проектор: мерцание 24 раза в секунду, вздрагивает на слово; после точки гаснет с подрагиванием
            const flick = 0.9 + rng(Math.floor(t * 24) * 31 + 5)() * 0.1;
            let kick = 0;
            for (const w of WORDS) if (t >= w) kick = Math.max(kick, Math.exp(-(t - w) * 5));
            let off = 1;
            if (s > 0.9) {
              const q = (s - 0.9) / 1.1;
              off = q >= 1 ? 0 : (1 - q) * (q > 0.25 && q < 0.33 ? 0.35 : q > 0.5 && q < 0.55 ? 0.5 : 1);
            }
            const beam = (0.55 + 0.45 * kick) * flick * off;
            const mix = 0.5 + 0.5 * Math.sin(t * 0.8);
            g.globalAlpha = beam * (1 - mix);
            g.drawImage(FA, 0, 0, 1280, 720);
            g.globalAlpha = beam * mix;
            g.drawImage(FB, 0, 0, 1280, 720);
            g.globalAlpha = 1;
            // Источник света над кадром — его край виден у верхней кромки
            soft(SRC[0], 0, 260, '221,214,254', 0.32 * beam);
            // Удар точки: короткая вспышка всего кадра
            if (s >= 0) {
              g.fillStyle = `rgba(196,181,253,${0.2 * Math.exp(-s * 10)})`;
              g.fillRect(0, 0, 1280, 720);
            }
            // Пыль: светится там, где луч; после удара — у точки вспыхивает и отлетает от неё
            const push = s > 0 ? 1 - Math.exp(-s * 6) : 0;
            const dl = s > 0 ? 0.35 + 0.65 * Math.exp(-s * 1.8) : 0;
            const dp = new Path2D(), dh = new Path2D();
            for (const p of DUST) {
              let x = (((p.x + p.vx * t) % 1280) + 1280) % 1280, y = (((p.y + p.vy * t) % 720) + 720) % 720;
              const ex = x - D.x, ey = y - D.y, dd = Math.hypot(ex, ey) || 1;
              if (push) { const m = 80 * Math.exp(-dd / 220) * push; x += (ex / dd) * m; y += (ey / dd) * m; }
              const th = Math.atan2(x - SRC[0], y - SRC[1]);
              const lit = ray(th, t) * (0.25 + 0.75 * clamp(1 - y / 900)) * beam + dl * Math.exp(-dd / 170);
              const tw = 0.6 + 0.4 * Math.sin(t * 2 + p.ph);
              const v = lit * tw;
              if (v < 0.08) continue;
              (v > 0.45 ? dh : dp).rect(x, y, p.s, p.s);
            }
            g.fillStyle = 'rgba(255,255,255,.4)';
            g.fill(dp);
            g.fillStyle = 'rgba(255,255,255,.95)';
            g.fill(dh);
            // Падение точки: ускоряется, за ней — светящийся след
            if (s < 0 && s > -FALL) {
              const u = 1 - -s / FALL;
              const y = -40 + (D.y + 40) * u * u;
              const tail = Math.min(y + 40, 60 + 380 * u);
              const gr = g.createLinearGradient(D.x, y - tail, D.x, y);
              gr.addColorStop(0, 'rgba(216,180,254,0)');
              gr.addColorStop(1, 'rgba(255,255,255,.85)');
              g.fillStyle = gr;
              g.beginPath();
              g.moveTo(D.x - 1, y - tail);
              g.lineTo(D.x + 1, y - tail);
              g.lineTo(D.x + DR * 0.8, y);
              g.lineTo(D.x - DR * 0.8, y);
              g.closePath();
              g.fill();
              soft(D.x, y, 70, '236,72,153', 0.45);
              g.fillStyle = '#FFFFFF';
              g.beginPath(); g.ellipse(D.x, y, DR * 0.82, DR * 1.25, 0, 0, 7); g.fill();
              return;
            }
            if (s < 0) return;
            // ── Точка поставлена ──
            const fade = Math.exp(-s * 2.2);
            const rest = 0.16 + 0.05 * Math.sin(s * 2.4);
            soft(D.x, D.y, 460, '124,58,237', 0.4 * fade + 0.1 + rest * 0.3);
            soft(D.x, D.y, 170, '236,72,153', 0.6 * fade + 0.16 + rest * 0.5);
            soft(D.x, D.y, 56, '255,255,255', 0.8 * fade + rest);
            // Анаморфный блик: раскрывается за 0,12 с, тает до тонкой нити
            const open = easeOut(clamp(s / 0.12));
            g.save();
            g.translate(D.x, D.y);
            g.scale(1, 0.011);
            soft(0, 0, 1250 * (0.35 + 0.65 * open), '125,211,252', 0.8 * fade + 0.12);
            g.restore();
            g.save();
            g.translate(D.x, D.y);
            g.scale(1, 0.0035);
            soft(0, 0, 820 * (0.35 + 0.65 * open), '255,255,255', 0.95 * fade + 0.15);
            g.restore();
            // Звезда: четыре тонкие иглы по диагоналям, медленно поворачиваются
            const rot = s * 0.12;
            for (const a of SPK) spike(D.x, D.y, a + rot, (70 + 110 * open) * (0.55 + 0.45 * fade), 1.6, 0.85 * fade + 0.12);
            // Сама точка: сжимается о строку и пружинит (низ остаётся на строке); потом её закрывает настоящая точка шрифта
            const k = Math.exp(-s * 16) * Math.cos(s * 38);
            const rx = DR * (1 + 0.42 * k), ry = DR * (1 - 0.36 * k);
            g.globalCompositeOperation = 'source-over';
            g.fillStyle = '#FFFFFF';
            g.beginPath(); g.ellipse(D.x, D.y + DR - ry, rx, ry, 0, 0, 7); g.fill();
          });
          </script></body></html>
