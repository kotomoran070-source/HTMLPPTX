              g.lineWidth = 2.8;
              g.lineCap = 'butt';
              const lg = g.createLinearGradient(0, 0, 24, 24);
              lg.addColorStop(0, '#C4B5FD');
              lg.addColorStop(0.5, '#FFFFFF');
              lg.addColorStop(1, '#F9A8D4');
              g.globalAlpha = m;
              g.shadowColor = 'rgba(236,72,153,.9)';
              g.shadowBlur = 40 * SX();
              g.strokeStyle = lg;
              g.stroke(S1);
              g.fillStyle = '#fff';
              g.beginPath(); g.arc(20.5, 3.5, 1.4, 0, 7); g.fill();
              // Второй штрих — полупрозрачный целиком, как в знаке (группа .55): точка на конце — скруглённый конец того же
              // штриха, а не отдельный круг поверх (иначе на конце двойная плотность — серый «колпачок»)
              g.globalAlpha = m * 0.55;
              g.lineCap = 'round';
              g.stroke(S2);
              g.lineCap = 'butt';
