                  const [lx, ly, la] = lensed(p, t);
                  const [lx0, ly0, la0] = lensed(p, t - BLUR);
                  if (Math.abs(la - la0) < 1) seg(p.c, (la > Math.PI ? 0.95 : 0.4) * dop * (1 - (p.r - RIN) / 290), p.w * 0.9, lx0, ly0, lx, ly);
                }
              }
              flush();
              // Тень: чёрный круг с мягким краем, перекрывает всё за ним
              g.globalCompositeOperation = 'source-over';
              const sg = g.createRadialGradient(CX, CY, HOLE - 4, CX, CY, HOLE + 5);
              sg.addColorStop(0, 'rgba(0,0,0,1)');
              sg.addColorStop(1, 'rgba(0,0,0,0)');
              g.fillStyle = sg;
              g.beginPath(); g.arc(CX, CY, HOLE + 5, 0, 7); g.fill();
              g.globalCompositeOperation = 'lighter';
              g.drawImage(FRONT, 0, 0, 1280, 720);
              // Ближняя половина диска — поверх тени
              for (const p of P) {
                const [x, y, a] = at(p, t);
                if (Math.sin(a) < 0) continue;
                const [x0, y0] = at(p, t - BLUR);
                const dop = Math.max(0.35, 1 - 0.65 * Math.cos(a));
                seg(p.c, 0.85 * dop, p.w, x0, y0, x, y);
              }
              flush();
              // Тонкий анаморфный блик по плоскости диска
              g.save();
              g.translate(CX - 120, CY);
              g.scale(1, 0.006);
              glow(0, 0, 900, '165,243,252', 0.35);
              g.restore();
              g.restore();
              return;
            }

            // ── Знак: удар в 0 с — вспышка, диск разлетается сферой, к 0,8 с частицы сходятся в S ──
            const flash = Math.max(0, 1 - t / 0.32);
            sky(t, 0);
            glow(CX, CY, 340, '255,255,255', 0.85 * flash * flash);
            glow(CX, CY, 560, '168,85,247', 0.12 + 0.4 * flash);
            const u = clamp((t - 0.14) / 0.62);
            for (let i = 0; i < N; i++) {
              const p = P[i];
              const [x, y] = pos(i, t);
              const [x0, y0] = pos(i, t - 0.035);
              const a = (u < 1 ? 0.95 : 0.7 * Math.max(0.15, 1 - (t - 0.76) / 0.6)) + 0.4 * flash;
              seg(u > 0.85 ? 0 : p.c, a, p.w * (1 + (1 - ease(u)) * 0.5), x0, y0, x, y);
            }
            flush();
            // Знак проявляется из частиц: градиентный штрих со свечением, по нему проходит блик
            const m = clamp((t - 0.7) / 0.35);
            if (m > 0) {
              g.globalCompositeOperation = 'source-over';
              g.save();
              g.translate(CX - 145, CY - 145);
              g.scale(290 / 24, 290 / 24);
              g.lineWidth = 2.8;
              g.lineCap = 'butt';
              const lg = g.createLinearGradient(0, 0, 24, 24);
              lg.addColorStop(0, '#C4B5FD');
              lg.addColorStop(0.5, '#FFFFFF');
              lg.addColorStop(1, '#F9A8D4');
              g.globalAlpha = m;
              g.shadowColor = 'rgba(236,72,153,.9)';
              g.shadowBlur = 40 * SX();
              g.strokeStyle = lg;
              g.stroke(S1);
              g.globalAlpha = m * 0.6;
              g.stroke(S2);
              g.globalAlpha = m;
              g.fillStyle = '#fff';
              g.beginPath(); g.arc(20.5, 3.5, 1.4, 0, 7); g.fill();
              g.globalAlpha = m * 0.6;
              g.beginPath(); g.arc(3.5, 20.5, 1.4, 0, 7); g.fill();
              // Блик бежит по штриху
              const sw = clamp((t - 0.95) / 0.5);
              if (sw > 0 && sw < 1) {
                g.globalCompositeOperation = 'lighter';
                g.shadowBlur = 0;
                const bx = -6 + sw * 36;
                const sgr = g.createLinearGradient(bx - 4, 0, bx + 4, 24);
                sgr.addColorStop(0, 'rgba(255,255,255,0)');
                sgr.addColorStop(0.5, 'rgba(255,255,255,.95)');
                sgr.addColorStop(1, 'rgba(255,255,255,0)');
                g.globalAlpha = 1;
                g.strokeStyle = sgr;
                g.lineWidth = 3.2;
                g.stroke(S1);
                g.stroke(S2);
              }
              g.restore();
            }
          });

          // Знак S: два полукольца с точками на концах (как в логотипе), ширина — 290 px
          const S1 = new Path2D('M20.5 3.5H8.25a4.25 4.25 0 0 0 0 8.5');
          const S2 = new Path2D('M8.25 12h7.5a4.25 4.25 0 0 1 0 8.5H3.5');
          // Цели частиц — точки знака; частица идёт к точке в своём же направлении от центра, поэтому пути не перекрещиваются
          const TG = new Array(N);
          if (FORGE) {
            const off = document.createElement('canvas');
            off.width = off.height = 290;
            const o = off.getContext('2d');
            o.scale(290 / 24, 290 / 24);
            o.lineWidth = 2.8;
            o.strokeStyle = '#fff';
            o.fillStyle = '#fff';
            o.stroke(S1);
            o.stroke(S2);
            o.beginPath(); o.arc(20.5, 3.5, 1.4, 0, 7); o.fill();
            o.beginPath(); o.arc(3.5, 20.5, 1.4, 0, 7); o.fill();
            const d = o.getImageData(0, 0, 290, 290).data;
            const T = [];
            for (let y = 0; y < 290; y += 3) for (let x = 0; x < 290; x += 3) if (d[(y * 290 + x) * 4 + 3] > 128) T.push([CX - 145 + x, CY - 145 + y]);
            T.sort((p, q) => Math.atan2(p[1] - CY, p[0] - CX) - Math.atan2(q[1] - CY, q[0] - CX));
            const idx = P.map((_, i) => i).sort((i, j) => dir(i) - dir(j));
            idx.forEach((i, k) => { TG[i] = T[Math.floor((k * T.length) / N)]; });
          }
          // Направление разлёта — угол частицы на диске в момент удара
          function dir(i) {
            const a = P[i].a + 3 * omega(P[i].r);
            return Math.atan2(Math.sin(a), Math.cos(a));
          }
          function pos(i, tt) {
            const p = P[i];
            const [xa, ya, a] = at(p, 3);
            const cr = Math.cos(ROLL), sr = Math.sin(ROLL);
            const x0 = CX + (xa - CX) * cr - (ya - CY) * sr, y0 = CY + (xa - CX) * sr + (ya - CY) * cr;
            const k = 4.2;
            const b = ((1 - Math.exp(-k * Math.max(0, tt))) / k) * p.v;
            // Разлёт объёмом, а не кольцом: у каждой частицы своя скорость и наклон вверх-вниз
            const bx = x0 + Math.cos(a) * b, by = y0 + (Math.sin(a) * 0.55 + p.el) * b;
            const tg = TG[i];
            const e = ease(clamp((tt - 0.14) / 0.62));
            const px = bx + (tg[0] - bx) * e, py = by + (tg[1] - by) * e;
            // Второй удар (0,333 с): короткий толчок от центра
            const h = tt > 0.333 ? Math.exp(-(tt - 0.333) * 9) * Math.min(1, (tt - 0.333) / 0.04) : 0;
            const qx = px - CX, qy = py - CY, ql = Math.hypot(qx, qy) || 1;
            return [px + (qx / ql) * 22 * h, py + (qy / ql) * 22 * h];
          }
          </script></body></html>
