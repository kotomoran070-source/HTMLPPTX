          }
          // Ближняя сторона диска поверх тени — сплошной светящейся полосой, частицы дают ей фактуру
          const FRONT = document.createElement('canvas');
          FRONT.width = 640; FRONT.height = 360;
          if (!FORGE) {
            const o = FRONT.getContext('2d');
            o.scale(0.5, 0.5);
            o.globalCompositeOperation = 'lighter';
            for (const [rad, lw, c, bl] of [[140, 16, '255,236,248,.55', 6], [230, 34, '244,114,182,.35', 12], [380, 60, '167,139,250,.22', 20]]) {
              o.filter = `blur(${bl}px)`;
              o.strokeStyle = `rgba(${c})`;
              o.lineWidth = lw;
              o.beginPath(); o.ellipse(CX, CY, rad, rad * TILT, 0, 0.05, Math.PI - 0.05); o.stroke();
            }
          }
          function sky(t, k) {
            g.globalCompositeOperation = 'source-over';
            const bg = g.createRadialGradient(CX, CY, 0, CX, CY, 900);
            bg.addColorStop(0, '#1A0F33');
            bg.addColorStop(0.4, '#0A0716');
            bg.addColorStop(1, '#020205');
            g.fillStyle = bg;
            g.fillRect(0, 0, 1280, 720);
