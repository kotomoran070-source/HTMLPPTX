  @keyframes v17-glow { from { opacity: 0; } to { opacity: .55; } }
  @keyframes v17-drift { to { transform: translate(40px, -30px) scale(1.12); } }
  .v17-win { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 800px 500px; }
  .v17-win img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; }
  /* Обводка и свечение окна — отдельным слоем: проявляется прозрачностью, тень не перерисовывается */
  .v17-win::before { content: ''; position: absolute; inset: 0; border-radius: 26px; opacity: 0;
    box-shadow: 0 0 0 2px rgba(196, 181, 253, .7), 0 0 90px 12px rgba(124, 58, 237, .55), 0 0 200px 50px rgba(236, 72, 153, .28); }
  .v17-win .sh { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; opacity: 0;
    background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .16) 47%, rgba(196, 181, 253, .22) 50%, transparent 60%); background-size: 250% 100%; }
  .slide.on .v17-win { animation: v17-pull 2s linear both; }
  .slide.on .v17-win::before { animation: v17-edge .6s ease-out .55s both; }
  .slide.on .v17-win .sh { animation: v17-sheen 1.1s cubic-bezier(.3, .6, .2, 1) 1.45s both; }
  @keyframes v17-edge { from { opacity: 0; } to { opacity: 1; } }
  @keyframes v17-sheen { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 1; background-position: -60% 0; } }
