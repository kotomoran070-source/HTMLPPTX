<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * Слово из частиц: частицы слетаются в буквы, разбегаются от курсора и возвращаются,
 * щелчок — взрыв и новая сборка. Цвета — акцент и второй цвет темы (--ac, --ac2),
 * фон прозрачный: под сценой виден фон слайда.
 */
(() => {
  const WORD = 'Спасибо';
  const W = 1280, H = 720;
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const v = (n, d) => (css.getPropertyValue(n).trim() || d);
  const ac = v('--ac', '#6366F1'), ac2 = v('--ac2', '#EC4899'), bg = v('--bg', '#F8FAFC');
  const font = v('--font', 'system-ui, sans-serif');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Цвет CSS → [r, g, b] через холст (понимает и hex, и rgb, и color-mix не нужен)
  const rgbOf = (c) => { const t = document.createElement('canvas').getContext('2d'); t.fillStyle = c; const h = t.fillStyle; if (h[0] === '#') return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); return (h.match(/[\d.]+/g) || [0, 0, 0]).slice(0, 3).map(Number); };
  const A = rgbOf(ac), B = rgbOf(ac2), BG = rgbOf(bg);
  const dark = 0.299 * BG[0] + 0.587 * BG[1] + 0.114 * BG[2] < 110;
  const mix = (t) => A.map((a, i) => Math.round(a + (B[i] - a) * t));

  let scale = 1, dpr = 1;
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    scale = Math.min(innerWidth / W, innerHeight / H) || 1;
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
  }
  resize();
  addEventListener('resize', resize);

  // Точки букв: слово рисуется на скрытом холсте, берём непрозрачные пиксели с шагом
  function targets() {
    const o = document.createElement('canvas');
    o.width = W; o.height = H;
    const x = o.getContext('2d');
    let size = 230;
    x.font = `900 ${size}px ${font}`;
    while (x.measureText(WORD).width > W * 0.84 && size > 60) { size -= 6; x.font = `900 ${size}px ${font}`; }
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = '#000';
    x.fillText(WORD, W / 2, H * 0.43);
    const d = x.getImageData(0, 0, W, H).data;
    const pts = [];
    const step = 5;
    for (let y = 0; y < H; y += step) for (let xx = 0; xx < W; xx += step) {
      if (d[(y * W + xx) * 4 + 3] > 140) pts.push([xx + (Math.random() - 0.5) * 2, y + (Math.random() - 0.5) * 2]);
    }
    return pts;
  }

  const pts = targets();
  const minX = Math.min(...pts.map((p) => p[0])), maxX = Math.max(...pts.map((p) => p[0]));
  const P = pts.map(([tx, ty]) => {
    const a = Math.random() * Math.PI * 2, r = 500 + Math.random() * 500;
    return {
      tx, ty,
      x: reduce ? tx : W / 2 + Math.cos(a) * r, y: reduce ? ty : H / 2 + Math.sin(a) * r,
      vx: 0, vy: 0,
      s: 1.3 + Math.random() * 1.5,
      c: mix((tx - minX) / Math.max(1, maxX - minX)),
      k: 0.035 + Math.random() * 0.03,
    };
  });
  // Звёздная пыль вокруг: медленно дрейфует
  const D = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.4 + 0.3, v: Math.random() * 0.25 + 0.05, c: mix(Math.random()), p: Math.random() * 6.28 }));

  const mouse = { x: -9999, y: -9999, on: false };
  const toScene = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * (innerWidth / scale) - (innerWidth / scale - W) / 2, ((e.clientY - r.top) / r.height) * (innerHeight / scale) - (innerHeight / scale - H) / 2]; };
  addEventListener('pointermove', (e) => { [mouse.x, mouse.y] = toScene(e); mouse.on = true; });
  addEventListener('pointerleave', () => { mouse.on = false; mouse.x = mouse.y = -9999; });
  // Щелчок — взрыв от точки щелчка, потом частицы собираются снова
  addEventListener('pointerdown', (e) => {
    const [cx, cy] = toScene(e);
    for (const p of P) {
      const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
      const f = 26 + Math.random() * 30;
      p.vx += (dx / d) * f; p.vy += (dy / d) * f;
    }
  });

  let t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (innerWidth - W * scale) / 2, dpr * (innerHeight - H * scale) / 2);
    g.clearRect(-W, -H, W * 3, H * 3);
    g.globalCompositeOperation = dark ? 'lighter' : 'source-over';

    for (const d of D) {
      d.y -= d.v; d.x += Math.sin(t * 0.4 + d.p) * 0.15;
      if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
      g.globalAlpha = 0.25 + 0.25 * Math.sin(t * 1.3 + d.p);
      g.fillStyle = `rgb(${d.c})`;
      g.fillRect(d.x, d.y, d.s, d.s);
    }

    // Волна света раз в несколько секунд проходит по слову слева направо
    const wave = ((t % 5.5) / 5.5) * (W + 400) - 200;
    for (const p of P) {
      if (!reduce) {
        // Пружина к своему месту в букве
        p.vx += (p.tx - p.x) * p.k; p.vy += (p.ty - p.y) * p.k;
        // Курсор расталкивает частицы
        if (mouse.on) {
          const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
          if (d2 < 110 * 110) { const d = Math.sqrt(d2) || 1, f = (1 - d / 110) * 9; p.vx += (dx / d) * f; p.vy += (dy / d) * f; }
        }
        p.vx *= 0.82; p.vy *= 0.82;
        p.x += p.vx; p.y += p.vy;
      }
      const near = Math.max(0, 1 - Math.abs(p.tx - wave) / 120);
      const sp = Math.min(1, Math.hypot(p.vx, p.vy) / 12);
      const s = p.s * (1 + near * 0.9 + sp * 0.6);
      g.globalAlpha = 0.72 + near * 0.28;
      g.fillStyle = near > 0.05 ? `rgb(${p.c.map((c) => Math.round(c + (255 - c) * near * (dark ? 0.55 : 0.25)))})` : `rgb(${p.c})`;
      g.beginPath(); g.arc(p.x, p.y, s, 0, 6.2832); g.fill();
    }
    g.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
