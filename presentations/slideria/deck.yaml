# Витрина Slideria: всё, что умеет движок, на тринадцати слайдах.
# Каждый слайд собран из настоящих блоков — его можно открыть в студии и поправить.

title: Slideria — презентации, которые живут
lang: ru
brand:
  name: Slideria
  logo: ./assets/logo.svg
theme:
  accent: "#6366F1"
  accent2: "#EC4899"
  accentFlow: true

# Стили вёрстки для композиций на холстах (орбиты на первом слайде)
css: |
  @keyframes sr-spin { to { transform: rotate(360deg); } }
  @keyframes sr-float { 50% { transform: translateY(-12px); } }
  @keyframes sr-pulse { 50% { opacity: .55; transform: scale(1.1); } }
  .sr-orb { position: relative; width: 600px; height: 600px; }
  .sr-glow { position: absolute; inset: 110px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--ac) 42%, transparent), color-mix(in srgb, var(--ac2) 18%, transparent) 45%, transparent 70%); filter: blur(18px); animation: sr-pulse 5s ease-in-out infinite; }
  .sr-ring { position: absolute; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--ac) 38%, transparent); animation: sr-spin linear infinite; }
  .sr-ring.r1 { inset: 175px; animation-duration: 12s; }
  .sr-ring.r2 { inset: 100px; animation-duration: 22s; animation-direction: reverse; border-style: dashed; }
  .sr-ring.r3 { inset: 22px; animation-duration: 36s; border-color: color-mix(in srgb, var(--ac2) 32%, transparent); }
  .sr-ring i { position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 18px var(--ac); }
  .sr-ring i.b { top: auto; bottom: -6px; width: 12px; height: 12px; margin-left: -6px; background: var(--ac2); box-shadow: 0 0 18px var(--ac2); }
  .sr-core { position: absolute; left: 234px; top: 234px; width: 132px; height: 132px; border-radius: 36px; background: var(--ac-g); display: grid; place-items: center; color: #fff; box-shadow: 0 26px 60px -14px color-mix(in srgb, var(--ac) 70%, transparent); animation: sr-float 6s ease-in-out infinite; }
  .sr-core svg { width: 84px; height: 84px; }
  .sr-chip { position: absolute; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px; background: color-mix(in srgb, var(--surf) 86%, transparent); border: 1px solid var(--bd); box-shadow: 0 14px 34px -12px rgba(15, 23, 42, .28); font: 700 15px/1 var(--font); color: var(--tx); backdrop-filter: blur(8px); animation: sr-float 7s ease-in-out infinite; }
  .sr-chip b { width: 8px; height: 8px; border-radius: 50%; background: var(--ac-g); }
  .sr-chip.c1 { left: 36px; top: 118px; }
  .sr-chip.c2 { right: 14px; top: 196px; animation-delay: -2.2s; }
  .sr-chip.c3 { left: 64px; bottom: 116px; animation-delay: -4.1s; }
  .sr-chip.c4 { right: 58px; bottom: 64px; animation-delay: -1.3s; }

  /* Слайд «Всё связано»: три стеклянных слоя в изометрии, по лучам вверх бегут импульсы */
  @keyframes sr-sway { 0%, 100% { transform: rotateX(60deg) rotateZ(-38deg); } 50% { transform: rotateX(57deg) rotateZ(-50deg); } }
  @keyframes sr-rise { 0% { transform: translateZ(0); opacity: 0; } 12%, 80% { opacity: 1; } 100% { transform: translateZ(var(--h)); opacity: 0; } }
  @keyframes sr-hop { 0%, 60%, 100% { transform: translateZ(0); } 30% { transform: translateZ(16px); } }
  @keyframes sr-beat { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ac) 50%, transparent), 0 0 40px color-mix(in srgb, var(--ac) 50%, transparent); } 50% { box-shadow: 0 0 0 18px color-mix(in srgb, var(--ac) 0%, transparent), 0 0 70px color-mix(in srgb, var(--ac2) 60%, transparent); } }
  .sr-iso { width: 640px; height: 660px; perspective: 1700px; display: grid; place-items: center; }
  .sr-stage { position: relative; width: 230px; height: 230px; margin-top: 390px; transform-style: preserve-3d; animation: sr-sway 16s ease-in-out infinite; }
  .sr-plate { position: absolute; inset: 0; transform: translateZ(var(--z)); transform-style: preserve-3d; border-radius: 26px;
    border: 1.5px solid color-mix(in srgb, var(--ac) 50%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--surf) 90%, transparent), color-mix(in srgb, var(--acs) 80%, transparent)),
      repeating-linear-gradient(0deg, transparent 0 32px, color-mix(in srgb, var(--ac) 11%, transparent) 32px 33px),
      repeating-linear-gradient(90deg, transparent 0 32px, color-mix(in srgb, var(--ac) 11%, transparent) 32px 33px);
    box-shadow: 0 50px 90px -40px color-mix(in srgb, var(--ac) 60%, transparent), inset 0 0 0 1px color-mix(in srgb, #fff 30%, transparent); }
  .sr-plate > span { position: absolute; left: 18px; bottom: 12px; font: 800 20px/1 var(--font); letter-spacing: -.01em; color: var(--tx); }
  .sr-plate > small { position: absolute; left: 19px; bottom: 36px; font: 700 12px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--ach); }
  .sr-code { position: absolute; left: 20px; top: 20px; right: 20px; display: grid; gap: 10px; }
  .sr-code i { display: block; height: 9px; border-radius: 5px; background: color-mix(in srgb, var(--mu) 40%, transparent); }
  .sr-code i:nth-child(3n+1) { background: color-mix(in srgb, var(--ac) 55%, transparent); }
  .sr-code i:nth-child(1) { width: 62%; } .sr-code i:nth-child(2) { width: 84%; margin-left: 12%; } .sr-code i:nth-child(3) { width: 48%; margin-left: 12%; }
  .sr-code i:nth-child(4) { width: 70%; margin-left: 24%; } .sr-code i:nth-child(5) { width: 38%; margin-left: 12%; } .sr-code i:nth-child(6) { width: 56%; }
  .sr-chipset { position: absolute; left: 126px; top: 24px; width: 82px; height: 82px; border-radius: 26px; background: var(--ac-g); animation: sr-beat 2.6s ease-in-out infinite;
    background-image: repeating-linear-gradient(0deg, transparent 0 19px, rgba(255,255,255,.22) 19px 20px), repeating-linear-gradient(90deg, transparent 0 19px, rgba(255,255,255,.22) 19px 20px), linear-gradient(135deg, var(--ac), var(--ac2)); }
  .sr-tiles { position: absolute; left: 18px; top: 18px; right: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; transform-style: preserve-3d; }
  .sr-tiles i { height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--surf) 90%, transparent); border: 1px solid color-mix(in srgb, var(--ac) 35%, transparent);
    box-shadow: 0 10px 20px -10px color-mix(in srgb, var(--ac) 60%, transparent); animation: sr-hop 3.6s ease-in-out infinite; position: relative; overflow: hidden; }
  .sr-tiles i::before { content: ""; position: absolute; left: 10px; top: 12px; width: 44%; height: 7px; border-radius: 4px; background: var(--ac-g); }
  .sr-tiles i::after { content: ""; position: absolute; left: 10px; top: 27px; right: 10px; bottom: 10px; border-radius: 6px; background: color-mix(in srgb, var(--ac) 14%, transparent); }
  .sr-tiles i:nth-child(2) { animation-delay: .3s; } .sr-tiles i:nth-child(3) { animation-delay: .6s; } .sr-tiles i:nth-child(4) { animation-delay: .9s; } .sr-tiles i:nth-child(5) { animation-delay: 1.2s; } .sr-tiles i:nth-child(6) { animation-delay: 1.5s; }
  .sr-dot { position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; transform: translateZ(var(--z)); background: color-mix(in srgb, var(--ac) 60%, var(--ac2)); opacity: .55; }
  .sr-pulse { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; --h: 380px; background: #fff; box-shadow: 0 0 12px 4px var(--ac), 0 0 26px 8px color-mix(in srgb, var(--ac2) 60%, transparent); animation: sr-rise 2.4s linear infinite; }

  /* Слайд «Живой пульт»: экран, волны и спектр перекрашиваются плавно — оттенок --hue интерполируется */
  @property --hue { syntax: "<number>"; inherits: true; initial-value: 255; }
  @keyframes pk-scan { to { transform: translateX(952px); } }
  .slide.static .pk-scan { display: none; }
  @keyframes pk-eq { to { transform: scaleY(.8); } }
  .pk-scr, .pk-wave, .pk-spec, .pk-code { transition: --hue .4s ease; }
  .pk-scr { position: relative; height: 100%; overflow: hidden; border-radius: 22px; background: radial-gradient(120% 95% at 50% 0%, hsl(var(--hue) 65% 22%), hsl(var(--hue) 45% 8%) 72%);
    box-shadow: 0 34px 70px -30px hsl(var(--hue) 80% 40% / .6), inset 0 0 0 1px hsl(var(--hue) 80% 72% / .18); }
  .pk-grid { position: absolute; inset: 0; background-image: linear-gradient(hsl(var(--hue) 80% 85% / .07) 1px, transparent 1px), linear-gradient(90deg, hsl(var(--hue) 80% 85% / .07) 1px, transparent 1px); background-size: 39px 37.25px; background-position: 16px 16px; }
  .pk-scan { position: absolute; top: 0; bottom: 0; left: -140px; width: 140px; background: linear-gradient(90deg, transparent, hsl(var(--hue) 95% 70% / .14)); animation: pk-scan 4s linear infinite; }
  .pk-wave { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 10px hsl(var(--hue) 95% 62% / .55)); }
  .pk-s1 { stop-color: hsl(var(--hue) 95% 62%); stop-opacity: .4; }
  .pk-s2 { stop-color: hsl(var(--hue) 95% 62%); stop-opacity: 0; }
  .pk-line { fill: none; stroke: hsl(var(--hue) 95% 68%); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .pk-line2 { fill: none; stroke: hsl(calc(var(--hue) + 55) 95% 74%); stroke-width: 2; stroke-linecap: round; opacity: .75; }
  .pk-axis { stroke: hsl(var(--hue) 80% 85% / .2); stroke-dasharray: 4 6; }
  .pk-spec { position: relative; height: 100%; box-sizing: border-box; padding: 30px 8px 30px; }
  .pk-bars { height: 100%; display: flex; align-items: flex-end; gap: 6px; }
  .pk-bars i { flex: 1; border-radius: 6px 6px 3px 3px; transform-origin: bottom; transition: height .35s var(--ease);
    background: linear-gradient(hsl(calc(var(--hue) + var(--i) * 4) 95% 70%), hsl(calc(var(--hue) + var(--i) * 4 + 40) 85% 42%));
    box-shadow: 0 0 16px hsl(calc(var(--hue) + var(--i) * 4) 95% 60% / .4); animation: pk-eq var(--sp, 1.4s) ease-in-out infinite alternate; animation-delay: calc(var(--i) * -110ms); }
  .pk-mk { position: absolute; top: 2px; transform: translateX(-50%); padding: 4px 9px; border-radius: 99px; font: 700 12px/1 var(--font); color: hsl(var(--hue) 90% 88%); background: hsl(var(--hue) 70% 32% / .7); transition: left .35s var(--ease); }
  .pk-ax { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; justify-content: space-between; font: 600 12px/1 var(--font); color: hsl(var(--hue) 40% 78% / .8); }
  .pk-code { height: 100%; box-sizing: border-box; padding: 24px 30px; font: 500 17px/1.65 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; color: hsl(var(--hue) 30% 88%); }
  .pk-code pre { margin: 0; font: inherit; white-space: pre; }
  .pk-code em { font-style: normal; color: hsl(var(--hue) 25% 64%); }
  .pk-code b { font-weight: 600; color: hsl(calc(var(--hue) + 40) 90% 74%); }
  .pk-code u { text-decoration: none; color: hsl(calc(var(--hue) - 30) 90% 76%); }
  .pk-code i { font-style: normal; padding: 1px 8px; border-radius: 6px; background: hsl(var(--hue) 80% 55% / .28); color: #fff; }

slides:

  - id: hero
    template: canvas
    label: Slideria
    bg: var(--bg)
    backdrop: aurora
    transition: zoom
    free:
      - type: html
        html: '<div class="sr-orb"><div class="sr-glow"></div><div class="sr-ring r3"><i></i></div><div class="sr-ring r2"><i></i><i class="b"></i></div><div class="sr-ring r1"><i></i></div><div class="sr-core"><svg viewBox="0 0 24 24"><path d="M20.5 3.5H8.25a4.25 4.25 0 0 0 0 8.5" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="20.5" cy="3.5" r="1.4" fill="currentColor"/><g opacity=".55"><path d="M8.25 12h7.5a4.25 4.25 0 0 1 0 8.5H3.5" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="3.5" cy="20.5" r="1.4" fill="currentColor"/></g></svg></div><div class="sr-chip c1"><b></b><span data-t="0"></span></div><div class="sr-chip c2"><b></b><span data-t="1"></span></div><div class="sr-chip c3"><b></b><span data-t="2"></span></div><div class="sr-chip c4"><b></b><span data-t="3"></span></div></div>'
        texts: [Один HTML-файл, Экспорт в PPTX, Режим докладчика, Тёмная тема]
        place: {x: 650, y: 60, w: 600, h: 600}
        enter: scale
        delay: 150
      - type: text
        text: SLIDERIA · ДВИЖОК ПРЕЗЕНТАЦИЙ
        styles: {text: {size: 15, weight: 700, spacing: 0.18, color: accent2}}
        place: {x: 72, y: 150, w: 560}
        enter: fade
      - type: text
        text: "Презентации,\nкоторые {g:duo|живут}"
        styles: {text: {size: 66, weight: 800, leading: 1.04, spacing: -0.02, color: text}}
        place: {x: 68, y: 196, w: 640}
        enter: rise
        delay: 220
      - type: text
        text: Слайды как данные, правка как в PowerPoint, показ как кино. И всё это — один HTML-файл, который открывается где угодно.
        styles: {text: {size: 21, color: text2, leading: 1.45}}
        place: {x: 72, y: 386, w: 540}
        enter: rise
        delay: 440
      - type: shape
        kind: pill
        fill: gradient
        gradient: {from: accent, to: accent2, angle: 135}
        shadow: md
        text: Открыть студию  →
        styles: {text: {size: 19}}
        place: {x: 72, y: 520, w: 260, h: 62}
        enter: pop
        delay: 700
      - type: shape
        kind: pill
        fill: none
        stroke: gradient
        strokeGradient: {from: accent, to: accent2, angle: 90}
        width: 2
        text: 12 слайдов витрины
        styles: {text: {size: 17, color: text}}
        place: {x: 350, y: 520, w: 230, h: 62}
        enter: pop
        delay: 820
    notes: |
      Это Slideria. Фон — живое сияние на WebGL, орбиты справа — обычная вёрстка с CSS-анимацией.
      Кнопка слева переливается: это градиент акцента с включённым «Переливанием» (Вид → Оформление).

  - id: inside
    title: Всё нужное — уже {g:duo|внутри}
    badge: без плагинов
    backdrop: particles
    transition: push
    body:
      - type: grid
        columns: 4
        items:
          - {type: stat, value: "31", label: вид блока, note: от текста до 3D-модели}
          - {type: stat, value: "7", label: эффектов появления, note: плюс свои из импорта}
          - {type: stat, value: "6", label: переходов между слайдами, note: от сдвига до размытия}
          - {type: stat, value: "1", label: файл для показа, note: работает без интернета}
      - type: card
        title: Путь презентации
        body:
          type: pipeline
          stepSeconds: 1.1
          steps:
            - {title: Идея, sub: YAML или импорт}
            - {title: Студия, sub: правка как в PowerPoint}
            - {title: Анимация, sub: появление и переходы}
            - {title: Показ, sub: окно докладчика}
            - {title: Экспорт, sub: HTML · PPTX · PDF}
      - type: card
        title: А ещё
        body:
          type: chips
          items: [Живые фоны*, Окно докладчика*, Импорт из Claude Design*, Экспорт в PPTX*, 3D-модели, Видео, Таблицы из Excel, Формат по образцу, Вставка слайдов из других презентаций, История отмены, Разгруппировка вёрстки, Тёмная тема]
    notes: |
      Цифры настоящие: столько блоков, эффектов и переходов есть в движке сейчас.
      Конвейер внизу подсвечивает шаги по очереди — это блок pipeline.

  - id: shapes
    template: canvas
    label: Фигуры и градиенты
    bg: var(--bg)
    transition: cover
    free:
      - type: text
        text: Фигуры и {g:ocean|градиенты}
        styles: {text: {size: 52, weight: 800, spacing: -0.02, color: text}}
        place: {x: 64, y: 44, w: 900}
        enter: rise
      - type: text
        text: 14 готовых градиентов, свой — в два цвета, градиентные контуры и линии. Всё на вкладке «Фигура».
        styles: {text: {size: 19, color: text2}}
        place: {x: 66, y: 120, w: 760}
        enter: fade
        delay: 150
      - type: shape
        kind: ellipse
        fill: gradient
        gradient: {from: accent, to: accent2, angle: 135}
        shadow: md
        text: Градиент акцента
        styles: {text: {size: 22}}
        place: {x: 80, y: 220, w: 300, h: 300}
        enter: scale
        delay: 250
      - type: shape
        fill: gradient
        gradient: {from: "#F97316", to: "#DB2777", angle: 135}
        shadow: md
        rotate: -6
        text: Закат
        styles: {text: {size: 26}}
        place: {x: 440, y: 226, w: 270, h: 160}
        enter: pop
        delay: 380
      - type: shape
        fill: surface
        stroke: gradient
        strokeGradient: {from: "#06B6D4", to: "#2563EB", angle: 135}
        width: 4
        text: Градиентный контур
        styles: {text: {size: 20, color: text}}
        place: {x: 440, y: 430, w: 270, h: 150}
        enter: pop
        delay: 520
      - type: shape
        kind: ellipse
        fill: none
        stroke: gradient
        strokeGradient: {from: "#8B5CF6", to: "#EC4899", angle: 135}
        width: 9
        place: {x: 770, y: 214, w: 180, h: 180}
        enter: scale
        delay: 620
      - type: shape
        kind: rect
        fill: gradient
        gradient: {from: "#475569", to: "#0F172A", angle: 160}
        rotate: 12
        radius: 22
        text: Графит
        styles: {text: {size: 18}}
        place: {x: 1000, y: 226, w: 150, h: 150}
        enter: pop
        delay: 700
      - type: shape
        kind: pill
        fill: gradient
        gradient: {from: "#22C55E", to: "#0D9488", angle: 135}
        shadow: sm
        text: Лес
        styles: {text: {size: 24}}
        place: {x: 770, y: 440, w: 300, h: 92}
        enter: right
        delay: 780
      - type: shape
        kind: ellipse
        fill: gradient
        gradient: {from: "#A7F3D0", to: "#BFDBFE", angle: 135}
        place: {x: 1100, y: 420, w: 110, h: 110}
        enter: pop
        delay: 860
      - type: shape
        kind: arrow
        stroke: gradient
        strokeGradient: {from: "#FBBF24", to: "#DC2626", angle: 90}
        width: 7
        place: {x: 770, y: 590, w: 440, h: 30}
        enter: left
        delay: 940
      - type: shape
        kind: line
        stroke: gradient
        dash: dash
        width: 5
        place: {x: 80, y: 600, w: 300, h: 20}
        enter: left
        delay: 1000
    notes: |
      Все фигуры — обычные блоки shape. Круг слева переливается вместе с темой.
      Контуры, стрелка и пунктир — тоже градиентом.

  - id: type
    template: canvas
    label: Текст как графика
    bg: var(--bg)
    backdrop: grid
    transition: blur
    free:
      - type: text
        text: "{g:sunset|Смело.}"
        styles: {text: {size: 128, weight: 900, leading: 1, spacing: -0.03}}
        place: {x: 60, y: 60, w: 640}
        enter: left
        delay: 100
      - type: text
        text: "{g:ocean|Ясно.}"
        styles: {text: {size: 128, weight: 900, leading: 1, spacing: -0.03}}
        place: {x: 60, y: 230, w: 640}
        enter: left
        delay: 330
      - type: text
        text: "{g:duo|Живо.}"
        styles: {text: {size: 128, weight: 900, leading: 1, spacing: -0.03}}
        place: {x: 60, y: 400, w: 640}
        enter: left
        delay: 560
      - type: quote
        text: Текст — тоже графика. Градиент ложится на слово, фразу или весь заголовок и остаётся обычным редактируемым текстом.
        author: Slideria
        role: Главная → Цвет текста → Градиент
        place: {x: 720, y: 200, w: 500}
        enter: right
        delay: 820
      - type: text
        text: Выделите слова — градиент ляжет только на них.
        styles: {text: {size: 17, color: muted}}
        place: {x: 66, y: 620, w: 600}
        enter: fade
        delay: 1100
    notes: Три слова — три градиента. «Живо» переливается вместе с акцентом. Фон — перспективная сетка.

  - id: data
    title: Данные, которые {g:duo|двигаются}
    badge: демо-данные
    transition: push
    body:
      - type: grid
        columns: 1.45fr 1fr
        items:
          - type: card
            title: Зрители показов
            body:
              type: line-chart
              values: [120, 180, 170, 260, 310, 290, 420, 480, 470, 610, 680, 760]
              start: январь
              end: декабрь
              scale: 1
          - type: card
            title: Слайдов за квартал
            body:
              type: bars
              values: [42, 58, 51, 86]
              labels: [Q1, Q2, Q3, Q4]
              height: 150
      - type: grid
        columns: 3
        items:
          - {type: stat, value: "99,9 %", label: показов без сбоев, delta: "+0,4 %"}
          - {type: stat, value: "2,4 с", label: сборка в один файл, delta: "−0,8 с"}
