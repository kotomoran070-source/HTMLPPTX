      Моушн-дизайн, как в After Effects, — но это обычный HTML-файл в презентации: пружина и размытие в движении, рисование линией (Trim Paths),
      трек-маска с пролётом камеры сквозь «О», 3D-кольцо с глубиной резкости, глитч и маска строки.
      Плейхед тянется в обе стороны — каждый кадр считается от времени; «Размытие в движении» включается и выключается. Мышь над 3D-сценой поворачивает камеру.
