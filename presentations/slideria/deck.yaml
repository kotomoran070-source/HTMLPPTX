  - id: thanks
    template: canvas
    label: Спасибо
    bg: "radial-gradient(ellipse 65% 60% at 50% 42%, color-mix(in srgb, var(--acs) 75%, var(--bg)), var(--bg) 72%)"
    transition: blur
    free:
      - type: embed
        src: ./assets/embed-particles.htm
        poster: ./assets/embed-particles.png
        theme: true
        interactive: true
        place: {x: 0, y: 0, w: 1280, h: 720}
      - type: text
        text: Слайды как данные. Показ как {g:duo|кино}.
        styles: {text: {size: 26, weight: 600, color: text2, align: center}}
        place: {x: 240, y: 480, w: 800}
        enter: rise
        delay: 1400
      - type: text
        text: Проведите мышью по буквам · щелчок — взрыв и новая сборка
        styles: {text: {size: 15, color: muted, align: center, spacing: 0.04}}
        place: {x: 240, y: 560, w: 800}
        enter: fade
        delay: 2200
    notes: |
      Слово собрано из нескольких тысяч частиц в цветах акцента. Частицы разбегаются от курсора и возвращаются,
      щелчок взрывает слово — и оно собирается снова. По буквам пробегает волна света.
