title: Схемы
slides:
  - template: content
    title: Цикл
    body: {type: cycle, center: "Улучшаем", items: [{title: "Планируем", text: "Цели квартала"}, {title: "Делаем", text: "Спринты по 2 недели"}, {title: "Проверяем", text: "Метрики и отзывы"}, {title: "Улучшаем", text: "Выводы в следующий план"}]}
  - template: content
    title: Воронка продаж
    body: {type: funnel, items: [{title: "Посетители", text: "12 400 за месяц"}, {title: "Заявки", text: "1 860 — 15 %"}, {title: "Встречи", text: "420 — каждая четвёртая"}, {title: "Сделки", text: "96 договоров"}]}
  - template: content
    title: Пирамида приоритетов
    body: {type: pyramid, items: [{title: "Миссия", text: "Зачем мы существуем"}, {title: "Стратегия", text: "Куда идём три года"}, {title: "Цели", text: "Что делаем в этом году"}, {title: "Задачи", text: "Ежедневная работа команды"}]}
  - template: content
    title: Три причины
    body: {type: numbers, items: [{title: "Быстро", text: "Слайды собираются из данных за минуты"}, {title: "Живо", text: "Анимации, графики и 3D прямо в показе"}, {title: "Один файл", text: "Открывается где угодно, без программ"}]}
  - template: content
    title: Было и стало
    body: {type: compare, items: [{title: "Было", text: "- Отчёт вручную два дня\n- Ошибки в цифрах\nПять версий файла"}, {title: "Стало", text: "+ Отчёт за минуту\n+ Цифры из таблицы\n+ Один живой файл"}]}
  - template: content
    title: Матрица Эйзенхауэра
    body: {type: matrix, xAxis: "Срочность →", yAxis: "Важность →", items: [{title: "Запланировать", text: "Важно, но не срочно"}, {title: "Сделать сейчас", text: "Важно и срочно"}, {title: "Отказаться", text: "Не важно и не срочно"}, {title: "Поручить", text: "Срочно, но не важно"}]}
  - template: content
    title: Почему мы
    body: {type: icons, items: [{title: "Скорость", text: "Ответ за 5 минут"}, {title: "Безопасность", text: "Данные под защитой"}, {title: "Команда", text: "40 инженеров"}, {title: "Поддержка", text: "Круглосуточный чат"}]}
  - template: content
    title: В цифрах
    body: {type: stats, items: [{title: "99,9 %", text: "показов без сбоев"}, {title: "2,4 с", text: "сборка в один файл"}, {title: "17 234", text: "презентаций в месяц"}]}
  - template: content
    title: Дорожная карта
    body: {type: roadmap, items: [{title: "Исследование", text: "I квартал", done: true}, {title: "Прототип", text: "II квартал", done: true}, {title: "Пилот", text: "III квартал"}, {title: "Запуск", text: "IV квартал"}]}
  - template: content
    title: Лестница роста
    body: {type: ladder, items: [{title: "Пилот", text: "1 команда"}, {title: "Отдел", text: "40 человек"}, {title: "Компания", text: "600 человек"}, {title: "Группа", text: "5 компаний"}]}
  - template: content
    title: Орбиты
    body: {type: orbit, center: "Продукт", sub: "версия 2.0", items: [{title: "Команда"}, {title: "Клиенты"}, {title: "Партнёры"}, {title: "Данные"}]}
  - template: content
    title: Где мы сильны
    body: {type: venn, center: "Наш продукт", items: [{title: "Скорость", text: "Готово за минуты"}, {title: "Качество", text: "Дизайн без дизайнера"}, {title: "Цена", text: "Дешевле агентства"}]}
  - template: content
    title: Размер рынка
    body: {type: nested, items: [{title: "TAM", text: "120 млрд ₽ — весь рынок презентаций"}, {title: "SAM", text: "18 млрд ₽ — компании, которые готовят их сами"}, {title: "SOM", text: "1,2 млрд ₽ — наша доля за три года"}]}
  - template: content
    title: Как всё работает вместе
    body: {type: gears, items: [{title: "Продажи", text: "Приводят клиентов"}, {title: "Продукт", text: "Решает задачу"}, {title: "Поддержка", text: "Удерживает"}, {title: "Данные", text: "Подсказывают, что менять"}]}
  - template: content
    title: На чём держимся
    body: {type: pillars, center: "Стратегия 2027", items: [{title: "Люди", text: "Сильная команда"}, {title: "Продукт", text: "Лучший в нише"}, {title: "Клиенты", text: "Растём вместе"}, {title: "Деньги", text: "Прибыль каждый квартал"}]}
  - template: content
    title: Архитектура
    body: {type: layers, items: [{title: "Интерфейс", text: "Что видит пользователь"}, {title: "Сервисы", text: "Логика и правила"}, {title: "Данные", text: "Хранилище и аналитика"}, {title: "Инфраструктура", text: "Серверы и сеть"}]}
  - template: content
    title: Путь продукта
    body: {type: diamonds, items: [{title: "Идея", text: "Что меняем"}, {title: "Команда", text: "Кто делает"}, {title: "Запуск", text: "Выход на рынок"}, {title: "Рост", text: "Как масштабируем"}]}
  - template: content
    title: Дорога к цели
    body: {type: arc, center: "1 млн клиентов", items: [{title: "Старт", text: "Первые 100 клиентов"}, {title: "Рост", text: "Реклама и партнёры"}, {title: "Масштаб", text: "Новые регионы"}, {title: "Лидерство", text: "Номер один в нише"}]}
  - template: content
    title: Новый продукт
    body: {type: mindmap, center: "Новый продукт", items: [{title: "Аудитория", text: "Малый бизнес"}, {title: "Цена", text: "Подписка от 990 ₽"}, {title: "Каналы", text: "Соцсети и партнёры"}, {title: "Команда", text: "Пять человек"}, {title: "Сроки", text: "Запуск в марте"}]}
  - template: content
    title: Что за результатом
    body: {type: iceberg, items: [{title: "Запуск за месяц", text: "Что видят клиенты"}, {title: "Исследования", text: "40 интервью с пользователями"}, {title: "Команда", text: "Полгода найма и обучения"}, {title: "Инфраструктура", text: "Серверы, данные, безопасность"}]}
  - template: content
    title: Частые вопросы
    body: {type: faq, items: [{title: "Нужен ли интернет?", text: "Нет: презентация — один файл, всё внутри."}, {title: "Можно открыть в PowerPoint?", text: "Да, экспорт в PPTX сохраняет текст и картинки."}, {title: "Как показывать с телефона?", text: "Отсканируйте QR в окне показа — телефон станет пультом."}]}
  - template: content
    title: План работ
    body: {type: gantt, scale: [Янв, Фев, Мар, Апр, Май, Июн], today: 3.5, items: [{title: "Подготовка", section: true}, {title: "Исследование", text: "Аналитики", from: 1, to: 1.5, done: 100}, {title: "Прототип", text: "Команда продукта", from: 1.5, to: 3, done: 70}, {title: "Закупка", text: "Снабжение", from: 1, to: 2.5, done: 60}, {title: "Пилот", from: 5, to: 6}, {title: "Запуск", from: 6, milestone: true}]}
  - template: content
    title: Риски проекта
    body: {type: risks, items: [{title: "Срыв поставок", text: "Второй поставщик в резерве", p: 4, i: 5}, {title: "Нехватка инженеров", text: "Найм с марта", p: 3, i: 4}, {title: "Отказ пилотного клиента", text: "Два запасных", p: 2, i: 2}]}
  - template: content
    title: Почему срываются сроки
    body: {type: fishbone, effect: "Срыв сроков", items: [{title: "Люди", text: "Нехватка инженеров\nНет владельца"}, {title: "Процессы", text: "Долгие согласования"}, {title: "Техника", text: "Старые серверы\nРучные тесты"}]}
  - template: content
    title: Где развернуть систему
    body: {type: decision, options: [Свой сервер, Облако, Гибрид], criteria: [{title: "Стоимость", weight: 3, scores: [3, 5, 4]}, {title: "Безопасность", weight: 1, scores: [5, 3, 4]}]}
  - template: content
    title: Оплата
    body: {type: diagram, code: "нумерация\nактёр Покупатель\nПокупатель -> Магазин: заказ\nМагазин -> Банк: списать\nБанк -> Банк: проверка\nБанк --> Магазин: успешно\nзаметка Банк: 3-D Secure\n== Итог ==\nМагазин --> Покупатель: чек"}
  - template: content
    title: Заявка
    body: {type: diagram, kind: flow, code: "(Заявка) -> [Проверить] -> {Верно?}\nВерно? -> [Сохранить]: да\nВерно? -> [Уточнить]: нет\nУточнить --> Проверить"}
  - template: content
    title: Заказ
    body: {type: diagram, kind: state, code: "[*] -> Новый\nНовый -> Оплачен: оплата\nОплачен -> [*]"}
