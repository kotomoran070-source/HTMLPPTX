# Новая презентация. После титула — слайды-примеры по разделам: оставьте нужные, остальные удалите.
# Справочник компонентов: docs/COMPONENTS.md
# Всё правится в студии: «Редактор» на карточке презентации — тексты на слайде, остальное в «Свойствах».
# Логотип: замените assets/logo.svg своим файлом (svg, png или jpg) — он на титуле, в углу слайдов,
# на финальном слайде и в центре QR-кода.

title: "{{title}}"
lang: ru
brand:
  name: "{{title}}"
  logo: ./assets/logo.svg
# Цвета презентации: акцент и второй цвет — градиенты и выделенные {g:duo|слова}.
# Поменять — «Вид → Оформление» в студии или здесь.
theme:
  accent: "#4F46E5"
  accent2: "#0EA5E9"

slides:

  - id: cover
    template: cover
    label: Титульный слайд
    backdrop: aurora
    title: "{{title}}"
    lead: "Подзаголовок: о чём эта презентация — одним предложением."
    meta: "[Месяц год] · [команда или автор]"
    visual:
      type: network
      nodes: 6
    notes: |
      Представиться и назвать тему. Живой фон в цветах акцента меняется в панели слайда — «Анимация фона».
      Дальше идут слайды-примеры по разделам: оставьте нужные, остальные удалите (Delete в ленте миниатюр).

  - id: start
    title: С чего {g:duo|начать}
    label: С чего начать
    badge: 4 шага
    transition: push
    gap: 26
    body:
      - type: grid
        columns: 2
        rows: 1fr 1fr
        height: 440
        gap: 20
        align: stretch
        items:
          - type: card
            title: 1 · Правьте на месте
            text: Щёлкните по любому тексту и пишите. Картинку замените, перетащив на неё свой файл.
            body: {type: chips, items: [Клик по тексту*, Перетащить фото]}
          - type: card
            title: 2 · Добавляйте
            text: «Вставка → Блоки» — числа, графики, таблицы, схемы. Новый слайд — Ctrl+M.
            body: {type: chips, items: [Блоки*, Ctrl+M]}
          - type: card
            title: 3 · Оформляйте
            text: «Дизайн» — акцентный цвет и тема. Тёмная тема и оттенки строятся сами.
            body: {type: chips, items: [Цвет*, Тема]}
          - type: card
            title: 4 · Показывайте
            text: F5 — показ, P — окно докладчика, R — пульт. «Экспорт» — HTML, PowerPoint, PDF.
            body: {type: chips, items: [F5*, Экспорт]}
      - type: note
        text: Дальше — примеры по разделам. Оставьте нужные слайды, остальные удалите — Delete в ленте миниатюр.
    notes: |
      Этот и следующий слайд — подсказки для вас; перед показом их можно удалить.
      Всё сохраняется само, без кнопки. Отменить — Ctrl+Z.

  - id: studio
    template: canvas
    label: Это студия
    transition: fade
    free:
      - {type: text, text: Знакомство, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Это {g:duo|студия}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: text
        text: Всё под рукой, как в PowerPoint. Правки сохраняются сами — кнопки «Сохранить» нет.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - type: image
        src: ./assets/ui-studio.webp
        srcDark: ./assets/ui-studio-dark.webp
        radius: 14
        shadow: lg
        stroke: border
        width: 1
        place: {x: 48, y: 156, w: 768, h: 432}
        enter: scale
        delay: 150
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "1", styles: {text: {size: 15, weight: 800}}, place: {x: 380, y: 186, w: 34, h: 34}, enter: pop, delay: 500}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "2", styles: {text: {size: 15, weight: 800}}, place: {x: 74, y: 352, w: 34, h: 34}, enter: pop, delay: 600}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "3", styles: {text: {size: 15, weight: 800}}, place: {x: 300, y: 300, w: 34, h: 34}, enter: pop, delay: 700}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "4", styles: {text: {size: 15, weight: 800}}, place: {x: 738, y: 330, w: 34, h: 34}, enter: pop, delay: 800}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "5", styles: {text: {size: 15, weight: 800}}, place: {x: 300, y: 532, w: 34, h: 34}, enter: pop, delay: 900}
      - {type: text, text: "**1 · Лента**\nвкладки как в PowerPoint: текст, вставка, анимация, показ", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 160, w: 380}, enter: left, delay: 500}
      - {type: text, text: "**2 · Миниатюры**\nперетащите, чтобы поменять порядок; правый щелчок — меню слайда", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 246, w: 380}, enter: left, delay: 600}
      - {type: text, text: "**3 · Слайд**\nщёлкните по тексту и пишите, объекты тяните мышью", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 332, w: 380}, enter: left, delay: 700}
      - {type: text, text: "**4 · Свойства**\nвсё о выделенном: размер, цвета, анимация, ссылка по щелчку", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 418, w: 380}, enter: left, delay: 800}
      - {type: text, text: "**5 · Заметки**\nвидите только вы — в окне докладчика и на пульте", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 504, w: 380}, enter: left, delay: 900}
      - {type: text, text: "Ctrl+Z — отменить (до 200 шагов) · Ctrl+` — код слайда · F5 — показ", styles: {text: {size: 14, color: muted}}, place: {x: 50, y: 612, w: 900}, enter: fade, delay: 1000}
    notes: |
      Снимок — настоящая студия. В тёмной теме он сменится на тёмный: у картинки есть вариант для тёмной темы
      (кнопка «Тёмная тема» на панели картинки).

  - id: contents
    template: canvas
    label: Что внутри
    transition: fade
    free:
      - {type: text, text: Оглавление, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Что {g:duo|внутри}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: text
        text: Щелчок по плитке при показе — переход к разделу. Такую ссылку можно дать любой фигуре.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Текст и цифры**\nчисла, цитата, графики, таблицы", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:summary", place: {x: 48, y: 166, w: 284, h: 190}, enter: pop, delay: 180}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Схемы и процессы**\nшаги, хронология, живая схема", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:process", place: {x: 348, y: 166, w: 284, h: 190}, enter: pop, delay: 240}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Интерактив**\nползунки, кнопки, код на слайде", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:interactive", place: {x: 648, y: 166, w: 284, h: 190}, enter: pop, delay: 300}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Медиа**\nфото, видео, 3D и фильтры", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:media", place: {x: 948, y: 166, w: 284, h: 190}, enter: pop, delay: 360}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Свободный холст**\nвсё двигается мышью", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:canvas", place: {x: 48, y: 372, w: 284, h: 190}, enter: pop, delay: 420}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Свои блоки**\nсохранить как шаблон, формат по образцу", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:custom", place: {x: 348, y: 372, w: 284, h: 190}, enter: pop, delay: 480}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Оформление и импорт**\nцвет, тёмная тема, фоны, Claude", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:design", place: {x: 648, y: 372, w: 284, h: 190}, enter: pop, delay: 540}
      - {type: shape, kind: round, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, radius: 18, text: "**Показ и пульт**\nдокладчик, телефон, экспорт", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:remote", place: {x: 948, y: 372, w: 284, h: 190}, enter: pop, delay: 600}
    notes: |
      Плитки — обычные фигуры со ссылкой на слайд (в свойствах фигуры — «По щелчку при показе»).
      Удалили раздел — удалите и его плитку.

  - id: summary
    title: Коротко о {g:duo|главном}
    badge: Текст
    transition: push
    gap: 40
    body:
      - type: grid
        columns: 3
        height: 220
        align: stretch
        items:
          - type: card
            body: {type: stat, value: "42 %", label: рост главного показателя, delta: "+8 п. п.", note: за квартал}
          - type: card
            body: {type: stat, value: "1,2 млн", label: человек охватили, delta: "+15 %", note: с начала года}
          - type: card
            body: {type: stat, value: "3", label: "решения, о которых расскажем", note: дальше — по слайду на каждое}
      - type: quote
        text: Одна фраза, ради которой стоит досмотреть эту презентацию до конца.
        author: Имя Фамилия
        role: должность
      - type: chips
        items: [Главный вывод*, Второй факт, Третий факт]
    notes: |
      Три числа, которые зал должен запомнить. Числа и подписи правятся прямо на слайде.
      Минус в «delta» — красная стрелка вниз; звёздочка в конце чипа — выделение.

  - id: points
    title: Три {g:duo|ключевых} мысли
    badge: Текст
    transition: push
    gap: 30
    body:
      - type: grid
        columns: 3
        height: 340
        align: stretch
        items:
          - type: card
            title: Проблема
            text: Что мешает сейчас и кого это касается — в двух строках.
            body: {type: list, items: [Факт или цифра, Кто от этого страдает, Сколько это стоит]}
          - type: card
            title: Решение
            text: Что предлагаем и чем это лучше привычного способа.
            body: {type: list, items: [Суть решения, Чем отличается, Что уже проверено]}
          - type: card
            title: Результат
            text: Что изменится, как и когда это измерить.
            body: {type: list, items: [Главная метрика, Срок, Что нужно для старта]}
      - type: card
        title: Итог
        text: Одной фразой — почему это важно именно сейчас и что вы просите у зала.
    notes: Одна мысль — одна карточка. Лишнюю карточку удалите (Delete), новую — Ctrl+D.

  - id: data
    title: Цифры и {g:duo|динамика}
    badge: Цифры
    transition: push
    gap: 32
    body:
      - type: grid
        columns: 1.75fr 1fr
        align: stretch
        items:
          - type: card
            title: Рост за год
            body:
              type: line-chart
              values: [12, 14, 13, 17, 19, 18, 23, 26, 25, 29, 33, 36]
              start: январь
              end: декабрь
              scale: 1
              min: 10
              max: 40
          - type: card
            title: По кварталам
            body:
              type: bars
              values: [3, 5, 4, 7]
              labels: [Q1, Q2, Q3, Q4]
              height: 200
      - type: grid
        columns: 3
        align: stretch
        items:
          - {type: card, body: {type: stat, value: "36 тыс", label: пользователей в декабре, delta: "+24 %"}}
          - {type: card, body: {type: stat, value: "4,8", label: средняя оценка, note: из 5}}
          - {type: card, title: План года, body: {type: progress, label: Задачи, value: 7 из 10, percent: 70}}
    notes: |
      Графики — это данные, а не картинки: числа правятся в «Свойствах»,
      в PowerPoint уходят настоящими диаграммами, в тёмной теме перекрашиваются сами.

  - id: plan
    title: План и {g:duo|статус}
    badge: Таблицы
    transition: push
    gap: 30
    body:
      - type: table
        variant: stripes
        header: [Этап, Срок, Ответственный, Статус]
        rows:
          - [Исследование, январь, "[имя]", "{#16A34A|● готово}"]
          - [Прототип, март, "[имя]", "{#16A34A|● готово}"]
          - [Пилот, июнь, "[имя]", "{#CA8A04|● идёт}"]
          - [Запуск, сентябрь, "[имя]", "{#64748B|● впереди}"]
        widths: [2, 1, 1.3, 1]
        labels: true
        density: roomy
      - type: grid
        columns: 2
        items:
          - type: card
            title: Риски
            body: {type: list, items: [Главный риск и как его снижаем, Что может сдвинуть сроки]}
          - type: card
            title: Что нужно от вас
            body: {type: list, items: [Решение или согласование, Ресурсы и сроки]}
    notes: Таблицу из Excel или Google Таблиц можно вставить прямо в ячейку; ширину столбцов — потянуть мышью за границу.

  - id: process
    title: Как это {g:duo|работает}
    badge: Процессы
    transition: push
    gap: 44
    body:
      - type: pipeline
        steps:
          - { title: Идея, sub: формулируем задачу }
          - { title: Прототип, sub: проверяем быстро }
          - { title: Пилот, sub: на реальных данных }
          - { title: Запуск, sub: для всех }
      - type: timeline
        items:
          - { date: Январь, title: Исследование, done: true }
          - { date: Март, title: Прототип, done: true }
          - { date: Июнь, title: Пилот }
          - { date: Сентябрь, title: Запуск }
      - type: grid
        columns: 2
        items:
          - type: card
            title: Уже сделано
            body: {type: list, items: [Исследование и интервью, Прототип и первые отзывы, Метрики успеха договорены]}
          - type: card
            title: Что дальше
            body: {type: list, items: [Пилот с первыми клиентами, Запуск и обучение команды, Масштабирование]}
    notes: |
      Шаги подсвечиваются по очереди; линия хронологии дорисовывается до последнего пройденного этапа (done: true).

  - id: schemes
    title: Живые {g:duo|схемы}
    label: Живые схемы
    badge: Схемы
    transition: push
    body:
      - type: hub
        height: 470
        items:
          - {title: Команда, text: Кто делает и за что отвечает, node: Команда, sub: 12 человек}
          - {title: Продукт, text: Что получает клиент, node: Продукт, sub: версия 2.0}
          - {title: Клиенты, text: Для кого и сколько их, node: Клиенты, sub: "1,2 млн"}
          - {title: Партнёры, text: С кем растём вместе, node: Партнёры, sub: 8 компаний}
    notes: |
      Наведите на пункт слева — подсветится узел схемы, и наоборот. В центре — ваш логотип.
      Ещё живые схемы — в «Блоках»: сеть с импульсами, система «оборудование → сервер → интерфейсы».

  - id: interactive
    template: canvas
    label: Слайд, который считает
    transition: fade
    free:
      - {type: text, text: Интерактив, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Слайд, который {g:duo|считает}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: text
        text: Двигайте ползунок при показе — числа и столбцы пересчитываются на глазах у зала.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - {type: control, name: n, label: Клиентов в месяц, min: 20, max: 200, step: 10, value: 120, place: {x: 48, y: 166, w: 560}, enter: rise, delay: 200}
      - type: grid
        columns: 2
        items:
          - {type: card, body: {type: stat, value: "{{n*12}}", label: клиентов за год, note: "ползунок × 12 месяцев", styles: {value: {size: 44}}}}
          - {type: card, body: {type: stat, value: "{{round(n*12*4.9/1000, 1)}} млн", label: "выручка за год, ₽", note: при чеке 4 900 ₽, styles: {value: {size: 44}}}}
        place: {x: 48, y: 268, w: 560}
        enter: rise
        delay: 300
      - type: card
        title: Рост по кварталам
        body:
          type: bars
          values: ["=n*2", "=n*2.6", "=n*3.1", "=n*4.3"]
          labels: [Q1, Q2, Q3, Q4]
          max: 900
          height: 230
        place: {x: 648, y: 166, w: 584, h: 340}
        enter: rise
        delay: 300
      - {type: shape, kind: pill, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "Как это сделано?  →", styles: {text: {size: 17}}, action: "show:how", place: {x: 48, y: 470, w: 280, h: 54}, enter: pop, delay: 500}
      - id: how
        hidden: true
        type: shape
        kind: round
        fill: soft
        radius: 16
        text: "Ползунок задаёт переменную **n**, а блоки считают по формулам: клиентов за год — n × 12, столбцы — n × 2, n × 2,6… Кнопка — фигура с действием «Показать объект»."
        styles: {text: {size: 16, weight: 500, align: left, leading: 1.45}}
        enter: pop
        place: {x: 48, y: 546, w: 1184, h: 90}
    notes: |
      Ползунок — блок «control»: при показе двигается мышью или пальцем на пульте, окна показа и докладчика синхронны.
      Скрытый объект появляется по кнопке — так делают вопросы с ответом, подсказки, вкладки.

  - id: code
    template: canvas
    label: Код прямо на слайде
    transition: fade
    free:
      - {type: text, text: Интерактив, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Код прямо на {g:duo|слайде}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: text
        text: Песочница для лекций и демо — правьте код при показе, результат обновится сам. Esc — снова листать слайды.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - type: sandbox
        title: hello.html
        theme: true
        size: 15
        split: 54
        console: true
        code: |
          <h1>Привет, зал!</h1>
          <style>
            body { display: grid; place-items: center; height: 100vh; margin: 0; font: 800 54px system-ui; }
            h1 { background: linear-gradient(90deg, var(--ac), var(--ac2));
                 -webkit-background-clip: text; color: transparent; }
          </style>
          <script>
            // Поменяйте текст выше — результат обновится сам
            console.log('Слайдов в презентации:', 21);
          </script>
        place: {x: 48, y: 156, w: 1184, h: 480}
        enter: rise
        delay: 200
    notes: |
      Готовая песочница — «Вставка → Блоки → Интерактив». Правки во время показа в презентацию не сохраняются:
      каждый показ начинается с исходного кода.

  - id: media
    title: Картинки, видео и {g:duo|3D}
    badge: Медиа
    transition: push
    body:
      - type: grid
        columns: 1.25fr 1fr
        align: stretch
        items:
          - type: image
            src: ./assets/photo.svg
            height: 500
            radius: 18
            shadow: md
            caption: Перетащите своё фото на картинку — оно встанет в рамку
          - type: card
            title: Что можно принести
            text: Перетащите файл на слайд — он встанет сам.
            body:
              type: kv
              keyWidth: 96
              rows:
                Фото: PNG, JPG, WebP, SVG — большие ужмутся сами
                GIF: при каждом заходе на слайд — с начала
                Видео: MP4, WebM или ссылка YouTube и Vimeo
                3D: GLB или STEP — модель крутится мышью
                Таблицы: из Excel — вставкой в ячейку
                Шрифты: WOFF2, TTF, OTF — свои
    notes: |
      Обрезка, рамка, фильтры и цвет снимка — вкладка «Рисунок» (выделите картинку).
      Для тёмной темы можно задать отдельную картинку — кнопка «Тёмная тема» на панели картинки.

  - id: filters
    title: Фото в стиле {g:duo|презентации}
    label: Фильтры для фото
    badge: Медиа
    transition: push
    gap: 30
    body:
      - type: grid
        columns: 4
        items:
          - {type: image, src: ./assets/photo.svg, height: 300, radius: 16, shadow: sm, caption: Как есть}
          - {type: image, src: ./assets/photo.svg, height: 300, radius: 16, shadow: sm, filter: duo, caption: Дуотон в цветах темы}
          - {type: image, src: ./assets/photo.svg, height: 300, radius: 16, shadow: sm, filter: noir, caption: Нуар}
          - {type: image, src: ./assets/photo.svg, height: 300, radius: 16, shadow: sm, filter: warm, caption: Тёплый}
      - type: card
        title: Один снимок — четыре настроения
        text: "Выделите картинку → вкладка «Рисунок» → «Цвет»: 17 фильтров с примеркой на самом снимке, яркость, контраст, насыщенность. Фильтры в цветах темы перекрашиваются вместе с акцентом — и в PowerPoint уходят такими же."
    notes: Здесь одна и та же картинка с разными фильтрами. Ещё на вкладке «Рисунок» — кадр, скругление, тень, рамка и паспарту.

