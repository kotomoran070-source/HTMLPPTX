            title: Из Claude Design и чата с Claude
            text: "Перетащите экспорт или HTML, где каждый слайд — <section class=\"slide\">: слайды станут редактируемыми, со своими анимациями."
            body: {type: chips, items: [Импорт HTML*, Свой HTML]}
          - type: card
            title: Из другой презентации
            text: Скопируйте слайды или объекты там (Ctrl+C) и вставьте здесь (Ctrl+V) — с картинками и оформлением.
            body: {type: chips, items: [Ctrl+C*, Ctrl+V]}
          - type: card
            title: Правки от коллег
            text: Отправьте «HTML с правкой» — получатель поправит файл в браузере, его правки вернутся импортом.
            body: {type: chips, items: [HTML с правкой*, Импорт]}
    notes: |
      Ещё: таблицы из Excel и Google Таблиц вставляются прямо в ячейку, свои шрифты — «Добавить шрифт…» в свойствах
      текста или перетаскиванием файла на страницу.

