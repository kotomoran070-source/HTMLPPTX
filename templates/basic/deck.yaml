      - {type: text, text: "**Свой эффект**\nправый щелчок → «Сохранить появление как эффект…»", styles: {text: {size: 15, color: text2, leading: 1.45}}, place: {x: 952, y: 312, w: 280}, enter: left, delay: 700}
      - {type: text, text: "**Группы**\nShift+клик и Ctrl+G; «Появляться по очереди» — одной командой", styles: {text: {size: 15, color: text2, leading: 1.45}}, place: {x: 952, y: 392, w: 280}, enter: left, delay: 750}
