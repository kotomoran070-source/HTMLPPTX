      - {type: text, text: "**Кликер**\nобычная указка с USB-приёмником работает без настройки", styles: {text: {size: 17, color: text2, leading: 1.45}}, place: {x: 50, y: 476, w: 700}, enter: left, delay: 600}
      - type: image
        src: ./assets/ui-phone.webp
        srcDark: ./assets/ui-phone-dark.webp
        radius: 30
        shadow: lg
        stroke: border
        width: 2
        place: {x: 870, y: 36, w: 304, h: 629}
        enter: rise
        delay: 300
    notes: |
      Телефон и компьютер — в одной Wi-Fi. В первый раз Windows спросит, разрешить ли Slideria доступ к сети, — «Разрешить».
      Если телефон не открывает страницу, в окне с QR есть кнопка «Разрешить в брандмауэре».

  - id: show
    title: Показ и {g:duo|экспорт}
    badge: Показ
    transition: push
    gap: 30
    body:
      - type: grid
        columns: 2
        height: 450
        align: stretch
        items:
          - type: card
            title: Клавиши во время показа
            body:
              type: kv
              keyWidth: 90
              rows:
                → ←: следующий и предыдущий слайд
                F: во весь экран
                P: окно докладчика — заметки, таймер, следующий слайд
                R: пульт — QR-код для телефона
                T: светлая или тёмная тема
                B: чёрный экран
                O: все слайды
          - type: card
            title: Как поделиться
            text: Кнопка «Экспорт» в редакторе.
            body:
              type: kv
              keyWidth: 150
              rows:
                HTML для показа: один файл — откроется где угодно, даже без интернета
                PowerPoint: тексты, таблицы и графики остаются редактируемыми
                PDF: Ctrl+P в показе → «Сохранить как PDF»
                HTML с правкой: получатель поправит и вернёт вам
    notes: |
      Кликер с USB-приёмником работает без настройки. Буквенные клавиши работают и в русской раскладке.

