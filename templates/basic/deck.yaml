            title: Цвет одной кнопкой
            text: «Дизайн» → акцент и второй цвет. Перекрасится всё — фигуры, графики, градиенты; «Переливание» пускает цвета течь.
            body: {type: chips, items: [Акцент*, Градиент, Переливание]}
          - type: card
            title: Тёмная тема
            text: Клавиша T при показе. Оттенки строятся сами, а для фото и логотипа можно дать отдельный вариант — как у снимков в этом шаблоне.
            body: {type: chips, items: [T*, Картинка для тёмной темы]}
          - type: card
            title: Живые фоны
            text: Частицы, сияние, сетка — «Анимация фона» в свойствах слайда. Этот слайд — на частицах; на титуле — сияние.
            body: {type: chips, items: [Частицы*, Сияние, Сетка]}
          - type: card
            title: Анимации
            text: 7 эффектов появления и 6 переходов — вкладка «Анимация». Несколько объектов — «Появляться по очереди».
            body: {type: chips, items: [Появление*, Переходы, По очереди]}
    notes: Поменяйте акцент на вкладке «Дизайн» и пролистайте презентацию — перекрасится каждый слайд.

  - id: import
    title: Принесите {g:duo|готовое}
    label: Импорт
    badge: Импорт
    transition: push
    body:
      - type: grid
        columns: 2
        rows: 1fr 1fr
        height: 420
        gap: 20
        align: stretch
        items:
          - type: card
            title: Из Claude Design
            text: Перетащите экспорт на страницу «Презентации» — каждый слайд станет редактируемым, со своими анимациями.
            body: {type: chips, items: [Импорт HTML*]}
          - type: card
            title: Из чата с Claude
            text: "Попросите презентацию, где каждый слайд — <section class=\"slide\">, и перетащите файл так же."
            body: {type: chips, items: [Свой HTML*]}
          - type: card
            title: Из другой презентации
            text: Скопируйте слайды или объекты там (Ctrl+C) и вставьте здесь (Ctrl+V) — с картинками и оформлением.
            body: {type: chips, items: [Ctrl+C*, Ctrl+V]}
          - type: card
            title: Правки от коллег
            text: Отправьте «HTML с правкой», получатель поправит файл в браузере — его правки вернутся импортом.
            body: {type: chips, items: [HTML с правкой*, Импорт]}
    notes: |
      Ещё: таблицы из Excel и Google Таблиц вставляются прямо в ячейку, свои шрифты — «Добавить шрифт…» в свойствах
      текста или перетаскиванием файла на страницу.

  - id: remote
    template: canvas
    label: Пульт и окно докладчика
    transition: fade
    free:
      - {type: text, text: Показ, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Пульт в {g:duo|кармане}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 760}
        enter: rise
      - type: text
        text: Нажмите R во время показа и наведите камеру телефона на QR-код — телефон станет пультом с вашими заметками.
        styles: {text: {size: 17, color: text2, leading: 1.5}}
        place: {x: 50, y: 106, w: 700}
        enter: fade
        delay: 100
      - {type: text, text: "**Окно докладчика — P**\nтекущий и следующий слайд, заметки, таймер; на втором мониторе — само", styles: {text: {size: 17, color: text2, leading: 1.45}}, place: {x: 50, y: 200, w: 700}, enter: left, delay: 300}
      - {type: text, text: "**На телефоне**\nкрупные «Назад» и «Далее», заметки, указка, перо и чёрный экран", styles: {text: {size: 17, color: text2, leading: 1.45}}, place: {x: 50, y: 292, w: 700}, enter: left, delay: 400}
