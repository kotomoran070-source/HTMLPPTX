  - id: show
    title: Показ и {g:duo|экспорт}
    badge: Показ
    transition: push
    gap: 30
    body:
      - type: grid
        columns: 2
        height: 540
        align: stretch
        items:
          - type: card
            title: Клавиши во время показа
            body:
              type: kv
              keyWidth: 90
              rows:
                → ←: следующий и предыдущий слайд
                F: во весь экран
                P: окно докладчика — заметки, таймер, следующий слайд
                R: пульт — QR-код для телефона
                A: автопоказ — слайды листаются сами, ещё раз — пауза
                T: светлая или тёмная тема
                B: чёрный экран
                O: все слайды
                "+ −": крупнее или мельче — для маленьких экранов
                Щелчок: по блоку — прожектор
          - type: card
            title: Как поделиться
            text: Кнопка «Экспорт» в редакторе.
            body:
              type: kv
              keyWidth: 150
              rows:
                HTML для показа: один файл — откроется где угодно, даже без интернета
                PowerPoint: тексты, таблицы, графики и формулы остаются редактируемыми
                PDF: Ctrl+P в показе → «Сохранить как PDF»
                HTML с правкой: получатель поправит и вернёт вам
                Автопоказ: «Показ» → «Сразу при открытии» — для стенда или рассылки; время у каждого слайда своё
                Скрыть слайд: остаётся в файле, но при показе и в PDF пропускается
    notes: |
      Кликер с USB-приёмником работает без настройки. Буквенные клавиши работают и в русской раскладке.
      Автопоказ листает слайды сам, когда доиграли анимации: время слайда — «Показ» → «Слайд 5 с», «По кругу» —
      снова с первого, «Таймлайн автопоказа» — тонкая полоса внизу, сколько осталось до следующего слайда.

  - id: cartoon
    template: canvas
    label: Одна фигура — целый мультик
    transition: zoom
    free:
      - {type: text, text: Финал, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Одна фигура — {g:duo|целый мультик}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 1100}
        enter: rise
      - type: text
        text: Эффекты накладываются по одному, и ни одного из них нет в меню — это несколько строк кода. Щёлкните по сцене — следующий.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - type: embed
        theme: true
        interactive: true
        poster: ./assets/cartoon.webp
        code: |-
          <canvas id="c"></canvas>
          <style>
            html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
            canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
          </style>
          <script>
          // Одна фигура — целый мультик. Эффекты накладываются по одному: список steps.
          // Уберите строку из steps — эффект пропадёт; щелчок по сцене — следующий.
          const steps = ['Фигура', 'Пружина', 'Морфинг', 'Градиент', 'Свечение', 'Глаза — уже персонаж', 'Полёт со шлейфом', 'Частицы', 'Клоны на орбите', 'Глитч', 'Финал: конфетти'];
          const has = (name) => steps.indexOf(name) <= level;
          const STEP_MS = 2300;

          const c = document.getElementById('c');
          const x = c.getContext('2d');
          const css = (v, d) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || d;
          const AC = css('--ac', '#4F46E5'), AC2 = css('--ac2', '#0EA5E9'), TX = css('--tx', '#111827'), MU = css('--mu', '#6B7280');
          let W = 0, H = 0, level = 0, since = performance.now(), parts = [], trail = [], confetti = [];
          const fit = () => { const r = devicePixelRatio || 1; W = c.clientWidth; H = c.clientHeight; c.width = W * r; c.height = H * r; x.setTransform(r, 0, 0, r, 0, 0); };
          addEventListener('resize', fit); fit();
          const next = () => { level = level + 1 >= steps.length + 1 ? 0 : level + 1; since = performance.now(); if (level === 0) { trail = []; parts = []; confetti = []; } };
          c.addEventListener('click', next);

          // Форма: круг, а с «Морфингом» — дышащая звезда-клякса
          function blob(cx, cy, R, t, sx = 1, sy = 1) {
            x.beginPath();
            const k = has('Морфинг') ? 0.1 + 0.08 * Math.sin(t * 1.3) : 0;
            for (let i = 0; i <= 96; i++) {
              const a = (i / 96) * Math.PI * 2;
              const r = R * (1 + k * Math.sin(5 * a + t * 2.2));
              const px = cx + Math.cos(a) * r * sx, py = cy + Math.sin(a) * r * sy;
              i ? x.lineTo(px, py) : x.moveTo(px, py);
            }
            x.closePath();
          }
          function paint(cx, cy, R, t, sx, sy, color) {
            blob(cx, cy, R, t, sx, sy);
            if (color) x.fillStyle = color;
            else if (has('Градиент')) {
              const a = t * 0.8, g = x.createLinearGradient(cx - Math.cos(a) * R, cy - Math.sin(a) * R, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
              g.addColorStop(0, AC); g.addColorStop(1, AC2); x.fillStyle = g;
            } else x.fillStyle = AC;
            x.fill();
          }

          function frame(now) {
            const t = now / 1000;
            if (level < steps.length && now - since > STEP_MS) next();
            if (level === steps.length && now - since > 3200) next();
            x.clearRect(0, 0, W, H);
            const stageW = W * 0.62, R = Math.min(stageW, H) * 0.16;
            // Где фигура: в центре сцены, а с «Полётом» — по восьмёрке
            let cx = stageW / 2, cy = H * 0.56;
            if (has('Полёт со шлейфом')) { cx += Math.sin(t * 1.1) * stageW * 0.2; cy += Math.sin(t * 2.2) * H * 0.12; }
            // Пружина: прыжки, сжатие при приземлении
            let sx = 1, sy = 1;
            if (has('Пружина')) {
              const ph = (t * 1.5) % 1, hop = Math.sin(ph * Math.PI);
              cy -= hop * H * 0.14;
              const squash = ph < 0.12 || ph > 0.88 ? 0.22 * (1 - Math.min(ph, 1 - ph) / 0.12) : 0;
              sx = 1 + squash; sy = 1 - squash * 0.8 + (hop > 0.5 ? 0.06 : 0);
              cy += R * (1 - sy);
            }
            // Тень на «полу»
            x.fillStyle = 'rgba(0,0,0,.08)';
            x.beginPath(); x.ellipse(cx, H * 0.56 + R * 1.05, R * (has('Пружина') ? 1.1 - (H * 0.56 - cy) / H : 1.1), R * 0.18, 0, 0, Math.PI * 2); x.fill();
            // Шлейф: прежние положения бледнее
            if (has('Полёт со шлейфом')) {
              trail.push([cx, cy]); if (trail.length > 22) trail.shift();
              trail.forEach(([px, py], i) => { x.globalAlpha = (i / trail.length) * 0.25; paint(px, py, R * (0.5 + i / trail.length / 2), t, sx, sy); });
              x.globalAlpha = 1;
            }
            // Клоны на орбите
            if (has('Клоны на орбите')) for (let i = 0; i < 3; i++) {
              const a = t * 1.6 + i * 2.094;
              paint(cx + Math.cos(a) * R * 1.75, cy + Math.sin(a) * R * 0.65, R * 0.28, t + i, 1, 1);
            }
            // Свечение
            if (has('Свечение')) { x.shadowColor = AC; x.shadowBlur = 30 + 18 * Math.sin(t * 3); }
            // Глитч: короткие сбои — цветные копии со сдвигом и срезы
            const glitch = has('Глитч') && (t % 1.7) < 0.18;
            if (glitch) {
              x.globalCompositeOperation = 'multiply';
              paint(cx - 9, cy, R, t, sx, sy, '#FF2BD6'); paint(cx + 9, cy, R, t, sx, sy, '#22D3EE');
              x.globalCompositeOperation = 'source-over';
            }
            paint(cx, cy, R, t, sx, sy);
            x.shadowBlur = 0;
            if (glitch) { const y0 = cy - R + ((t * 997) % 1) * R * 1.5; const sl = x.getImageData(0, (y0 | 0) * (devicePixelRatio || 1), c.width, 14 * (devicePixelRatio || 1)); x.putImageData(sl, 18 * (devicePixelRatio || 1), (y0 | 0) * (devicePixelRatio || 1)); }
            // Глаза: смотрят по сторонам и моргают
            if (has('Глаза — уже персонаж')) {
              const look = Math.sin(t * 0.9) * 0.6, blink = (t % 3.2) < 0.12 ? 0.1 : 1;
              for (const s of [-1, 1]) {
                const ex = cx + s * R * 0.36, ey = cy - R * 0.18 * sy;
                x.fillStyle = '#fff'; x.beginPath(); x.ellipse(ex, ey, R * 0.2, R * 0.26 * blink, 0, 0, Math.PI * 2); x.fill();
                x.fillStyle = '#111827'; x.beginPath(); x.ellipse(ex + look * R * 0.08, ey + R * 0.04, R * 0.1, R * 0.13 * blink, 0, 0, Math.PI * 2); x.fill();
              }
              x.strokeStyle = '#111827'; x.lineWidth = R * 0.06; x.lineCap = 'round';
              x.beginPath(); x.arc(cx, cy + R * 0.22 * sy, R * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke();
            }
            // Частицы: искры летят из фигуры и падают
            if (has('Частицы') && Math.random() < 0.7) parts.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 6 - 2, life: 1 });
            parts = parts.filter((p) => (p.life -= 0.016) > 0);
            for (const p of parts) {
              p.x += p.vx; p.y += p.vy; p.vy += 0.18;
              x.globalAlpha = p.life; x.fillStyle = p.life > 0.5 ? AC2 : AC;
              x.beginPath(); x.arc(p.x, p.y, 3 + p.life * 3, 0, Math.PI * 2); x.fill();
            }
            x.globalAlpha = 1;
            // Финал: конфетти
            if (has('Финал: конфетти')) {
              if (confetti.length < 160) for (let i = 0; i < 8; i++) confetti.push({ x: Math.random() * stageW, y: -10, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 2 + 2, a: Math.random() * 6, col: [AC, AC2, '#F59E0B', '#EC4899'][i % 4] });
              for (const q of confetti) {
                q.x += q.vx; q.y += q.vy; q.a += 0.1;
                x.save(); x.translate(q.x, q.y); x.rotate(q.a); x.fillStyle = q.col; x.fillRect(-5, -3, 10, 6); x.restore();
              }
            }
            // Рецепт: эффекты по порядку, добавленные — с галочкой, новый — акцентом
            const lx = W * 0.66, ly = H * 0.1, lh = Math.min(34, (H * 0.84) / steps.length);
            x.font = `800 ${Math.round(lh * 0.42)}px system-ui, sans-serif`; x.fillStyle = MU;
            x.fillText('РЕЦЕПТ', lx, ly);
            steps.forEach((s, i) => {
              const y = ly + (i + 1) * lh, on = i <= level, cur = i === Math.min(level, steps.length - 1);
              x.globalAlpha = on ? 1 : 0.28;
              x.fillStyle = cur ? AC : TX;
              x.font = `${cur ? 800 : 600} ${Math.round(lh * 0.5)}px system-ui, sans-serif`;
              x.fillText(`${on ? '✓' : '+'}  ${s}`, lx, y);
            });
            x.globalAlpha = 1;
            requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
          </script>
        place: {x: 40, y: 146, w: 1200, h: 470}
        enter: fade
        delay: 200
      - type: shape
        kind: round
        fill: soft
        radius: 14
        text: "**Как сделать** · двойной щелчок по сцене в студии — её код. Эффекты — список steps в начале: уберите строку — эффект пропадёт, допишите свою функцию — появится новый."
        styles: {text: {size: 15, align: left, leading: 1.4}}
        place: {x: 48, y: 622, w: 1184, h: 58}
        enter: fade
        delay: 600
    notes: |
      Живая вставка с холстом: фигура, на которую по очереди «накидываются» эффекты — пружина, морфинг, градиент,
      свечение, глаза, полёт со шлейфом, частицы, клоны, глитч и конфетти. Каждые две секунды — следующий,
      щелчок по сцене — сразу. Цвета — из темы. В PDF и PowerPoint — кадр-заставка.

