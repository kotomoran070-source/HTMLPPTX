# Новая презентация. После титула — путеводитель и слайды-примеры: оставьте нужные, остальные удалите.
# На слайдах с возможностями внизу — «Как сделать»: что нажать в студии, чтобы получить так же.
# Справочник компонентов: docs/COMPONENTS.md
# Всё правится в студии: «Редактор» на карточке презентации — тексты на слайде, остальное в «Свойствах».
# Логотип: замените assets/logo.svg своим файлом (svg, png или jpg) — он на титуле, в углу слайдов,
# на финальном слайде и в центре QR-кода.

title: "{{title}}"
lang: ru
brand:
  name: "{{title}}"
  logo: ./assets/logo.svg
  # Знак перекрашивается в цвета темы («Дизайн» → «Логотип» → «В цвет темы»). Свой цветной логотип —
  # уберите эту строку, иначе он станет одноцветным
  tint: true
# Цвета презентации: акцент и второй цвет — градиенты и выделенные {g:duo|слова}.
# Поменять — вкладка «Дизайн» в студии (там же 22 готовые темы) или здесь.
theme:
  accent: "#4F46E5"
  accent2: "#0EA5E9"
# Свои анимации презентации: в студии — «Код» (Ctrl+`) → CSS. Действуют на слайдах-холстах,
# объект включает анимацию полем style (см. слайд «Своя анимация в коде»)
css: |
  @keyframes tpl-float { 50% { translate: 0 -22px; } }
  @keyframes tpl-spin { to { rotate: 360deg; } }
  @keyframes tpl-breath { 50% { scale: 1.08; opacity: .55; } }
  @keyframes tpl-hue { to { filter: hue-rotate(360deg); } }

slides:

  - id: cover
    template: canvas
    label: Титульный слайд
    backdrop: aurora
    transition: zoom
    free:
      - type: orbit
        logo: true
        items: [{title: Цели}, {title: Цифры}, {title: План}, {title: Итоги}]
        place: {x: 690, y: 70, w: 560, h: 580}
        enter: scale
        delay: 150
      - type: text
        text: "[Компания] · [Месяц год]"
        styles: {text: {size: 15, weight: 700, upper: true, spacing: 0.16, color: accent}}
        place: {x: 72, y: 150, w: 600}
        enter: fade
      - type: text
        text: "{{title}}"
        styles: {text: {size: 64, weight: 800, leading: 1.05, spacing: -0.02, color: text}}
        valign: bottom
        place: {x: 68, y: 186, w: 620, h: 170}
        enter: rise
        delay: 200
      - type: text
        text: "Подзаголовок: о чём эта презентация — одним предложением."
        styles: {text: {size: 21, color: text2, leading: 1.45}}
        place: {x: 72, y: 378, w: 560}
        enter: rise
        delay: 380
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, text: ИФ, styles: {text: {size: 18, weight: 800}}, style: "padding: 0", place: {x: 72, y: 520, w: 56, h: 56}, enter: pop, delay: 560}
      - type: text
        text: "**Имя Фамилия**\nдолжность, команда"
        styles: {text: {size: 17, color: text2, leading: 1.4}}
        place: {x: 142, y: 520, w: 420}
        enter: fade
        delay: 620
    notes: |
      Представиться и назвать тему. Название, подзаголовок и метки орбит правятся прямо на слайде; метку
      добавить или убрать — «Свойства» → «Метки вокруг». В центре — логотип презентации, в цветах темы.
      Фон «Сияние» — в цветах акцента: «Анимация фона» в свойствах слайда.

  - id: start
    title: С чего {g:duo|начать}
    label: С чего начать
    badge: 4 шага
    transition: push
    gap: 34
    body:
      - type: numbers
        items:
          - {title: Правьте на месте, text: "Щёлкните по тексту и пишите. Свою картинку перетащите на чужую — она встанет в рамку."}
          - {title: Добавляйте, text: "«Вставка» — больше сотни готовых блоков: числа, графики, схемы, формулы. Новый слайд — Ctrl+M."}
          - {title: Оформляйте, text: "«Дизайн» — 22 темы и 39 живых фонов. Наведите на тему — слайды примерят её."}
          - {title: Показывайте, text: "F5 — показ, P — окно докладчика, R — пульт с телефона. «Экспорт» — HTML, PowerPoint, PDF."}
      - type: grid
        columns: 3
        align: stretch
        items:
          - {type: card, title: Сохраняется само, text: "Кнопки «Сохранить» нет. Ctrl+Z — до 200 шагов назад, Ctrl+S — контрольная точка."}
          - {type: card, title: Любая команда — Ctrl+K, text: "Наберите «pdf», «сетка» или «новый слайд» — и Enter. Ctrl+F ищет по всем слайдам."}
          - {type: card, title: Дальше — примеры, text: "У каждого внизу — «Как сделать». Оставьте нужные слайды, остальные удалите (Delete)."}
    notes: |
      Этот слайд и следующие два — подсказки для вас; перед показом их можно удалить.
      Номера с «уровнем воды» — блок «Крупные номера» («Вставка → Схемы»).

  - id: studio
    template: canvas
    label: Это студия
    transition: fade
    free:
      - {type: text, text: Знакомство, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Это {g:duo|студия}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: text
        text: Всё под рукой, как в PowerPoint. Правки сохраняются сами — кнопки «Сохранить» нет.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - type: image
        src: ./assets/ui-studio.webp
        srcDark: ./assets/ui-studio-dark.webp
        radius: 14
        shadow: lg
        stroke: border
        width: 1
        place: {x: 48, y: 156, w: 768, h: 432}
        enter: scale
        delay: 150
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "1", styles: {text: {size: 15, weight: 800}}, place: {x: 377, y: 183, w: 40, h: 40}, style: "padding: 0", enter: pop, delay: 500}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "2", styles: {text: {size: 15, weight: 800}}, place: {x: 71, y: 349, w: 40, h: 40}, style: "padding: 0", enter: pop, delay: 600}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "3", styles: {text: {size: 15, weight: 800}}, place: {x: 297, y: 297, w: 40, h: 40}, style: "padding: 0", enter: pop, delay: 700}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "4", styles: {text: {size: 15, weight: 800}}, place: {x: 735, y: 327, w: 40, h: 40}, style: "padding: 0", enter: pop, delay: 800}
      - {type: shape, kind: ellipse, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, text: "5", styles: {text: {size: 15, weight: 800}}, place: {x: 297, y: 529, w: 40, h: 40}, style: "padding: 0", enter: pop, delay: 900}
      - {type: text, text: "**1 · Лента**\nвкладки как в PowerPoint: главная, вставка, дизайн, анимация, показ", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 160, w: 380}, enter: left, delay: 500}
      - {type: text, text: "**2 · Миниатюры**\nперетащите, чтобы поменять порядок; правый щелчок — меню слайда", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 246, w: 380}, enter: left, delay: 600}
      - {type: text, text: "**3 · Слайд**\nщёлкните по тексту и пишите, объекты тяните мышью", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 332, w: 380}, enter: left, delay: 700}
      - {type: text, text: "**4 · Свойства**\nвсё о выделенном: размер, цвета, вид схемы, ссылка по щелчку", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 418, w: 380}, enter: left, delay: 800}
      - {type: text, text: "**5 · Заметки**\nвидите только вы — в окне докладчика и на пульте", styles: {text: {size: 16, color: text2, leading: 1.45}}, place: {x: 852, y: 504, w: 380}, enter: left, delay: 900}
      - {type: text, text: "Ctrl+K — любая команда · Ctrl+F — поиск по слайдам · Ctrl+Z — отменить · F5 — показ", styles: {text: {size: 14, color: muted}}, place: {x: 50, y: 612, w: 1100}, enter: fade, delay: 1000}
    notes: |
      Снимок — настоящая студия. В тёмной теме он сменится на тёмный: у картинки есть вариант для тёмной темы
      (кнопка «Тёмная тема» на панели картинки).

  - id: contents
    template: canvas
    label: Что внутри
    transition: fade
    free:
      - {type: text, text: Оглавление, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Что {g:duo|внутри}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: text
        text: Щелчок по плитке при показе — переход к разделу. Такую ссылку можно дать любой фигуре.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Текст и цифры**\nключевые числа, тезисы, цитата", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:summary", place: {x: 48, y: 166, w: 284, h: 190}, enter: pop, delay: 180}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Графики и таблицы**\n9 видов диаграмм, таблицы как в Excel", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:data", place: {x: 348, y: 166, w: 284, h: 190}, enter: pop, delay: 240}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Схемы**\nцикл, воронка, дорожная карта — 19 видов", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:schemes", place: {x: 648, y: 166, w: 284, h: 190}, enter: pop, delay: 300}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Анимация и морф**\nпо щелчку, морф, эффекты текста — глитч, неон", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:motion", place: {x: 948, y: 166, w: 284, h: 190}, enter: pop, delay: 360}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Интерактив**\nползунки, формулы, код на слайде", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:interactive", place: {x: 48, y: 372, w: 284, h: 190}, enter: pop, delay: 420}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Медиа**\nфото, фильтры, видео, 3D, свои блоки", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:media", place: {x: 348, y: 372, w: 284, h: 190}, enter: pop, delay: 480}
      - {type: shape, kind: round, fill: surface, stroke: border, shadow: sm, radius: 18, text: "**Оформление**\n22 темы, 39 живых фонов, эффекты", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:design", place: {x: 648, y: 372, w: 284, h: 190}, enter: pop, delay: 540}
      - {type: shape, kind: round, fill: gradient, gradient: {from: accent, to: accent2, angle: 135}, shadow: md, radius: 18, text: "**Импорт и связки**\nPowerPoint, Claude Design, пульт, экспорт", styles: {text: {size: 19, weight: 500, align: left, leading: 1.45}}, action: "slide:import", place: {x: 948, y: 372, w: 284, h: 190}, enter: pop, delay: 600}
      - {type: text, text: "**Как сделать** · выделите фигуру → «Свойства» → «По щелчку» → слайд, ссылка или «Показать объект»", styles: {text: {size: 15, color: text2}}, place: {x: 50, y: 600, w: 1180}, enter: fade, delay: 700}
    notes: |
      Плитки — обычные фигуры со ссылкой на слайд. Удалили раздел — удалите и его плитку.

  - id: summary
    template: canvas
    label: Коротко о главном
    transition: fade
    free:
      - {type: text, text: Главное, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Коротко о {g:duo|главном}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: html
        html: '<div class="kt-halo"><i></i><i></i><i></i><div><div data-t="0" class="kt-grad" style="font-family:var(--font-head, var(--font));font-size:92px;font-weight:800;line-height:1"></div><div data-t="1" style="margin-top:10px;font-size:19px;color:var(--mu)"></div></div></div>'
        texts: [42 %, рост главного показателя]
        place: {x: 40, y: 140, w: 440, h: 440}
        enter: scale
        delay: 150
        count: true
      - type: card
        body: {type: stat, value: "1,2 млн", label: человек охватили, delta: "+15 %", note: с начала года}
        place: {x: 512, y: 156, w: 350, h: 200}
        enter: rise
        delay: 250
        count: true
      - type: card
        body: {type: stat, value: "3", label: "решения, о которых расскажем", note: дальше — по слайду на каждое}
        place: {x: 882, y: 156, w: 350, h: 200}
        enter: rise
        delay: 350
        count: true
      - type: quote
        text: Одна фраза, ради которой стоит досмотреть эту презентацию до конца.
        author: Имя Фамилия
        role: должность
        place: {x: 512, y: 392, w: 720}
        enter: fade
        delay: 500
      - type: chips
        items: [Главный вывод*, Второй факт, Третий факт]
        place: {x: 512, y: 560, w: 720}
        enter: fade
        delay: 650
    notes: |
      Три числа, которые зал должен запомнить: при показе они набегают от нуля («Анимация» → «Число набегает»).
      Число в ореоле — блок «Числа → Число в ореоле». Минус в «delta» — красная стрелка вниз; звёздочка в чипе — выделение.

  - id: points
    title: Было → {g:duo|стало}
    label: Проблема и решение
    badge: Текст
    transition: push
    gap: 64
    body:
      - type: compare
        style: "--cmp-fs: 20px; --cmp-h: 28px; margin-top: 22px"
        items:
          - {title: Сейчас, text: "- Отчёт собирают вручную два дня\n- В цифрах ошибки, их ищут по таблицам\n- Решение ждёт до следующей недели"}
          - {title: С нашим решением, text: "+ Отчёт готов за минуту\n+ Цифры — прямо из данных, без ручного переноса\n+ Решение — в тот же день", accent: true}
      - type: stats
        items:
          - {title: −40 %, text: времени на отчёты}
          - {title: 3 мес., text: окупаемость}
          - {title: ×2, text: быстрее решения}
      - type: chips
        items: [Пилот за 2 недели*, Без доработок у IT, Данные остаются у вас]
    notes: |
      Проблема и решение рядом: «- » в строке — крестик, «+ » — галочка; выбранная колонка поднята.
      Внизу — результат в цифрах. Те же пункты другой схемой — выделите блок → «Свойства» → «Вид».

  - id: data
    title: Цифры и {g:duo|динамика}
    badge: Графики
    transition: push
    gap: 24
    body:
      - type: grid
        columns: 3
        rows: 1.9fr 1fr
        height: 552
        gap: 20
        align: stretch
        items:
          - type: card
            cols: 2
            title: Активные пользователи, тыс
            body:
              type: lines
              labels: [Янв, Фев, Мар, Апр, Май, Июн, Июл, Авг, Сен, Окт, Ноя, Дек]
              series:
                - {name: Веб, values: [42, 44, 47, 46, 52, 55, 58, 61, 66, 70, 73, 79]}
                - {name: Телефон, values: [18, 21, 25, 30, 33, 38, 41, 47, 52, 58, 63, 71]}
          - type: card
            rows: 2
            title: Выручка по каналам
            body: {type: donut, values: [1.42, 0.95, 0.61, 0.42], labels: [Сайт, Партнёры, Магазины, Другое], center: "3,4", sub: млн ₽ за год, unit: " млн", legend: bottom}
          - {type: card, body: {type: stat, value: "36 тыс", label: пользователей в декабре, delta: "+24 %"}}
          - {type: card, body: {type: stat, value: "4,8", label: средняя оценка, note: из 5 — по 1 200 отзывам}}
    notes: |
      Графики — это данные, а не картинки: значения правятся в «Свойствах», в PowerPoint уходят настоящими
      диаграммами, цвета берут из темы. «Вставка → Диаграмма» — ещё доли, рейтинг, кольца целей, столбцы стопкой.

  - id: plan
    title: План и {g:duo|статус}
    badge: Таблицы
    transition: push
    gap: 28
    body:
      - type: table
        variant: stripes
        header: [Этап, Срок, Ответственный, Статус]
        rows:
          - [Исследование, январь, "[имя]", "{#16A34A|● готово}"]
          - [Прототип, март, "[имя]", "{#16A34A|● готово}"]
          - [Пилот, июнь, "[имя]", "{#CA8A04|● идёт}"]
          - [Запуск, сентябрь, "[имя]", "{#64748B|● впереди}"]
        widths: [2, 1, 1.3, 1]
        labels: true
        density: roomy
      - type: grid
        columns: 2
        height: 168
        align: stretch
        items:
          - type: card
            title: Риски
            body: {type: list, items: [Главный риск и как его снижаем, Что может сдвинуть сроки]}
          - type: card
            title: Что нужно от вас
            body: {type: list, items: [Решение или согласование, Ресурсы и сроки]}
    notes: |
      Таблица — как в PowerPoint: протяните мышью по ячейкам, Ctrl+C / Ctrl+V с Excel, Delete удаляет строки,
      «Таблица» → объединить, разбить, сортировка, границы. Ширину столбцов тянут мышью за границу.

  - id: roadmap
    template: canvas
    label: Дорожная карта
    transition: fade
    free:
      - {type: text, text: Процессы, styles: {text: {size: 13, weight: 800, upper: true, spacing: 0.14, color: accent}}, place: {x: 50, y: 30, w: 600}, enter: fade}
      - type: text
        text: Путь к {g:duo|запуску}
        styles: {text: {size: 42, weight: 800, spacing: -0.02, color: text}}
        place: {x: 48, y: 48, w: 900}
        enter: rise
      - type: text
        text: Путь прорисовывается при показе, вехи появляются по очереди. Пройденные — закрашены.
        styles: {text: {size: 17, color: text2}}
        place: {x: 50, y: 106, w: 1100}
        enter: fade
        delay: 100
      - type: roadmap
        items:
          - {title: Исследование, text: I квартал, done: true}
          - {title: Прототип, text: II квартал, done: true}
          - {title: Пилот, text: III квартал}
          - {title: Запуск, text: IV квартал}
        place: {x: 60, y: 150, w: 1160, h: 330}
        enter: fade
        delay: 200
      - type: pipeline
        steps:
          - {title: Идея, sub: формулируем задачу}
          - {title: Прототип, sub: проверяем быстро}
          - {title: Пилот, sub: на реальных данных}
          - {title: Запуск, sub: для всех}
        place: {x: 48, y: 496, w: 1184}
        enter: rise
        delay: 400
      - type: shape
        kind: round
        fill: soft
