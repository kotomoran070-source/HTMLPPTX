        code: |-
          <div id="chart"></div>
          <style>
            body { margin: 0; height: 100vh; display: grid;
                   place-items: center; font: 700 15px system-ui; }
            #chart { display: flex; align-items: end; gap: 14px; height: 70%; }
            .bar { width: 46px; text-align: center; color: var(--tx);
                   border-radius: 12px 12px 4px 4px;
                   background: linear-gradient(var(--ac2), var(--ac));
                   animation: grow .9s cubic-bezier(.3, 1.4, .5, 1) both; }
            .bar::before { content: attr(data-v); position: relative; top: -24px; }
            @keyframes grow { from { height: 0; } }
          </style>
          <script>
            // Поменяйте числа — столбцы перестроятся
            const data = [12, 19, 7, 24, 15, 31];
            const max = Math.max(...data);
            chart.innerHTML = data.map((v, i) => `<div class="bar" data-v="${v}"
              style="height:${v / max * 100}%; animation-delay:${i * 90}ms"></div>`)
              .join('');
            console.log('Сумма:', data.reduce((a, b) => a + b));
          </script>
        place: {x: 48, y: 146, w: 1184, h: 500}
