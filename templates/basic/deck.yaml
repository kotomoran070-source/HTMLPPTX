        styles: {text: {size: 18}}
        action: slide:thanks
        place: {x: 680, y: 450, w: 240, h: 58}
        enter: pop
        delay: 560
      - type: text
        text: Кнопка — тоже фигура. Щелчок при показе ведёт на любой слайд или ссылку
        styles: {text: {size: 14, color: muted}}
        place: {x: 680, y: 524, w: 520}
        enter: fade
        delay: 640
    notes: |
      Холст: объекты стоят там, где их поставили. Тяните мышью, за ручки — размер, кружок над рамкой — поворот.
      Ctrl+D — копия объекта, правый щелчок → «Сохранить как шаблон» — объект в ваших блоках.

  - id: custom
    template: canvas
